<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 화면 전체가 3D 장터. 위에 얇은 한지 패널이 떠 있음.

.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));padding:30px 30px 24px;text-align:center}

  insta:{name:'인스타',cost:10000,eff:{},reach:{학생:.4,관광객:.4}},     // 학생·관광객 10명 중 4명이 먼저 찾아옴
  flyer:{name:'전단',cost:7000,eff:{},reach:{어르신:.35,주민:.35}},         // 어르신·주민 약 3명 중 1명이 먼저 찾아옴
  taste:{name:'시식',cost:8000,eff:{어르신:1.05,주민:1.05,학생:1.05,관광객:1.05},reach:{}}
};
const SPOT_STEP=0;

const hf=(a,b,c)=>{const h=Math.sin(a*9137.1+b*71.3+c*13.7)*43758.5453;return h-Math.floor(h);};
const TEMP=700;              // 손님 취향의 폭(원): 클수록 고르게 나뉨
const EVENTS=[
  {id:'normal',t:'평범한 장날',mul:{},wmul:{},cost:{}},
  {id:'bus',t:'관광버스 도착! 관광객 2.5배',mul:{관광객:2.5},wmul:{},cost:{}},

  {id:'gamup',t:'감 흉년, 감말랭이 원가 +300원',mul:{},wmul:{},cost:{gam:300}},
  {id:'rain',t:'비 오는 날, 손님 40% 감소',mul:{어르신:.6,주민:.6,학생:.6,관광객:.6},wmul:{},cost:{}}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickEvents(seed){const r=rng(seed);const pool=EVENTS.slice(1);const out=[EVENTS[0]];for(let i=0;i<2;i++)out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);return out;}
function unitCost(ev,p,quality){return Math.round((PRODUCTS[p].cost+(ev.cost[p]||0))*(quality==='good'?GOOD:1))+0;}
const CROWD=2.8;             // 손님 규모 (하루 약 290명)
function crowd(ev){const o={};for(const k in TYPES)o[k]=Math.round(TYPES[k].n*CROWD*(ev.mul[k]||1));return o;}
function planCost(ev,d){let c=d.bid||0;for(const p of PK)c+=d.p[p].qty*(unitCost(ev,p,d.quality)+PACK[d.pack].cost);for(const k of d.promo)c+=PROMOS[k].cost;return c;}
function repEff(rep,conf){return 1+Math.max(-.1,Math.min(.18,(rep-3)*.1))*conf;}
// teams: [{spot, p:{gam:{price,qty},ice:{...}}, quality, pack, promo:[], bid, rep, repConf}]
function simulate(ev,teams,seed){
  const r=rng(seed),c0=crowd(ev),fr=rng(seed*7+3),c={},list=[];let real=0,expect=0;
  // 예상 손님은 미리 알려 주지만, 실제로는 종류마다 ±25% 안에서 더 오거나 덜 온다
  for(const k in c0){c[k]=Math.round(c0[k]*(0.75+fr()*0.5));real+=c[k];expect+=c0[k];}
  for(const k in c)for(let i=0;i<c[k];i++){const w={};for(const p of PK){const [a,b]=TYPES[k].wtp[p];w[p]=(a+(b-a)*r())*(ev.wmul[p]||1);}list.push({type:k,w,o:r()});}
  list.sort((a,b)=>a.o-b.o);
  const st=teams.map(t=>({left:{gam:t.p.gam.qty,ice:t.p.ice.qty},sold:{gam:0,ice:0},sales:0,face:[0,0,0,0],sat:[]}));
  for(const cu of list){
    let best=null;const seen=new Set(),opts=[];
    teams.forEach((t,i)=>{
      // 지나가며 볼지(자리) + 홍보를 보고 일부러 찾아올지
      let came=false;t.promo.forEach((k,j)=>{const rc=PROMOS[k].reach[cu.type]||0;if(rc&&hf(cu.o,i+1,j+5)<rc)came=true;});
      if(!came&&hf(cu.o,t.spot+11,3)>=PASS[t.spot])return;
      let b=(PACK[t.pack].eff[cu.type]||1)*repEff(t.rep,t.repConf)*(t.quality==='good'?QUAL:1);for(const k of t.promo)b*=PROMOS[k].eff[cu.type]||1;
      for(const p of PK){if(st[i].left[p]<=0)continue;const v=cu.w[p]*b,pr=t.p[p].price;
        if(v>=pr)opts.push({i,p,v,u:v-pr+(came?REACH_BONUS:0)});else seen.add(i);}});
    // 손님마다 취향이 달라, 비슷한 조건이면 여러 가게로 고르게 나뉜다 (차이가 클수록 좋은 곳에 몰림)
    if(opts.length){const mx=Math.max(...opts.map(o=>o.u));let sum=0;opts.forEach(o=>{o.w=Math.exp((o.u-mx)/TEMP);sum+=o.w;});let bs=-1;for(const o of opts){const h=Math.sin(cu.o*9137.1+o.i*71.3+(o.p==='gam'?0:13.7))*43758.5453,s=o.w/(1+st[o.i].sold[o.p])*(1+(h-Math.floor(h))*.4);if(s>bs){bs=s;best=o;}}}
    if(!best)seen.forEach(i=>st[i].face[3]++);
    if(!best){cu.buy=-1;cu.face=seen.size?3:-1;continue;}
    const t=teams[best.i],pr=t.p[best.p].price,ratio=pr/best.v,face=ratio<.6?0:ratio<.85?1:2;
    cu.buy=best.i;cu.prod=best.p;cu.face=face;
    const s=st[best.i];s.face[face]++;s.left[best.p]--;s.sold[best.p]++;s.sales+=pr;
    s.sat.push(Math.max(1,Math.min(5,3+(t.quality==='good'?1.2:0)+[1,.4,-1][face])));
  }
  const res=teams.map((t,i)=>{const s=st[i],cost=planCost(ev,t),n=s.sat.length,star=n?s.sat.reduce((a,b)=>a+b,0)/n:null,waste=s.left.gam+s.left.ice;
    return{...s,cost,profit:s.sales-cost,star,n,waste};});
  return{list,res,real,expect};
}
// 무엇이 얼마나 통했나: 한 팀의 한 가지 선택만 빼고 같은 장날을 다시 돌려 비교한다
function attribution(ev,teams,seed){const base=simulate(ev,teams,seed).res,n=teams.length,sold=x=>x.sold.gam+x.sold.ice;
  return teams.map((t,i)=>{const out=[];const test=(label,mod)=>{const alt=teams.map((u,j)=>j===i?mod(JSON.parse(JSON.stringify(u))):u);const r=simulate(ev,alt,seed).res[i];out.push({label,dSold:sold(base[i])-sold(r),dProfit:base[i].profit-r.profit});};
    if(t.spot<n-1)test('자리',u=>{u.spot=n-1;u.bid=0;return u;});
    if(t.quality==='good')test('좋은 재료',u=>{u.quality='normal';return u;});
    if(t.pack==='pretty')test('선물 포장',u=>{u.pack='basic';return u;});
    t.promo.forEach(k=>test(PROMOS[k].name,u=>{u.promo=u.promo.filter(x=>x!==k);return u;}));
    if(t.repConf>0&&Math.abs(t.rep-3)>.05)test('별점',u=>{u.rep=3;u.repConf=0;return u;});
    return out;});}
function nextRep(t,r){if(r.star==null)return{rep:t.rep,conf:t.repConf*.6};return{rep:t.rep*.4+r.star*.6,conf:Math.min(1,r.n/10)};}
return{START,PRODUCTS,PK,TYPES,GOOD,PACK,PROMOS,EVENTS,SPOT_STEP,rng,pickEvents,unitCost,crowd,planCost,simulate,nextRep,repEff,attribution,PASS,REACH_BONUS};
})();

  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)want.dist=clamp(want.dist*lastPinch/d,10,150);lastPinch=d;pan(dx/2,dy/2);return;}
  if(mode==='pan')pan(dx,dy);else{want.yaw-=dx*.006;want.pitch=clamp(want.pitch+dy*.004,.22,1.38);}});

const ease=t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
function raiseShop(i){const t=G.teams[i],po=W.plotObjs[t.spot];if(po.shop)W.scene.remove(po.shop);
  const s=W.makeShop(t),p=W.PLOTS[t.spot];s.position.set(p.x,0,p.z);s.rotation.y=p.ry;s.scale.setScalar(.01);W.scene.add(s);po.shop=s;
  let k=0;W.tickers.push(dt=>{k=Math.min(1,k+dt*1.6);s.scale.setScalar(Math.max(.01,ease(k)));return k<1;});
  dust(p.x,p.z);}
function dust(x,z){const g=new T.Group();g.position.set(x,0,z);W.scene.add(g);const m=new T.MeshLambertMaterial({color:'#E8DCC0',transparent:true,opacity:.8});
  for(let i=0;i<10;i++){const s=new T.Mesh(new T.SphereGeometry(.5,6,4),m);const a=i/10*6.28;s.userData.v=[Math.cos(a)*3,1.2,Math.sin(a)*3];s.position.y=.4;g.add(s);}
  let k=0;W.tickers.push(dt=>{k+=dt;g.children.forEach(s=>{s.position.x+=s.userData.v[0]*dt;s.position.z+=s.userData.v[2]*dt;s.position.y+=s.userData.v[1]*dt;s.scale.setScalar(1+k*2);});m.opacity=Math.max(0,.8-k*1.1);if(k>.8){W.scene.remove(g);return false;}});}
function clearShops(){W.plotObjs.forEach(po=>{const s=po.shop;if(!s)return;po.shop=null;let k=1;W.tickers.push(dt=>{k-=dt*2.5;s.scale.setScalar(Math.max(.01,k));if(k<=0){W.scene.remove(s);return false;}});});}
function growProps(){W.plotObjs.forEach(po=>{if(!po.shop)return;po.shop.userData.props.children.forEach((c,j)=>{let k=-j*.15;W.tickers.push(dt=>{k+=dt*2;const e=Math.max(.01,ease(Math.max(0,Math.min(1,k))));c.scale.set(c.userData.base.x*e,c.userData.base.y*e,c.userData.base.z*e);if(c.userData.spin)c.rotation.y+=dt*2;return k<1||!!c.userData.spin;});});});}
let glowT=null;
function glowPlot(i){W.plotObjs.forEach(p=>p.glow.material.opacity=0);if(i<0)return;let t=0;const po=W.plotObjs[i];glowT=po;
  W.tickers.push(dt=>{if(glowT!==po){po.glow.material.opacity=0;return false;}t+=dt;po.glow.material.opacity=.25+Math.sin(t*4)*.2;});}

/* ---------- 화면 틀 ---------- */
const STEPS=[['open','장터 보기'],['meet','회의'],['auction','경매'],['decide','가게 준비'],['market','장 열기'],['result','결산']];

const pct=v=>v>=.99?'거의 모두':'약 '+Math.round(v*100)+'%';

function promoHTML(){const c=E.crowd(ev());const P=E.PROMOS,reachN=k=>Object.entries(P[k].reach).reduce((a,[t,v])=>a+c[t]*v,0);

  return `<h4>지난 장날 동향 <small>${s.ev}</small></h4><table class="crowd"><tr><th></th><th>평균 값</th><th>평균 판매율</th><th>다 팔린 가게</th></tr>${E.PK.map(p=>`<tr><td><b>${E.PRODUCTS[p].name}</b></td><td class="n">${won(s[p].avg)}</td><td>${s[p].rate}%</td><td>${s[p].out}곳</td></tr>`).join('')}</table>
   <p class="hint">실제 손님 ${s.real}명 (예상 ${s.expect}명) · 가장 많이 남긴 팀: ${s.best}</p>`;}
function crowdHTML(){const c=E.crowd(ev());const likes={어르신:'전단',주민:'전단 · 선물포장',학생:'인스타',관광객:'인스타 · 선물포장'};const tot=Object.values(c).reduce((a,b)=>a+b,0);

   Object.keys(E.TYPES).map(k=>`<tr><td><span class="who"><i style="background:${TYPE_COL[k]}"></i>${k}</span><span class="likes">${likes[k]}</span></td><td class="n">${c[k]}</td>${E.PK.map(p=>{const [a,b]=E.TYPES[k].wtp[p],m=ev().wmul[p]||1;return `<td>${won(Math.round(a*m/100)*100)}~${won(Math.round(b*m/100)*100)}</td>`}).join('')}</tr>`).join('')}</table>
   <div class="costs"><span>원가 · 감말랭이 <b>${won(E.unitCost(ev(),'gam','normal'))}</b></span><span>아이스홍시 <b>${won(E.unitCost(ev(),'ice','normal'))}</b></span></div></div>`;}
function sheet(html){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="panel sheet">${html}</div>`;document.body.appendChild(s);return s;}
function toast(t){const d=document.createElement('div');d.className='panel toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}

/* ---------- 0. 시작 ---------- */
let orbitOn=true;W.tickers.push(dt=>{if(orbitOn)W.want.yaw+=dt*.04;});
function title(){orbitOn=true;W.view.all();W.flyTo({dist:110,pitch:.55});
  ui.innerHTML=`<div class="panel hero"><h1>청도 <em>장날</em></h1><p>사흘 동안 장사해서, 가장 많이 남긴 팀이 이깁니다.</p>
   <div style="font-size:13px;color:var(--ink3);margin-bottom:8px">참여하는 팀을 눌러 주세요 · 나머지는 컴퓨터가 맡아요</div><div class="seg" id="seg">${G.teams.map((t,i)=>`<button data-n="${i}" class="${t.ai?'':'on'}" style="${t.ai?'':'color:'+t.col}">${t.name}</button>`).join('')}</div>
   <div class="row"><button class="line" id="rules">장날 규칙</button><button class="go" id="start">장터 열기</button></div></div>`;
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{const i=+b.dataset.n,set=G.teams.map((t,k)=>t.ai?-1:k).filter(k=>k>=0);const nx=set.includes(i)?set.filter(k=>k!==i):[...set,i];if(!nx.length)return;newTeams(nx);title();});
  $('#rules').onclick=showRules;$('#start').onclick=()=>{orbitOn=false;go('open');};}
function showRules(){const s=sheet(`<h3>장날 규칙</h3><p class="sub">경기 전에 한 번 읽어 주세요.</p><div class="rules">
  <div class="rule"><b>매일 150,000원</b><span>날마다 모든 팀이 같은 밑천으로 시작해요.</span></div>
  <div class="rule"><b>집터 경매</b><span>입구에 가까울수록 손님이 먼저 들러요. 끝자리는 무료예요.</span></div>
  <div class="rule"><b>손님은 예상일 뿐</b><span>손님 수는 예상보다 많거나 적게 올 수 있어요. 하나씩만 사요.</span></div>
  <div class="rule"><b>손님이 보는 것</b><span>가격, 재료, 포장, 홍보, 별점, 자리.</span></div>
  <div class="rule"><b>남으면 버려요</b><span>팔고 남은 물건은 그날 모두 버려요.</span></div>
  <div class="rule"><b>언제나 5팀</b><span>참가 팀이 적으면 나머지 가게는 컴퓨터가 맡아요.</span></div>
  <div class="rule"><b>별점은 이어져요</b><span>오늘 손님의 후기가 내일 손님을 불러와요.</span></div></div>

/* ---------- 1. 장터 보기 ---------- */
function open(){G.teams.forEach(t=>{t.spot=null;t.bid=0;t.ready=false;});clearShops();shopTags.forEach(dropTag);shopTags=[];
  W.view.all();showPlotTags();
  frame(`<div class="lab">${DAY[G.day]} 장터<small>손님과 집터를 살펴보세요</small></div><button class="go" id="next">회의 시작</button>`,{side:true});
  W.onPick=i=>{if(i<G.n)W.view.plot(i);};$('#next').onclick=()=>go('meet');}

/* ---------- 2. 회의 ---------- */
let timerId=0;
function meet(){let left=180;W.view.all();
  frame(`<button class="line" id="m">−30초</button><div class="timer" id="tm">3:00</div><button class="line" id="p">+30초</button><span class="vr"></span><button class="go" id="next">경매 시작</button>`,{side:true});
  const draw=()=>{const e=$('#tm');if(!e)return;e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');e.classList.toggle('low',left<=20);};
  clearInterval(timerId);timerId=setInterval(()=>{left=Math.max(0,left-1);draw();},1000);
  $('#m').onclick=()=>{left=Math.max(0,left-30);draw();};$('#p').onclick=()=>{left+=30;draw();};
  W.onPick=i=>{if(i<G.n)W.view.plot(i);};
  $('#next').onclick=()=>{clearInterval(timerId);A={spot:0,price:0,lead:null,hist:[]};go('auction');};}

/* ---------- 3. 경매 ---------- */
let A=null;
let aiTimer=0;
function aiMax(t,spot){if(!t.aiBid||t.aiBid.day!==G.day){const greed=Math.random();t.aiBid={day:G.day,v:[0,1,2,3,4].map(s=>Math.max(0,Math.round((greed*22000-s*5500+Math.random()*6000)/5000)*5000))};}return t.aiBid.v[spot]||0;}
function auction(){const free=G.teams.filter(t=>t.spot===null);
  if(A.spot>=G.n-1||free.length<=1)return finishAuction();
  showPlotTags(A.spot);glowPlot(A.spot);W.view.plot(A.spot);
  const nxt=A.price?A.price+5000:5000,lead=A.lead!==null?G.teams[A.lead]:null;
  frame(`<div class="auc"><div class="lot"><small>지금 경매</small><b>${A.spot+1}번 집터${A.spot===0?' · 명당':''}</b></div>
   <div class="price">${A.price?won(A.price):'—'}<small style="color:${lead?lead.col:''}">${lead?lead.name+' 최고가':'5,000원부터'}</small></div>
   <span class="vr"></span><div class="bidders">${G.teams.map((t,i)=>{const can=t.spot===null&&nxt<=E.START&&A.lead!==i;return `<button data-i="${i}" style="background:${t.col}" ${can?'':'disabled'}>${t.name}<small>${t.ai?'자동 · ':''}${t.spot!==null?(t.spot+1)+'번 확정':'+'+won(nxt)}</small></button>`}).join('')}</div>
   <span class="vr"></span><button class="line" id="undo" ${A.hist.length?'':'disabled'}>되돌리기</button><button class="line" id="pass">유찰</button><button class="go" id="sold" ${lead?'':'disabled'}>낙찰</button></div>`,{side:true});
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{A.hist.push([A.price,A.lead]);A.price=nxt;A.lead=+b.dataset.i;auction();});
  // 컴퓨터 팀: 마음속 최고가 안이면 잠시 뒤 따라 부른다
  const bots=G.teams.map((t,i)=>i).filter(i=>{const t=G.teams[i];return t.ai&&t.spot===null&&A.lead!==i&&aiMax(t,A.spot)>=nxt;});
  if(bots.length){const key=A.spot+':'+A.price;clearTimeout(aiTimer);aiTimer=setTimeout(()=>{if(G.phase!=='auction'||A.spot+':'+A.price!==key)return;const i=bots[Math.floor(Math.random()*bots.length)];A.hist.push([A.price,A.lead]);A.price=nxt;A.lead=i;toast(G.teams[i].name+' (자동) '+won(nxt)+'원');auction();},1300);}
  $('#undo').onclick=()=>{const h=A.hist.pop();if(h){A.price=h[0];A.lead=h[1];}auction();};
  $('#pass').onclick=()=>{A={spot:A.spot+1,price:0,lead:null,hist:[]};auction();};
  $('#sold').onclick=()=>{const i=A.lead,t=G.teams[i];t.spot=A.spot;t.bid=A.price;t.bidsTotal+=A.price;raiseShop(i);toast(`${t.name} · ${A.spot+1}번 집터 ${won(A.price)}원 낙찰`);A={spot:A.spot+1,price:0,lead:null,hist:[]};setTimeout(auction,700);};}
function finishAuction(){glowPlot(-1);const empty=[];for(let s=0;s<G.n;s++)if(!G.teams.some(t=>t.spot===s))empty.push(s);
  G.teams.filter(t=>t.spot===null).forEach((t,k)=>{t.spot=empty[empty.length-1-k];t.bid=0;raiseShop(G.teams.indexOf(t));});
  showPlotTags();W.view.all();showShopTags('name');
  frame(`<div class="lab">자리 확정<small>모든 가게가 들어섰어요</small></div><button class="go" id="next">가게 준비</button>`);
  W.onPick=i=>W.view.plot(i);$('#next').onclick=()=>go('decide');}

/* ---------- 4. 비밀 결정 ---------- */
function aiPlan(t){const ev0=ev(),pick=['cheap','premium','promo','balanced'][Math.floor(Math.random()*4)],j=a=>Math.round((a+(Math.random()-.5)*400)/100)*100;
  const d={p:{gam:{price:2500,qty:0},ice:{price:2400,qty:0}},quality:'normal',pack:'basic',promo:[]};
  if(pick==='cheap'){d.p.gam.price=j(1900);d.p.ice.price=j(1900);}
  if(pick==='premium'){d.quality='good';d.pack='pretty';d.p.gam.price=j(3200);d.p.ice.price=j(3100);}
  if(pick==='promo'){d.promo=Math.random()<.5?['insta']:['flyer','taste'];d.p.gam.price=j(2400);d.p.ice.price=j(2300);}
  if(pick==='balanced'){d.quality=Math.random()<.5?'good':'normal';d.promo=['flyer'];d.p.gam.price=j(2600);d.p.ice.price=j(2500);}
  const share=.45+Math.random()*.3;let budget=(E.START-t.bid)*share;const fixed=d.promo.reduce((a,k)=>a+E.PROMOS[k].cost,0);budget-=fixed;
  const uc=p=>E.unitCost(ev0,p,d.quality)+E.PACK[d.pack].cost;const g=Math.max(0,Math.floor(budget*.6/uc('gam')/5)*5),i=Math.max(0,Math.floor(budget*.4/uc('ice')/5)*5);
  d.note={cheap:'싸게 많이 팔아서 손님을 모은다',premium:'좋은 재료와 선물 포장으로 비싸게 판다',promo:'홍보로 손님을 끌어온다',balanced:'적당한 값에 꾸준히 판다'}[pick];
  d.p.gam.qty=g;d.p.ice.qty=i;while(E.planCost(ev0,{...d,bid:t.bid})>E.START&&d.p.gam.qty>0)d.p.gam.qty-=5;return d;}
function decide(){G.teams.forEach(t=>{if(t.ai&&!t.ready){t.d=aiPlan(t);t.ready=true;}});const all=G.teams.every(t=>t.ready);

function econCards(L){const out=[],T=G.teams,uc=(t,p)=>E.unitCost(ev(),p,t.d.quality)+E.PACK[t.d.pack].cost;

    const rl=lo.s/lo.q,rh=hi.s/hi.q;out.push({k:'경쟁과 가격',t:`같은 ${E.PRODUCTS[p].name}, 값이 달랐어요`,d:`${lo.t.name}은 ${won(lo.pr)}원에 ${lo.s}개(${Math.round(rl*100)}%), ${hi.t.name}은 ${won(hi.pr)}원에 ${hi.s}개(${Math.round(rh*100)}%)를 팔았어요. ${rl>rh?'손님은 비교해서 더 싼 곳으로 갔어요.':'비싸도 포장·홍보·별점이 좋으면 팔려요.'}`});});
  const opp=T.map((t,i)=>({t,e:(L.eff[i]||[]).find(x=>x.label==='자리')})).filter(x=>x.t.bid>0&&x.e&&x.e.dProfit<0).sort((a,b)=>a.e.dProfit-b.e.dProfit)[0];
  if(opp)out.push({k:'기회비용',t:'그 돈을 다른 곳에 썼다면?',d:`${opp.t.name}은 자리값 ${won(opp.t.bid)}원을 냈지만 더 판 개수는 ${opp.e.dSold}개였어요. 그 돈으로 재료를 더 사거나 홍보를 했다면 어땠을까요?`});
  const ad=T.map((t,i)=>({t,e:(L.eff[i]||[]).filter(x=>['인스타','전단','시식'].includes(x.label)).sort((a,b)=>b.dProfit-a.dProfit)[0]})).filter(x=>x.e&&x.e.dProfit>0).sort((a,b)=>b.e.dProfit-a.e.dProfit)[0];
  if(ad)out.push({k:'광고 효과',t:'광고비보다 더 벌었어요',d:`${ad.t.name}의 ${ad.e.label}는 ${ad.e.dSold}개를 더 팔게 해서, 광고비를 빼고도 ${won(ad.e.dProfit)}원을 더 남겼어요.`});
  if(ev().id!=='normal')out.push({k:'수요 변화',t:'날마다 손님이 달라요',d:`${ev().t}. 같은 물건이라도 그날 사정에 따라 잘 팔리는 정도가 달라져요.`});
  if(!out.length)out.push({k:'시장',t:'비슷하게 팔린 하루',d:'팀들의 선택이 비슷해서 큰 차이가 없었어요. 내일은 다른 전략을 써 볼까요?'});
  return out.slice(0,4);}

/* ---------- 7. 시상 ---------- */
function awards(){orbitOn=true;W.flyTo({dist:80,pitch:.6});const T2=G.teams,by=f=>T2.slice().sort((a,b)=>f(b)-f(a))[0];
  const best=by(t=>t.total),sat=by(t=>t.rep),thrift=by(t=>-t.waste),rise=by(t=>t.ranks[0]-t.ranks[2]),bid=T2.filter(t=>t.bidsTotal>0),hunt=bid.length?bid.slice().sort((a,b)=>b.total/b.bidsTotal-a.total/a.bidsTotal)[0]:null;
  const A2=[['최고 장사꾼',best,'사흘 이익 '+won(best.total)+'원'],['손님 만족',sat,'별점 '+sat.rep.toFixed(1)],['알뜰 경영',thrift,'버린 물건 '+thrift.waste+'개'],['역전',rise,rise.ranks[0]+'위 → '+rise.ranks[2]+'위'],...(hunt?[['명당 사냥꾼',hunt,'자리값 '+won(hunt.bidsTotal)+'원']]:[])];
  frame(`<div class="lab">시상식</div><button class="line" id="again">처음으로</button>`);
  const s=sheet(`<h3>청도 장날 시상식</h3><p class="sub">사흘 동안 수고했어요.</p><div class="awards">${A2.map(([a,t,d])=>`<div class="award"><span class="t">${a}상</span><span class="w" style="color:${t.col}">${t.name}</span><span class="d">${d}</span></div>`).join('')}</div><div class="foot"><button class="go" id="c">닫기</button></div>`);
  s.querySelector('#c').onclick=()=>s.remove();
  $('#again').onclick=()=>{G.day=0;G.applied=-1;G.events=E.pickEvents(Date.now()%99991);clearShops();shopTags.forEach(dropTag);shopTags=[];newTeams(G.teams.map((t,k)=>t.ai?-1:k).filter(k=>k>=0));go('title');};}

go('title');
})();
