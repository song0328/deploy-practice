<style>
/* 화면 전체가 3D 장터. 위에 얇은 한지 패널이 떠 있음.

html,body{height:100%;overflow:hidden}
body{background:#BFE0EE;color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}

.stepper{display:flex;align-items:center;background:#fff;border-radius:10px;box-shadow:inset 0 0 0 1px var(--rule)}

.stepper output{min-width:72px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.opt h5{margin:0 0 6px;font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule);font-weight:500;padding:8px 12px;display:grid;text-align:left;gap:1px}
.chips button small{font-size:11px;color:var(--ink3);font-weight:400}
.chips button.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--ink);color:#fff}

.wallet{display:grid;gap:8px;background:var(--paper2);border-radius:12px;padding:14px 16px}
.wallet .nums{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}

.wallet .nums b.neg{color:var(--bad)}
.bar{height:8px;background:#fff;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .2s}
.bar.over i{background:var(--bad)}
/* 결과 */
.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

.res .tm i{width:12px;height:12px;border-radius:3px}

.pos{color:var(--good)}.neg{color:var(--bad)}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}

const ENGINE=(function(){

// 파는 물건 5가지. max: 하루 준비 한도
const PRODUCTS={

};
const PK=Object.keys(PRODUCTS);
const MAXPICK=2;                  // 팀이 고를 수 있는 물건 수
const TYPES={                     // 손님 종류별 하루 기본 인원과, 물건마다 낼 마음이 있는 값의 범위
  어르신:{n:38,wtp:{bansi:[2200,4000],jam:[1200,2600],berry:[800,1800],pen:[500,1500],minari:[2000,3600]}},
  주민:{n:26,wtp:{bansi:[1800,3400],jam:[2400,4200],berry:[1500,2800],pen:[900,2200],minari:[2000,3400]}},
  학생:{n:22,wtp:{bansi:[800,1800],jam:[1000,2200],berry:[2000,3400],pen:[2400,4200],minari:[1800,3000]}},
  관광객:{n:16,wtp:{bansi:[2000,3800],jam:[2600,4800],berry:[2200,3800],pen:[3000,5600],minari:[2200,3800]}}
};
const GOOD=1.4;                   // 좋은 재료 원가 배수
const QUAL=1.1;                   // 좋은 재료는 보기에도 좋아 조금 더 낼 마음
const PACK={basic:{cost:0,eff:{}},pretty:{cost:300,eff:{관광객:1.35,주민:1.2,학생:1.12,어르신:1.08}}};
const PROMOS={
  insta:{name:'인스타',cost:10000,eff:{},reach:{학생:.4,관광객:.4}},
  flyer:{name:'전단',cost:7000,eff:{},reach:{어르신:.35,주민:.35}},
  taste:{name:'시식',cost:8000,eff:{어르신:1.05,주민:1.05,학생:1.05,관광객:1.05},reach:{}}
};
const PASS=[1,.9,.75,.75,.55,.5]; // 집터별로 손님이 지나가며 볼 확률
const REACH_BONUS=700;            // 홍보를 보고 찾아온 손님은 그 가게를 조금 더 좋게 본다(원)
const MONO=400;                   // 그 물건을 파는 가게가 하나뿐이면 비교할 곳이 없어 조금 더 쉽게 산다(원)
const hf=(a,b,c)=>{const h=Math.sin(a*9137.1+b*71.3+c*13.7)*43758.5453;return h-Math.floor(h);};
const TEMP=700;
const EVENTS=[
  {id:'normal',t:'평범한 장날',mul:{},wmul:{},cost:{}},
  {id:'bus',t:'관광버스 도착! 관광객 2.5배',mul:{관광객:2.5},wmul:{},cost:{}},
  {id:'hot',t:'더운 날, 딸기 반쪽 인기 ↑',mul:{},wmul:{berry:1.4},cost:{}},
  {id:'fest',t:'청도 축제! 학생 2배',mul:{학생:2,주민:1.2},wmul:{},cost:{}},
  {id:'gamup',t:'감 흉년, 반시 원가 +500원',mul:{},wmul:{},cost:{bansi:500}},
  {id:'minari',t:'미나리 철! 주먹밥 인기 ↑',mul:{어르신:1.3},wmul:{minari:1.3},cost:{}},
  {id:'rain',t:'비 오는 날, 손님 40% 감소',mul:{어르신:.6,주민:.6,학생:.6,관광객:.6},wmul:{berry:.6},cost:{}}
];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickEvents(seed){const r=rng(seed);const pool=EVENTS.slice(1);const out=[EVENTS[0]];for(let i=0;i<2;i++)out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);return out;}
function unitCost(ev,p,quality){return Math.round((PRODUCTS[p].cost+(ev.cost[p]||0))*(quality==='good'?GOOD:1));}
const CROWD=2.8;
function crowd(ev){const o={};for(const k in TYPES)o[k]=Math.round(TYPES[k].n*CROWD*(ev.mul[k]||1));return o;}
function planCost(ev,d){let c=d.bid||0;for(const p of PK)c+=(d.p[p]?d.p[p].qty:0)*(unitCost(ev,p,d.quality)+PACK[d.pack].cost);for(const k of d.promo)c+=PROMOS[k].cost;return c;}
function repEff(rep,conf){return 1+Math.max(-.1,Math.min(.18,(rep-3)*.1))*conf;}
const sells=(t,p)=>t.p[p]&&t.p[p].qty>0;
// 집터 정하기: 비밀 입찰. want(원하는 집터)·bid(금액) → 집터마다 최고 금액 팀이 가져감. 못 가져간 팀은 남은 집터를 금액 순으로 무료로 받음
function resolveSpots(teams,n){const spot=teams.map(()=>null),paid=teams.map(()=>0),log=[];
  for(let s=0;s<n-1;s++){const c=teams.map((t,i)=>({i,bid:t.bid||0,o:t.order||i})).filter(x=>spot[x.i]===null&&teams[x.i].want===s&&x.bid>0).sort((a,b)=>b.bid-a.bid||a.o-b.o);
    if(c.length){spot[c[0].i]=s;paid[c[0].i]=c[0].bid;}log.push({s,bids:c,winner:c.length?c[0].i:null});}
  const free=[];for(let s=0;s<n;s++)if(!spot.includes(s))free.push(s);
  teams.map((t,i)=>({i,bid:t.bid||0,o:t.order||i})).filter(x=>spot[x.i]===null).sort((a,b)=>b.bid-a.bid||a.o-b.o).forEach(x=>{spot[x.i]=free.shift();});
  return{spot,paid,log};}
// teams: [{spot, p:{bansi:{price,qty},...}, quality, pack, promo:[], bid, rep, repConf}]
function simulate(ev,teams,seed){
  const r=rng(seed),c0=crowd(ev),fr=rng(seed*7+3),c={},list=[];let real=0,expect=0;
  for(const k in c0){c[k]=Math.round(c0[k]*(0.75+fr()*0.5));real+=c[k];expect+=c0[k];}
  for(const k in c)for(let i=0;i<c[k];i++){const w={};for(const p of PK){const [a,b]=TYPES[k].wtp[p];w[p]=(a+(b-a)*r())*(ev.wmul[p]||1);}list.push({type:k,w,o:r()});}
  list.sort((a,b)=>a.o-b.o);
  const sellers={};for(const p of PK)sellers[p]=teams.filter(t=>sells(t,p)).length;
  const st=teams.map(t=>{const left={},sold={};for(const p of PK){left[p]=sells(t,p)?t.p[p].qty:0;sold[p]=0;}return{left,sold,sales:0,face:[0,0,0,0],sat:[]};});
  for(const cu of list){
    let best=null;const seen=new Set(),opts=[];
    teams.forEach((t,i)=>{
      let came=false;t.promo.forEach((k,j)=>{const rc=PROMOS[k].reach[cu.type]||0;if(rc&&hf(cu.o,i+1,j+5)<rc)came=true;});
      if(!came&&hf(cu.o,t.spot+11,3)>=PASS[t.spot])return;
      let b=(PACK[t.pack].eff[cu.type]||1)*repEff(t.rep,t.repConf)*(t.quality==='good'?QUAL:1);for(const k of t.promo)b*=PROMOS[k].eff[cu.type]||1;
      for(const p of PK){if(st[i].left[p]<=0)continue;const v=cu.w[p]*b,pr=t.p[p].price;
        if(v>=pr)opts.push({i,p,v,u:v-pr+(came?REACH_BONUS:0)+(sellers[p]===1?MONO:0)});else seen.add(i);}});
    if(opts.length){const mx=Math.max(...opts.map(o=>o.u));opts.forEach(o=>{o.w=Math.exp((o.u-mx)/TEMP);});let bs=-1;for(const o of opts){const h=Math.sin(cu.o*9137.1+o.i*71.3+PK.indexOf(o.p)*13.7)*43758.5453,s=o.w/(1+st[o.i].sold[o.p])*(1+(h-Math.floor(h))*.4);if(s>bs){bs=s;best=o;}}}
    if(!best)seen.forEach(i=>st[i].face[3]++);
    if(!best){cu.buy=-1;cu.face=seen.size?3:-1;continue;}
    const t=teams[best.i],pr=t.p[best.p].price,ratio=pr/best.v,face=ratio<.6?0:ratio<.85?1:2;
    cu.buy=best.i;cu.prod=best.p;cu.face=face;
    const s=st[best.i];s.face[face]++;s.left[best.p]--;s.sold[best.p]++;s.sales+=pr;
    s.sat.push(Math.max(1,Math.min(5,3+(t.quality==='good'?1.2:0)+[1,.4,-1][face])));
  }
  const res=teams.map((t,i)=>{const s=st[i],cost=planCost(ev,t),n=s.sat.length,star=n?s.sat.reduce((a,b)=>a+b,0)/n:null,waste=PK.reduce((a,p)=>a+s.left[p],0);
    return{...s,cost,profit:s.sales-cost,star,n,waste};});
  return{list,res,real,expect,sellers};
}
function attribution(ev,teams,seed){const base=simulate(ev,teams,seed).res,n=teams.length,sold=x=>PK.reduce((a,p)=>a+x.sold[p],0);
  return teams.map((t,i)=>{const out=[];const test=(label,mod)=>{const alt=teams.map((u,j)=>j===i?mod(JSON.parse(JSON.stringify(u))):u);const r=simulate(ev,alt,seed).res[i];out.push({label,dSold:sold(base[i])-sold(r),dProfit:base[i].profit-r.profit});};
    if(t.spot<n-1)test('자리',u=>{u.spot=n-1;u.bid=0;return u;});
    if(t.quality==='good')test('좋은 재료',u=>{u.quality='normal';return u;});
    if(t.pack==='pretty')test('선물 포장',u=>{u.pack='basic';return u;});
    t.promo.forEach(k=>test(PROMOS[k].name,u=>{u.promo=u.promo.filter(x=>x!==k);return u;}));
    if(t.repConf>0&&Math.abs(t.rep-3)>.05)test('별점',u=>{u.rep=3;u.repConf=0;return u;});
    return out;});}
function nextRep(t,r){if(r.star==null)return{rep:t.rep,conf:t.repConf*.6};return{rep:t.rep*.4+r.star*.6,conf:Math.min(1,r.n/10)};}
return{START,PRODUCTS,PK,MAXPICK,TYPES,GOOD,PACK,PROMOS,EVENTS,rng,pickEvents,unitCost,crowd,planCost,simulate,nextRep,repEff,attribution,resolveSpots,PASS,REACH_BONUS,MONO,sells};
})();

// 정자 (북쪽)
(function(){const x=0,z=-36;M.add(U.box,x,.4,z,7,.8,7,'#9B9385');M.add(U.box,x,.9,z,6.2,.2,6.2,'#B98B5A');
  [[-2.7,-2.7],[2.7,-2.7],[-2.7,2.7],[2.7,2.7]].forEach(([a,b])=>M.add(U.cyl,x+a,2.6,z+b,.4,3.4,.4,'#A8322A'));
  M.add(U.box,x,4.4,z,6.6,.35,6.6,'#3C6B5E');M.add(U.cone4,x,5.6,z,10,2.6,10,'#3E4448',0,Math.PI/4,0);M.add(U.box,x,6.95,z,.4,.4,.4,'#2E3336');})();
// 평상·장독대·짚단
function pyeong(x,z,ry){M.add(U.box,x,.55,z,3,.18,2,'#B98B5A',0,ry,0);[[-1.3,-.8],[1.3,-.8],[-1.3,.8],[1.3,.8]].forEach(([a,b])=>{const c=Math.cos(ry),s=Math.sin(ry);M.add(U.box,x+a*c+b*s,.25,z-a*s+b*c,.18,.5,.18,'#7A5638');});}
pyeong(-9,7,.3);pyeong(9,7,-.3);pyeong(-4,-36+5.2,0);
function jars(x,z){M.add(U.box,x,.2,z,3.4,.4,2.4,'#A39A8A');for(let i=0;i<5;i++){const a=r(-1.2,1.2),b=r(-.7,.7),s=r(.55,.85);M.add(U.cyl,x+a,.4+s*.55,z+b,s,s*1.1,s,'#5A3A26');M.add(U.cyl,x+a,.4+s*1.15,z+b,s*.75,.12,s*.75,'#4A2E1E');}}
jars(-26,27);jars(26,27);jars(-36,-12);jars(36,-12);jars(-14,-33);
for(let i=0;i<10;i++){const a=r(0,6.28),d=r(52,80);M.add(U.cone8,Math.cos(a)*d,.9,Math.sin(a)*d,2.2,1.8,2.2,'#D9B866');}
// 논두렁 줄무늬 (바깥 들판)
for(let k=-4;k<=4;k++){M.add(U.box,k*20,.04,78,18,.04,22,k%2?'#A4C46F':'#9AC067');M.add(U.box,k*20,.04,-70,18,.04,22,k%2?'#9AC067':'#A4C46F');}
// 감나무
const fruitPos=[];
function gamTree(x,z,s){M.add(U.cyl,x,1.6*s,z,.5*s,3.2*s,.5*s,'#6B4A33');M.add(U.cyl,x+.6*s,3*s,z,.3*s,1.6*s,.3*s,'#6B4A33',0,0,-.6);
  const greens=['#5E8F3E','#6D9C45','#557F37'];
  for(let i=0;i<5;i++){const a=i/5*6.28,d=1.1*s;M.add(U.ico,x+Math.cos(a)*d,(3.6+r(0,.8))*s,z+Math.sin(a)*d,r(2.2,2.8)*s,r(1.8,2.3)*s,r(2.2,2.8)*s,greens[i%3],r(0,3),r(0,3),0);}
  M.add(U.ico,x,4.7*s,z,2.6*s,2.2*s,2.6*s,greens[1],0,r(0,3),0);
  for(let i=0;i<Math.round(14*s);i++){const a=r(0,6.28),d=r(.8,2)*s;fruitPos.push([x+Math.cos(a)*d,(r(3,5.3))*s,z+Math.sin(a)*d,s]);}}
gamTree(0,0,1.45);
[[-20,12,.9],[20,12,.9],[-32,34,1],[32,34,1],[-30,-28,1.1],[30,-28,1.1],[-46,-4,1],[46,-4,1],[-12,56,.9],[12,56,.9],[0,-50,1.1],[-50,26,1],[50,26,1]].forEach(t=>gamTree(...t));
// 장대와 깃발 줄
const poles=[[-4,24],[4,24],[-4,32],[4,32],[-4,40],[4,40]];
poles.forEach(([x,z])=>M.add(U.cyl,x,2.6,z,.16,5.2,.16,'#6B4A33'));
const stat=M.build();scene.add(stat);
// 감 열매 (한 번에 그리기)
const fruit=new T.InstancedMesh(new T.SphereGeometry(.22,7,5),new T.MeshLambertMaterial({color:'#EE6A1E'}),fruitPos.length);
fruitPos.forEach((p,i)=>{fruit.setMatrixAt(i,new T.Matrix4().compose(new T.Vector3(p[0],p[1],p[2]),new T.Quaternion(),new T.Vector3(p[3],p[3],p[3])));});
fruit.castShadow=true;scene.add(fruit);
// 오방색 깃발
const flagCols=['#D93A2B','#F2C230','#2F6EB5','#FFFFFF','#2F8F5B'],flagN=[];
const FM=new Merge();
function bunting(x1,z1,x2,z2,h){const n=12;for(let i=0;i<n;i++){const t=(i+.5)/n,sag=Math.sin(t*Math.PI)*.8;FM.add(U.cone4,x1+(x2-x1)*t,h-sag-.35,z1+(z2-z1)*t,.45,.7,.06,flagCols[i%5],Math.PI,Math.atan2(x2-x1,z2-z1),0);}}
bunting(-4,24,4,24,5);bunting(-4,32,4,32,5);bunting(-4,40,4,40,5);bunting(-4,24,-4,40,5.1);bunting(4,24,4,40,5.1);
const flags=FM.build(false,false);scene.add(flags);
// 간판
function textTex(text,{bg='#F6E7C1',fg='#2A2420',w=512,h=128,font='700 76px "Gowun Batang", serif',border=null}={}){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,w,h);if(border){g.strokeStyle=border;g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);}g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+4);
  const t=new T.CanvasTexture(c);t.anisotropy=4;return t;}
const gateSign=new T.Mesh(new T.PlaneGeometry(5,1.25),new T.MeshBasicMaterial({map:textTex('청도 장터',{bg:'#2F3437',fg:'#F2C230',border:'#A8322A'})}));
gateSign.position.set(0,5.0,46.33);scene.add(gateSign);
const gateSign2=gateSign.clone();gateSign2.rotation.y=Math.PI;gateSign2.position.z=45.67;scene.add(gateSign2);

/* --- 집터 표시 (빈 땅) --- */
const plotObjs=PLOTS.map((p,i)=>{const g=new T.Group();g.position.set(p.x,0,p.z);g.rotation.y=p.ry;
  const m=new Merge();m.add(U.box,0,.05,0,6.2,.1,5.2,'#C9A877');
  [[-2.9,-2.4],[2.9,-2.4],[-2.9,2.4],[2.9,2.4]].forEach(([a,b])=>m.add(U.box,a,.45,b,.16,.9,.16,'#7A5638'));
  m.add(U.box,0,.72,-2.4,5.8,.05,.05,'#E8DCC0');m.add(U.box,0,.72,2.4,5.8,.05,.05,'#E8DCC0');m.add(U.box,-2.9,.72,0,.05,.05,4.8,'#E8DCC0');m.add(U.box,2.9,.72,0,.05,.05,4.8,'#E8DCC0');
  const mesh=m.build(true,true);g.add(mesh);
  const glow=new T.Mesh(new T.PlaneGeometry(6.8,5.8),new T.MeshBasicMaterial({color:'#F2A33A',transparent:true,opacity:0,depthWrite:false}));glow.rotation.x=-Math.PI/2;glow.position.y=.12;g.add(glow);
  scene.add(g);return{g,glow,shop:null};});

/* --- 가게 --- */
function stripeTex(col){const c=document.createElement('canvas');c.width=128;c.height=16;const g=c.getContext('2d');for(let i=0;i<8;i++){g.fillStyle=i%2?'#FFF8EC':col;g.fillRect(i*16,0,16,16);}const t=new T.CanvasTexture(c);return t;}
const mats={};const lam=c=>mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c}));
const geo={box:new T.BoxGeometry(1,1,1),cyl:new T.CylinderGeometry(.5,.5,1,10),sph:new T.SphereGeometry(.5,10,8)};
function bx(w,h,d,c,x,y,z,parent,cast=true){const m=new T.Mesh(geo.box,lam(c));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m;}
function makeShop(team){const g=new T.Group();
  bx(5.6,.3,4.4,'#B98B5A',0,.15,0,g);
  [[-2.5,-1.9],[2.5,-1.9],[-2.5,1.9],[2.5,1.9]].forEach(([a,b])=>bx(.22,3.3,.22,'#7A5638',a,1.8,b,g));
  bx(5.4,2.6,.15,'#E8DCC0',0,1.6,-2.05,g);
  const aw=new T.Mesh(geo.box,new T.MeshLambertMaterial({map:stripeTex(team.col)}));aw.scale.set(6.4,.18,3.2);aw.position.set(0,3.45,.6);aw.rotation.x=.32;aw.castShadow=true;g.add(aw);
  bx(6.4,.12,1.8,team.col,0,3.75,-1.4,g).rotation.x=-.2;
  // 매대
  bx(5,1.0,1.3,'#8E623E',0,.8,1.3,g);bx(5.2,.1,1.5,'#C99A66',0,1.35,1.3,g);
  // 감말랭이 바구니
  for(let i=0;i<3;i++){const x=-2+i*.75;bx(.62,.18,.62,'#C79A5B',x,1.49,1.3,g,false);for(let k=0;k<4;k++)bx(.22,.08,.16,'#D8742F',x-.14+(k%2)*.28,1.62,1.2+(k>>1)*.22,g,false);}
  // 아이스홍시 얼음 통
  bx(1.5,.3,.9,'#DDEFF4',1.3,1.55,1.3,g,false);
  for(let i=0;i<6;i++){const s=new T.Mesh(geo.sph,lam('#E25528'));s.scale.setScalar(.34);s.position.set(.85+(i%3)*.42,1.8,1.12+(i>>1&1)*.38);g.add(s);}
  // 간판
  const sign=new T.Mesh(new T.PlaneGeometry(3.4,.85),new T.MeshBasicMaterial({map:textTex(team.name,{bg:'#FFF8EC',fg:team.col,border:team.col})}));sign.position.set(0,4.35,-.6);sign.rotation.x=-.05;g.add(sign);
  const signB=sign.clone();signB.rotation.y=Math.PI;signB.position.z=-.62;g.add(signB);
  // 전략 소품 자리
  const props=new T.Group();g.add(props);g.userData.props=props;
  return g;}
function setProps(shop,d){const P=shop.userData.props;while(P.children.length)P.remove(P.children[0]);
  if(d.pack==='pretty'){for(let i=0;i<3;i++){const b=new T.Group();b.position.set(-2.8+i*.55,0,2.4);P.add(b);bx(.45,.45,.45,['#F2A6B8','#B9D7F2','#F7E08A'][i],0,.42+0,0,b);bx(.47,.47,.08,'#D63A5B',0,.42,0,b);bx(.08,.47,.47,'#D63A5B',0,.42,0,b);}}
  if(d.promo.includes('insta')){const s=new T.Group();s.position.set(3.1,0,2.2);P.add(s);bx(.08,1.4,.08,'#333',0,.7,0,s);bx(.7,1.1,.08,'#2B2B2B',0,1.8,0,s);bx(.58,.95,.03,'#F48FB1',0,1.8,.05,s);
    const h=new T.Mesh(geo.sph,lam('#FFFFFF'));h.scale.setScalar(.22);h.position.set(0,1.85,.09);s.add(h);}
  if(d.promo.includes('flyer')){const s=new T.Group();s.position.set(-3.2,0,1.2);s.rotation.y=.3;P.add(s);bx(.9,1.3,.08,'#6B4A33',0,.95,0,s).rotation.x=-.2;bx(.7,.9,.03,'#FFFDF2',0,1.0,.06,s).rotation.x=-.2;bx(.5,.08,.02,'#E2622A',0,1.25,.09,s).rotation.x=-.2;}
  if(d.promo.includes('taste')){const s=new T.Group();s.position.set(0,0,3.3);P.add(s);bx(1.4,.08,.7,'#C99A66',0,.9,0,s);bx(.1,.9,.1,'#7A5638',-.55,.45,0,s);bx(.1,.9,.1,'#7A5638',.55,.45,0,s);
    for(let i=0;i<3;i++){const p=new T.Mesh(geo.cyl,lam('#FFFFFF'));p.scale.set(.32,.04,.32);p.position.set(-.4+i*.4,.97,0);s.add(p);bx(.12,.06,.1,'#D8742F',-.4+i*.4,1.02,0,s,false);}}
  if(d.quality==='good'){const s=new T.Mesh(new T.OctahedronGeometry(.32,0),new T.MeshLambertMaterial({color:'#F2C230',emissive:'#6A4A00'}));s.position.set(1.95,4.35,-.5);s.userData.spin=1;P.add(s);}
  P.children.forEach(c=>{c.userData.base=c.scale.clone();c.scale.setScalar(.01);c.userData.grow=0;});}

/* --- 사람 (상자 몇 개, 재질 공유) --- */
const LOOKS={어르신:{shirt:'#8C7462',pants:'#4E4C48',hair:'#DCDAD4',hat:'#6B5644'},주민:{shirt:'#3F8F8A',pants:'#3C4552',hair:'#2B2118'},
  학생:{shirt:'#F4F2EC',pants:'#2E3E66',hair:'#1F1813',bag:'#E5A43A',tie:'#2E3E66'},관광객:{shirt:'#E46D8C',pants:'#E9E2D2',hair:'#4A3423',hat:'#F3D777'}};
function makePerson(type){const c=LOOKS[type],g=new T.Group();const rig={};
  const leg=(x)=>{const p=new T.Group();p.position.set(x,.82,0);g.add(p);bx(.22,.76,.24,c.pants,0,-.38,0,p);bx(.24,.12,.32,'#2A2A2A',0,-.78,.04,p,false);return p;};
  rig.l=leg(-.14);rig.r=leg(.14);
  const body=new T.Group();body.position.y=.82;g.add(body);rig.body=body;
  bx(.58,.7,.34,c.shirt,0,.36,0,body);if(c.tie)bx(.1,.35,.02,c.tie,0,.45,.18,body,false);
  const arm=x=>{const p=new T.Group();p.position.set(x,.66,0);body.add(p);bx(.16,.58,.18,c.shirt,0,-.26,0,p,false);bx(.15,.13,.16,'#F0C9A2',0,-.6,0,p,false);return p;};
  rig.al=arm(-.38);rig.ar=arm(.38);
  bx(.46,.46,.42,'#F0C9A2',0,.98,0,body);bx(.5,.16,.46,c.hair,0,1.24,-.01,body,false);bx(.5,.3,.1,c.hair,0,1.06,-.2,body,false);
  bx(.06,.07,.02,'#1B1B1B',-.1,1.0,.215,body,false);bx(.06,.07,.02,'#1B1B1B',.1,1.0,.215,body,false);
  if(c.hat){bx(type==='관광객'?.86:.54,.06,type==='관광객'?.82:.5,c.hat,0,1.3,0,body,false);bx(.48,.18,.44,c.hat,0,1.4,0,body,false);}
  if(c.bag)bx(.42,.46,.18,c.bag,0,.4,-.26,body,false);
  const sack=bx(.3,.34,.2,'#F2E6C9',0,0,0,rig.ar,false);sack.position.set(0,-.78,.05);sack.visible=false;rig.sack=sack;
  g.userData.rig=rig;g.scale.setScalar(1.15);return g;}

/* --- 카메라: 끌어서 돌리기 · 오른쪽 끌기/두 손가락 이동 · 휠/집기 확대 --- */
const cam={tx:0,tz:6,yaw:.35,pitch:.78,dist:92,goal:null};
const want={tx:0,tz:6,yaw:.35,pitch:.78,dist:92};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function flyTo(o){Object.assign(want,o);}
const ptrs=new Map();let lastPinch=0,mode=null,moved=0;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});mode=(e.button===2||e.shiftKey)?'rot':'pan';moved=0;canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)want.dist=clamp(want.dist*lastPinch/d,10,150);lastPinch=d;pan(dx/2,dy/2);return;}
  if(mode==='pan')pan(dx,dy);else{want.yaw-=dx*.006;want.pitch=clamp(want.pitch+dy*.004,.22,1.38);}});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)lastPinch=0;if(!ptrs.size)canvas.classList.remove('drag');}
canvas.addEventListener('pointerup',e=>{endPtr(e);if(moved<6&&API.onPick)pick(e);});canvas.addEventListener('pointercancel',endPtr);
function pan(dx,dy){const s=want.dist*.768/innerHeight/Math.max(.35,Math.sin(want.pitch)),c=Math.cos(want.yaw),si=Math.sin(want.yaw);want.tx+=(-dx*c-dy*si)*s;want.tz+=(dx*si-dy*c)*s;want.tx=clamp(want.tx,-60,60);want.tz=clamp(want.tz,-60,70);}
canvas.addEventListener('wheel',e=>{e.preventDefault();want.dist=clamp(want.dist*(1+Math.sign(e.deltaY)*.1),10,150);},{passive:false});
const ray=new T.Raycaster(),mv=new T.Vector2();
function pick(e){const rc=canvas.getBoundingClientRect();mv.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(mv,camera);
  const hits=ray.intersectObjects(plotObjs.map(p=>p.g),true);if(hits.length){let o=hits[0].object;while(o&&!plotObjs.some(p=>p.g===o))o=o.parent;const i=plotObjs.findIndex(p=>p.g===o);if(i>=0)API.onPick(i);}}

/* --- 크기 맞춤 · 그리기 --- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const tickers=[];let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  const k=1-Math.pow(.0015,dt);for(const key of['tx','tz','yaw','pitch','dist'])cam[key]+=(want[key]-cam[key])*k;
  const cp=Math.cos(cam.pitch);camera.position.set(cam.tx+Math.sin(cam.yaw)*cp*cam.dist,Math.sin(cam.pitch)*cam.dist,cam.tz+Math.cos(cam.yaw)*cp*cam.dist);camera.lookAt(cam.tx,1.5,cam.tz);
  sun.position.set(cam.tx-40,70,cam.tz+30);sun.target.position.set(cam.tx,0,cam.tz);sun.target.updateMatrixWorld();
  flags.position.y=Math.sin(now/600)*.03;
  for(let i=tickers.length-1;i>=0;i--)if(tickers[i](dt,now)===false)tickers.splice(i,1);
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
const _v=new T.Vector3();
function project(x,y,z){_v.set(x,y,z).project(camera);return{x:(_v.x+1)/2*innerWidth,y:(1-_v.y)/2*innerHeight,vis:_v.z<1&&_v.z>-1};}

const API={T,scene,camera,PLOTS,NODES,plotObjs,makeShop,setProps,makePerson,flyTo,want,tickers,project,onPick:null,
  view:{all:()=>flyTo({tx:0,tz:6,yaw:.35,pitch:.78,dist:92}),plot:i=>{const p=PLOTS[i];flyTo({tx:p.x,tz:p.z,dist:24,pitch:.62,yaw:Math.atan2(p.face[0],p.face[1])+.5});}},
  zoom:f=>{want.dist=clamp(want.dist*f,10,150);},spin:a=>{want.yaw+=a;}};
return API;
})();
</script>
<style>
/* ── 정보 화면 · 결정 입력 · 공개 (새 흐름) ── */
.brief{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(1120px,calc(100vw - 32px));max-height:calc(100vh - 160px);overflow:auto;padding:18px 22px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.brief h3{margin:0 0 8px;font-size:15px;display:flex;align-items:baseline;gap:8px}
.brief h3 small{font-weight:500;color:var(--ink3);font-size:12px}
.brief .box{background:var(--paper2);border-radius:14px;padding:12px 14px}
.brief .wide{grid-column:1/-1}
.cust{display:grid;gap:6px}
.cust .cr{display:grid;grid-template-columns:70px 1fr 54px;align-items:center;gap:8px;font-size:14px}
.cust .bar2{height:14px;border-radius:7px;background:#fff;overflow:hidden}
.cust .bar2 i{display:block;height:100%}
.cust .cr b{font-family:var(--serif);text-align:right}
.spots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.spots div{background:#fff;border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;color:var(--ink3)}
.spots b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.spots div:first-child{box-shadow:inset 0 0 0 2px var(--gam)}
.spots small{display:block;font-weight:700;color:var(--ink2)}
.pcards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pcard{background:#fff;border-radius:12px;overflow:hidden;text-align:center;font-size:12px;color:var(--ink3);box-shadow:inset 0 0 0 2px transparent}
.pcard img{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}
.pcard b{display:block;color:var(--ink);font-size:13px;margin-top:6px}
.pcard span{display:block;padding:0 6px 8px}
.pcard .pr{font-family:var(--serif);color:var(--ink2)}
.pcard.sel{box-shadow:inset 0 0 0 3px var(--gam);background:#FFF3EA}
.pcard button{all:unset;display:block;width:100%;cursor:pointer}
.like{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.like span{font-size:11px;padding:2px 7px;border-radius:999px;background:#fff;color:var(--ink2)}
.ed .pcards{grid-template-columns:repeat(5,1fr)}
.ed .spotpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ed .spotpick button{padding:10px 4px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule);font-weight:700;display:grid;gap:0}
.ed .spotpick button small{font-weight:500;color:var(--ink3);font-size:11px}
.ed .spotpick button.on{box-shadow:inset 0 0 0 2.5px var(--gam);background:#FFF3EA;color:var(--gamDeep)}
.ed h5{margin:14px 0 6px;font-size:13px;color:var(--ink2)}
.ed .bidrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ed .bidrow .stepper output{min-width:110px}
.ed .opts{grid-template-columns:repeat(3,1fr)}
.ed .chips{flex-direction:row;flex-wrap:wrap}
.ed .chips button{padding:8px 12px}
.rev{display:grid;gap:8px}
.rev .row{display:flex;align-items:center;gap:12px;background:var(--paper2);border-radius:12px;padding:10px 14px;font-size:15px}
.rev .row i{width:12px;height:12px;border-radius:4px;flex:none}
.rev .row b.sp{min-width:64px;font-family:var(--serif);font-size:18px}
.rev .row .bids{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
.rev .row .bids span{background:#fff;padding:3px 8px;border-radius:999px}
.rev .row .bids span.w{background:var(--gam);color:#fff;font-weight:700}
.goods{display:flex;gap:6px;flex-wrap:wrap}
.goods span{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.goods img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.tiles .tile{min-width:130px}
.tiles .tile.ok::after{content:'✓';position:absolute;right:10px;top:8px;color:var(--good);font-weight:700}
.tiles .tile{position:relative}
.ed .wallet .nums{font-size:13px}
.res .goods img{width:20px;height:20px}
.res .tm,.res .goods span{white-space:nowrap}
@media (max-width:820px){.brief{grid-template-columns:1fr}.pcards{grid-template-columns:repeat(3,1fr)}.ed .opts{grid-template-columns:1fr}}
</style>
<script>
/* ===== 장날 진행 ===== */
(function(){
const E=ENGINE,W=W3,T=W.T,$=s=>document.querySelector(s),ui=$('#ui'),tagsEl=$('#tags');
const won=n=>Math.round(n).toLocaleString('ko-KR');
const TCOL=['#E2622A','#2D6FB8','#2E8A5B','#8A55C9','#C99A12','#D2467A'];
const TYPE_COL={어르신:'#8C7462',주민:'#3F8F8A',학생:'#2E3E66',관광객:'#E46D8C'};
const FACES=[{say:'와, 싸다!',col:'#2E8A5B',lab:'아주 쌈'},{say:'좋아요',col:'#2D6FB8',lab:'만족'},{say:'좀 비싼데…',col:'#D88A1C',lab:'투덜'},{say:'너무 비싸요',col:'#C8402F',lab:'안 삼'}];
const DAY=['첫째 날','둘째 날','셋째 날'],P=E.PRODUCTS,PK=E.PK;
const SPOTNAME=['입구 명당','입구길','마당','마당','골목 끝 · 무료'];
const G={phase:'title',day:0,n:5,teams:[],events:E.pickEvents(Date.now()%99991),last:null,applied:-1};
const ev=()=>G.events[G.day];
function emptyPlan(){const p={};PK.forEach(k=>p[k]={price:0,qty:0});return{p,quality:'normal',pack:'basic',promo:[]};}
function newTeams(n){G.n=n;G.teams=Array.from({length:n},(_,i)=>({name:(i+1)+'모둠',col:TCOL[i],total:0,rep:3,repConf:0,spot:null,bid:0,want:null,bidsTotal:0,waste:0,ranks:[],ready:false,d:emptyPlan()}));W.plotObjs.forEach((p,i)=>p.g.visible=i<n);}
newTeams(5);
const stars=v=>{const k=Math.round(v);return '★'.repeat(k)+'☆'.repeat(5-k);};
const faceHTML=k=>`<span class="face ${k===2?'f2':k===3?'f3':''}" style="background:${FACES[k].col}"><i></i></span>`;
const picks=d=>PK.filter(p=>d.p[p].qty>0);
const goodsHTML=d=>`<div class="goods">${picks(d).map(p=>`<span><img src="${P[p].img}" alt="">${P[p].short}</span>`).join('')||'<span style="padding:3px 10px;color:var(--ink3)">—</span>'}</div>`;

/* ---------- 3D 이름표 ---------- */
const tags=new Set();
function addTag(html,cls,pos){const el=document.createElement('div');el.className='tag';el.innerHTML=`<div class="${cls}">${html}</div>`;tagsEl.appendChild(el);const t={el,pos,life:null};tags.add(t);return t;}
function dropTag(t){if(!t)return;t.el.remove();tags.delete(t);}
W.tickers.push((dt)=>{tags.forEach(t=>{const p=typeof t.pos==='function'?t.pos():t.pos,s=W.project(p.x,p.y,p.z);t.el.style.display=s.vis?'':'none';t.el.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;
  if(t.life!=null){t.life-=dt;if(t.life<=0)dropTag(t);}});});
let plotTags=[];
function showPlotTags(){plotTags.forEach(dropTag);plotTags=[];
  for(let i=0;i<G.n;i++){if(W.plotObjs[i].shop)continue;const p=W.PLOTS[i];
    plotTags.push(addTag(`<b>${i+1}</b>${i===0?'명당':i===G.n-1?'무료':''}`,'plot'+(i===0?' best':''),{x:p.x,y:2.2,z:p.z}));}}
let shopTags=[];
function showShopTags(mode,sold){shopTags.forEach(dropTag);shopTags=[];
  G.teams.forEach((t,i)=>{const p=W.PLOTS[t.spot];const el=addTag('','shop',{x:p.x,y:5.6,z:p.z});el.el.firstChild.style.setProperty('--c',t.col);el.team=i;shopTags.push(el);});updShopTags(mode,sold);}
function updShopTags(mode,sold){shopTags.forEach(tg=>{const t=G.teams[tg.team];let h=`<b>${t.name}</b>`;const ps=picks(t.d);
  if(mode==='sales'){const s=sold[tg.team];h+=`<div class="s">${ps.map(p=>`<span>${P[p].short} ${s[p]}/${t.d.p[p].qty}</span>`).join('')}</div>`;}
  else if(mode==='goods')h+=`<div class="s">${ps.map(p=>`<span>${P[p].short} ${won(t.d.p[p].price)}</span>`).join('')}</div>`;
  if(G.day>0||mode==='result')h+=`<div class="st">${stars(t.rep)}</div>`;tg.el.firstChild.innerHTML=h;});}

/* ---------- 가게 세우기 ---------- */
const ease=t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
function raiseShop(i){const t=G.teams[i],po=W.plotObjs[t.spot];if(po.shop)W.scene.remove(po.shop);
  const s=W.makeShop(t),p=W.PLOTS[t.spot];s.position.set(p.x,0,p.z);s.rotation.y=p.ry;s.scale.setScalar(.01);W.scene.add(s);po.shop=s;
  let k=0;W.tickers.push(dt=>{k=Math.min(1,k+dt*1.6);s.scale.setScalar(Math.max(.01,ease(k)));return k<1;});dust(p.x,p.z);}
function dust(x,z){const g=new T.Group();g.position.set(x,0,z);W.scene.add(g);const m=new T.MeshLambertMaterial({color:'#E8DCC0',transparent:true,opacity:.8});
  for(let i=0;i<10;i++){const s=new T.Mesh(new T.SphereGeometry(.5,6,4),m);const a=i/10*6.28;s.userData.v=[Math.cos(a)*3,1.2,Math.sin(a)*3];s.position.y=.4;g.add(s);}
  let k=0;W.tickers.push(dt=>{k+=dt;g.children.forEach(s=>{s.position.x+=s.userData.v[0]*dt;s.position.z+=s.userData.v[2]*dt;s.position.y+=s.userData.v[1]*dt;s.scale.setScalar(1+k*2);});m.opacity=Math.max(0,.8-k*1.1);if(k>.8){W.scene.remove(g);return false;}});}
function clearShops(){W.plotObjs.forEach(po=>{const s=po.shop;if(!s)return;po.shop=null;let k=1;W.tickers.push(dt=>{k-=dt*2.5;s.scale.setScalar(Math.max(.01,k));if(k<=0){W.scene.remove(s);return false;}});});}
function growProps(){W.plotObjs.forEach(po=>{if(!po.shop)return;po.shop.userData.props.children.forEach((c,j)=>{let k=-j*.15;W.tickers.push(dt=>{k+=dt*2;const e=Math.max(.01,ease(Math.max(0,Math.min(1,k))));c.scale.set(c.userData.base.x*e,c.userData.base.y*e,c.userData.base.z*e);if(c.userData.spin)c.rotation.y+=dt*2;return k<1||!!c.userData.spin;});});});}

/* ---------- 화면 틀 ---------- */
const STEPS=[['brief','정보·회의'],['entry','결정 입력'],['reveal','공개'],['market','장 열기'],['result','결산']];
function frame(dock){const k=STEPS.findIndex(s=>s[0]===G.phase);
  ui.innerHTML=`<div class="top"><div class="panel brand"><span class="mk"></span><b>청도 장날</b>${G.phase!=='title'?`<span>${DAY[G.day]}</span>`:''}</div>
   ${G.phase!=='title'&&G.phase!=='awards'?`<div class="panel news"><i>오늘</i><b>${ev().t}</b></div>`:'<span></span>'}
   ${k>=0?`<div class="panel steps">${STEPS.map(([,s],i)=>`<span class="${i===k?'on':i<k?'done':''}">${s}</span>`).join('')}</div>`:'<span></span>'}</div>
  <div class="panel cam"><button title="왼쪽으로" id="c1">↺</button><button title="확대" id="c2">＋</button><button title="오른쪽으로" id="c3">↻</button><button title="전체 보기" id="c4">⌂</button><button title="축소" id="c5">－</button><button title="위에서" id="c6">▣</button></div>
  ${dock?`<div class="panel dock" id="dock">${dock}</div>`:''}<div class="copy">© 2026 따숨교육</div>`;
  $('#c1').onclick=()=>W.spin(.5);$('#c3').onclick=()=>W.spin(-.5);$('#c2').onclick=()=>W.zoom(.75);$('#c5').onclick=()=>W.zoom(1.3);$('#c4').onclick=()=>W.view.all();$('#c6').onclick=()=>W.flyTo({pitch:1.35});}
function sheet(html){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="panel sheet">${html}</div>`;document.body.appendChild(s);return s;}
function toast(t){const d=document.createElement('div');d.className='panel toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function go(p){G.phase=p;W.onPick=null;({title,brief,entry,reveal,market,result,awards})[p]();}

/* ---------- 0. 시작 ---------- */
let orbitOn=true;W.tickers.push(dt=>{if(orbitOn)W.want.yaw+=dt*.04;});
function title(){orbitOn=true;W.view.all();W.flyTo({dist:110,pitch:.55});
  ui.innerHTML=`<div class="panel hero"><div class="maker"><span class="mk2"></span>따숨교육</div><h1>청도 <em>장날</em></h1><p>사흘 동안 장사해서 가장 많이 남긴 팀이 이깁니다.</p>
   <div class="seg" id="nseg">${[3,4,5].map(n=>`<button data-n="${n}" class="${n===G.n?'on':''}">${n}팀</button>`).join('')}</div>
   <div class="row"><button class="line" id="rules">규칙</button><button class="go" id="start">장터 열기</button></div><div class="cr"><b>© 2026 따숨교육</b><br>청도 장날 놀이도시는 따숨교육이 기획·제작한 교육용 게임입니다. 무단 복제·배포·수정을 금합니다.</div></div><div class="copy">© 2026 따숨교육</div>`;
  document.querySelectorAll('#nseg button').forEach(b=>b.onclick=()=>{newTeams(+b.dataset.n);document.querySelectorAll('#nseg button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#rules').onclick=showRules;$('#start').onclick=()=>{orbitOn=false;go('brief');};}
function showRules(){const s=sheet(`<h3>규칙</h3><div class="rules">
  <div class="rule"><b>밑천 150,000원</b><span>날마다 똑같이 시작</span></div>
  <div class="rule"><b>집터는 비밀 입찰</b><span>원하는 자리에 금액을 써내고, 가장 높은 팀이 가져감. 끝자리는 무료</span></div>
  <div class="rule"><b>물건은 2개까지</b><span>5가지 중 고르기. 혼자 팔면 독점, 같이 팔면 경쟁</span></div>
  <div class="rule"><b>남으면 버림</b><span>그날 못 판 물건은 사라짐</span></div>
  <div class="rule"><b>별점은 이어짐</b><span>오늘 후기가 내일 손님을 부름</span></div></div>
  <div class="foot"><button class="go" id="ok">알겠어요</button></div>`);s.querySelector('#ok').onclick=()=>s.remove();}

/* ---------- 1. 정보 화면 + 회의 ---------- */
let timerId=0;
function briefHTML(){const c=E.crowd(ev()),tot=Object.values(c).reduce((a,b)=>a+b,0),mx=Math.max(...Object.values(c));
  const likes={어르신:['반시','주먹밥','전단'],주민:['잼','반시','전단'],학생:['볼펜','딸기','인스타'],관광객:['볼펜','잼','인스타']};
  return `<div class="box"><h3>오늘 손님 <small>약 ${tot}명 · 예상이라 더 오거나 덜 올 수 있음</small></h3><div class="cust">${Object.keys(c).map(k=>`<div class="cr"><span class="who"><i style="background:${TYPE_COL[k]}"></i>${k}</span><div class="bar2"><i style="width:${c[k]/mx*100}%;background:${TYPE_COL[k]}"></i></div><b>${c[k]}명</b></div><div class="like" style="margin:-2px 0 6px 78px">${likes[k].map(x=>`<span>${x}</span>`).join('')}</div>`).join('')}</div></div>
   <div class="box"><h3>자리 <small>지나가는 손님 중 가게를 보는 비율</small></h3><div class="spots">${[...Array(G.n).keys()].map(s=>`<div><b>${Math.round(E.PASS[s]*100)}%</b><small>${s+1}번</small>${s===G.n-1?'무료':SPOTNAME[s]}</div>`).join('')}</div>
    <p class="hint" style="margin:10px 0 0">홍보(인스타 ${won(E.PROMOS.insta.cost)} · 전단 ${won(E.PROMOS.flyer.cost)})를 본 손님은 자리와 상관없이 찾아옴</p></div>
   <div class="box wide"><h3>파는 물건 <small>팀마다 2개까지 · 혼자 팔면 독점, 같이 팔면 경쟁</small></h3><div class="pcards">${PK.map(p=>{const uc=E.unitCost(ev(),p,'normal');const top=Object.values(E.TYPES).map(t=>t.wtp[p]).sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])).slice(0,2),m=ev().wmul[p]||1,lo=Math.min(top[0][0],top[1][0])*m,hi=Math.max(top[0][1],top[1][1])*m;
    return `<div class="pcard"><img src="${P[p].img}" alt="${P[p].name}"><b>${P[p].name}</b><span>${P[p].who}</span><span class="pr">원가 ${won(uc)} · 잘 사는 손님 ${won(Math.round(lo/100)*100)}~${won(Math.round(hi/100)*100)}</span></div>`;}).join('')}</div></div>`;}
function brief(){G.teams.forEach(t=>{t.spot=null;t.bid=0;t.want=null;t.ready=false;t.d=t.d&&picks(t.d).length?t.d:emptyPlan();});clearShops();shopTags.forEach(dropTag);shopTags=[];
  W.view.all();showPlotTags();let left=300;
  frame(`<button class="line" id="m">−1분</button><div class="timer" id="tm">5:00</div><button class="line" id="p">+1분</button><span class="vr"></span><button class="go" id="next">결정 입력</button>`);
  const b=document.createElement('div');b.className='panel brief';b.innerHTML=briefHTML();ui.appendChild(b);
  const draw=()=>{const e=$('#tm');if(!e)return;e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');e.classList.toggle('low',left<=30);};
  clearInterval(timerId);timerId=setInterval(()=>{left=Math.max(0,left-1);draw();},1000);
  $('#m').onclick=()=>{left=Math.max(0,left-60);draw();};$('#p').onclick=()=>{left+=60;draw();};
  $('#next').onclick=()=>{clearInterval(timerId);go('entry');};}

/* ---------- 2. 결정 입력 (팀이 한 팀씩 와서 말하고, 선생님이 입력) ---------- */
function aiPlan(t){const ev0=ev(),r=Math.random,d=emptyPlan();
  const ps=PK.slice().sort(()=>r()-.5).slice(0,r()<.5?1:2);d.quality=r()<.3?'good':'normal';d.pack=r()<.3?'pretty':'basic';d.promo=r()<.4?[['insta','flyer','taste'][Math.floor(r()*3)]]:[];
  t.want=Math.floor(r()*G.n);t.bid=t.want===G.n-1?0:Math.max(0,Math.round((25000-t.want*5000+(r()-.5)*10000)/5000)*5000);
  let budget=(E.START-t.bid)*(.5+r()*.3)-d.promo.reduce((a,k)=>a+E.PROMOS[k].cost,0);
  ps.forEach((p,k)=>{const uc=E.unitCost(ev0,p,d.quality)+E.PACK[d.pack].cost;const avg=Object.values(E.TYPES).reduce((a,x)=>a+(x.wtp[p][0]+x.wtp[p][1])/2,0)/4*(ev0.wmul[p]||1);
    d.p[p].price=Math.round(avg*(.8+r()*.3)/100)*100;d.p[p].qty=Math.min(P[p].max,Math.max(5,Math.floor(budget/ps.length/uc/5)*5));});
  while(E.planCost(ev0,{...d,bid:t.bid})>E.START&&ps.some(p=>d.p[p].qty>0))ps.forEach(p=>{d.p[p].qty=Math.max(0,d.p[p].qty-5);});return d;}
function entry(){W.view.all();drawEntry();}
function drawEntry(){const all=G.teams.every(t=>t.ready);
  frame(`<div class="tiles">${G.teams.map((t,i)=>`<button class="tile ${t.ready?'ok':''}" data-e="${i}"><span style="color:${t.col}">${t.name}</span><small>${t.ready?'입력 완료':'입력하기'}</small></button>`).join('')}</div>
   <span class="vr"></span><button class="go" id="next" ${all?'':'disabled'}>공개</button>`);
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editor(+b.dataset.e));
  $('#next').onclick=()=>{go('reveal');};}
function editor(i){const t=G.teams[i],d=JSON.parse(JSON.stringify(t.d));let want=t.want,bid=t.bid||0;
  const s=sheet('');const box=s.firstChild;
  function draw(){const cost=E.planCost(ev(),{...d,bid}),left=E.START-cost,over=left<0,ps=picks(d),rev=ps.reduce((a,p)=>a+d.p[p].qty*d.p[p].price,0);
    const uc=p=>E.unitCost(ev(),p,d.quality)+E.PACK[d.pack].cost;
    box.innerHTML=`<div class="ed"><div class="who2"><i style="background:${t.col}"></i><h3 style="margin:0">${t.name}</h3></div>
     <h5>1. 자리 · 금액 <small style="color:var(--ink3)">(5,000원 단위, 끝자리는 무료)</small></h5>
     <div class="bidrow"><div class="spotpick" style="flex:1">${[...Array(G.n).keys()].map(k=>`<button data-s="${k}" class="${want===k?'on':''}">${k+1}번<small>${k===G.n-1?'무료':Math.round(E.PASS[k]*100)+'%'}</small></button>`).join('')}</div>
      <div class="stepper" ${want===G.n-1||want==null?'style="opacity:.35;pointer-events:none"':''}><button data-b="-5000">−</button><output>${won(bid)}원</output><button data-b="5000">+</button></div></div>
     <h5>2. 물건 <small style="color:var(--ink3)">(2개까지)</small></h5>
     <div class="pcards">${PK.map(p=>`<div class="pcard ${d.p[p].qty>0?'sel':''}"><button data-p="${p}"><img src="${P[p].img}" alt=""><b>${P[p].name}</b><span class="pr">원가 ${won(uc(p))}</span></button></div>`).join('')}</div>
     ${ps.length?`<div class="prods" style="margin-top:10px">${ps.map(p=>`<div class="prod"><div class="pn">${P[p].name}<small>${P[p].max<200?'최대 '+P[p].max+'개':''}</small></div>
       <div class="stp"><label>가격</label><div class="stepper"><button data-a="${p}.price.-100">−</button><output>${won(d.p[p].price)}</output><button data-a="${p}.price.100">+</button></div></div>
       <div class="stp"><label>개수</label><div class="stepper"><button data-a="${p}.qty.-5">−</button><output>${d.p[p].qty}</output><button data-a="${p}.qty.5">+</button></div></div></div>`).join('')}</div>`:''}
     <h5>3. 재료 · 포장 · 홍보</h5>
     <div class="opts"><div class="chips"><button data-q="normal" class="${d.quality==='normal'?'on':''}">보통 재료</button><button data-q="good" class="${d.quality==='good'?'on':''}">좋은 재료<small>원가 +40%</small></button></div>
      <div class="chips"><button data-k="basic" class="${d.pack==='basic'?'on':''}">기본 봉투</button><button data-k="pretty" class="${d.pack==='pretty'?'on':''}">선물 포장<small>+${won(E.PACK.pretty.cost)}/개</small></button></div>
      <div class="chips">${Object.entries(E.PROMOS).map(([k,x])=>`<button data-m="${k}" class="${d.promo.includes(k)?'on':''}">${x.name}<small>${won(x.cost)}</small></button>`).join('')}</div></div>
     <div class="wallet"><div class="nums"><span>자리값<b>${won(bid)}</b></span><span>쓸 돈<b>${won(cost)}</b></span><span>남는 돈<b class="${over?'neg':''}">${won(left)}</b></span><span>다 팔면<b>${won(rev)}</b></span></div><div class="bar ${over?'over':''}"><i style="width:${Math.min(100,cost/E.START*100)}%"></i></div></div></div>
     <div class="foot">${over?`<span style="margin-right:auto;color:var(--bad);font-size:14px">${won(-left)}원 넘음</span>`:''}<button class="line" id="x">취소</button><button class="go" id="ok" ${over||want==null||!ps.length?'disabled':''}>입력 완료</button></div>`;
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{want=+b.dataset.s;if(want===G.n-1)bid=0;else if(!bid)bid=5000;draw();});
    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bid=Math.max(5000,Math.min(E.START,bid+ +b.dataset.b));draw();});
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;if(d.p[p].qty>0){d.p[p].qty=0;d.p[p].price=0;}else{if(ps.length>=E.MAXPICK){toast('물건은 2개까지');return;}const avg=Object.values(E.TYPES).reduce((a,x)=>a+(x.wtp[p][0]+x.wtp[p][1])/2,0)/4;d.p[p].price=Math.round(avg/100)*100;d.p[p].qty=Math.min(P[p].max,20);}draw();});
    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const [p,f,v]=b.dataset.a.split('.');d.p[p][f]=Math.max(f==='qty'?5:100,Math.min(f==='price'?9900:P[p].max,d.p[p][f]+ +v));draw();});
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{d.quality=b.dataset.q;draw();});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{d.pack=b.dataset.k;draw();});
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;d.promo=d.promo.includes(k)?d.promo.filter(x=>x!==k):[...d.promo,k];draw();});
    box.querySelector('#x').onclick=()=>s.remove();
    box.querySelector('#ok').onclick=()=>{t.d=d;t.want=want;t.bid=bid;t.ready=true;t.order=Date.now();s.remove();drawEntry();};}
  draw();}

/* ---------- 3. 공개: 자리 + 물건 ---------- */
function reveal(){G.teams.forEach(t=>{if(!t.ready){t.d=aiPlan(t);t.ready=true;}});
  const R=E.resolveSpots(G.teams,G.n);G.teams.forEach((t,i)=>{t.spot=R.spot[i];t.bid=R.paid[i];t.bidsTotal+=t.bid;});
  G.teams.forEach((t,i)=>raiseShop(i));showPlotTags();W.view.all();showShopTags('goods');
  frame(`<div class="lab">자리 확정</div><button class="line" id="again">다시 보기</button><button class="go" id="next">장 열기</button>`);
  W.onPick=i=>W.view.plot(i);
  const show=()=>{const s=sheet(`<h3>공개</h3><div class="rev">${[...Array(G.n).keys()].map(sp=>{const t=G.teams.find(x=>x.spot===sp),lg=R.log.find(l=>l.s===sp);
      return `<div class="row"><b class="sp">${sp+1}번</b>${t?`<i style="background:${t.col}"></i><b>${t.name}</b>${t.bid?`<span style="color:var(--gam);font-weight:700">${won(t.bid)}원</span>`:'<span style="color:var(--ink3)">무료</span>'}${goodsHTML(t.d)}`:'<span style="color:var(--ink3)">빈 자리</span>'}
       ${lg&&lg.bids.length>1?`<div class="bids">${lg.bids.map(b=>`<span class="${b.i===lg.winner?'w':''}">${G.teams[b.i].name} ${won(b.bid)}</span>`).join('')}</div>`:''}</div>`;}).join('')}</div>
     <div class="foot"><button class="go" id="c">닫기</button></div>`);s.querySelector('#c').onclick=()=>s.remove();};
  $('#again').onclick=show;$('#next').onclick=()=>{run();go('market');};show();}
function run(){const teams=G.teams.map(t=>({...t.d,spot:t.spot,bid:t.bid,rep:t.rep,repConf:t.repConf}));G.last={...E.simulate(ev(),teams,2026+G.day*101),teams};G.last.eff=E.attribution(ev(),teams,2026+G.day*101);}

/* ---------- 4. 장 열기 ---------- */
let crowd=[],speed=1;
function market(){G.teams.forEach(t=>W.setProps(W.plotObjs[t.spot].shop,t.d));growProps();W.view.all();W.flyTo({dist:70,pitch:.7});
  const sold=G.teams.map(()=>{const o={};PK.forEach(p=>o[p]=0);return o;});showShopTags('sales',sold);
  const all=G.last.list,GRP=5,list=[];for(let i=0;i<all.length;i+=GRP){const ch=all.slice(i,i+GRP);list.push({...(ch.find(c=>c.buy>=0)||ch[0]),members:ch});}const used=G.teams.map(t=>t.spot);let spawned=0,finished=0,spawnT=0,done=false;
  frame(`<div class="hud"><span class="cnt" id="cnt">0<small>/ ${all.length}명</small></span></div><span class="vr"></span>
    <div class="seg" id="spd">${[1,2,4].map(s=>`<button data-s="${s}" class="${s===speed?'on':''}">${s}배</button>`).join('')}</div><span class="vr"></span>
    <button class="line" id="skip">바로 결산</button><button class="go" id="next" disabled>결산</button>`);
  document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b));});
  const zone=r=>W.PLOTS[r].zone;const N=W.NODES;
  function legs(from,to){const out=[];if(from===to)return out;if(from==='gate'){out.push(N.road);from='road';if(to==='road')return out;}
    if(from!=='yard')out.push(N[from]);if(to!=='yard'||from!=='yard')out.push(N.yard);if(to!=='yard')out.push(N[to]);return out;}
  function plan(c){const stops=[];const pool=used.slice().sort((a,b)=>a-b);
    if(c.buy>=0){const ch=G.teams[c.buy].spot;pool.forEach(r=>{if(r<ch&&Math.random()<.4)stops.push(r);});stops.push(ch);}
    else{pool.forEach(r=>{if(Math.random()<.45)stops.push(r);});if(!stops.length)stops.push(pool[Math.floor(Math.random()*pool.length)]);}
    const pts=[];let z='gate';const j=()=>(Math.random()-.5)*2.2;
    stops.forEach((r,k)=>{legs(z,zone(r)).forEach(n=>pts.push({x:n.x+j(),z:n.z+j()}));const f=W.PLOTS[r].front;pts.push({x:f.x+j()*.6,z:f.z+j()*.6,stop:r,last:k===stops.length-1});z=zone(r);});
    legs(z,'road').forEach(n=>pts.push({x:n.x+j(),z:n.z+j()}));pts.push({x:N.road.x+j(),z:N.road.z+j()});pts.push({x:N.gate.x+j()*1.5,z:N.gate.z+4,end:true});return pts;}
  function spawn(c){const m=W.makePerson(c.type);m.position.set(N.gate.x+(Math.random()-.5)*3,0,N.gate.z+6);W.scene.add(m);crowd.push({c,m,pts:plan(c),k:0,wait:0,t:Math.random()*6});}
  W.tickers.push(dt0=>{if(G.phase!=='market')return false;const dt=dt0*speed;
    spawnT-=dt;if(spawned<list.length&&spawnT<=0&&crowd.length<60){spawn(list[spawned++]);spawnT=.42;}
    for(let i=crowd.length-1;i>=0;i--){const a=crowd[i],m=a.m,rig=m.userData.rig;a.t+=dt;
      if(a.wait>0){a.wait-=dt;rig.l.rotation.x=rig.r.rotation.x=0;rig.al.rotation.x=rig.ar.rotation.x*.9;if(a.wait<=0)a.k++;continue;}
      const p=a.pts[a.k];if(!p){W.scene.remove(m);crowd.splice(i,1);finished++;continue;}
      const dx=p.x-m.position.x,dz=p.z-m.position.z,dist=Math.hypot(dx,dz),st=3.4*dt;
      m.rotation.y+=((Math.atan2(dx,dz)-m.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*8);
      const sw=Math.sin(a.t*9)*.55;rig.l.rotation.x=sw;rig.r.rotation.x=-sw;rig.al.rotation.x=-sw*.7;if(!rig.sack.visible)rig.ar.rotation.x=sw*.7;
      if(dist<=st){m.position.x=p.x;m.position.z=p.z;
        if(p.stop!=null){const f=W.PLOTS[p.stop];m.rotation.y=Math.atan2(-f.face[0],-f.face[1]);a.wait=p.last?1.5:.7;
          if(p.last){const c=a.c;c.members.forEach(x=>{if(x.buy>=0)sold[x.buy][x.prod]++;});updShopTags('sales',sold);if(c.buy>=0){rig.sack.visible=true;rig.ar.rotation.x=-.2;}
            const k=c.face<0?3:c.face;const tg=addTag(`${faceHTML(k)}${c.face<0?'살 게 없네':FACES[k].say}`,'bub',()=>({x:m.position.x,y:3.2,z:m.position.z}));tg.life=1.8/speed;}}
        else a.k++;}
      else{m.position.x+=dx/dist*st;m.position.z+=dz/dist*st;}}
    const c=$('#cnt');if(c)c.innerHTML=`${Math.min(all.length,spawned*GRP)}<small>/ ${all.length}명</small>`;
    if(!done&&spawned>=list.length&&crowd.length===0){done=true;const b=$('#next');if(b){b.disabled=false;b.onclick=()=>go('result');}}});
  $('#skip').onclick=()=>{crowd.forEach(a=>W.scene.remove(a.m));crowd=[];G.last.res.forEach((r,i)=>{PK.forEach(p=>sold[i][p]=r.sold[p]);});updShopTags('sales',sold);go('result');};}

/* ---------- 5. 결산 ---------- */
function result(){crowd.forEach(a=>W.scene.remove(a.m));crowd=[];tags.forEach(t=>{if(t.life!=null)dropTag(t);});
  const L=G.last;if(G.applied!==G.day){G.applied=G.day;
    G.teams.forEach((t,i)=>{const r=L.res[i];t.total+=r.profit;t.waste+=r.waste;const nr=E.nextRep(t,r);t.rep=nr.rep;t.repConf=nr.conf;});
    const rk=G.teams.slice().sort((a,b)=>b.total-a.total);G.teams.forEach(t=>t.ranks.push(rk.indexOf(t)+1));}
  updShopTags('result');W.view.all();
  frame(`<div class="lab">${DAY[G.day]} 결산</div><button class="go" id="open">장부</button>`);
  const show=()=>{const last=G.day===2,rows=G.teams.map((t,i)=>({t,r:L.res[i]})).sort((a,b)=>b.r.profit-a.r.profit),tot=G.teams.slice().sort((a,b)=>b.total-a.total);
    const strat=d=>[d.quality==='good'?'좋은 재료':'',d.pack==='pretty'?'선물 포장':'',...d.promo.map(k=>E.PROMOS[k].name)].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('');
    const s=sheet(`<h3>${DAY[G.day]} 장부 <small style="font-weight:500;color:var(--ink3);font-size:14px">${ev().t} · 손님 ${L.real}명</small></h3><div class="cols"><div style="overflow-x:auto"><table class="res"><tr><th>팀</th><th style="text-align:left">판 물건</th><th style="text-align:left">전략</th><th>손님</th><th>후기</th><th>이익</th></tr>${
      rows.map(({t,r})=>`<tr><td><span class="tm"><i style="background:${t.col}"></i>${t.name}</span><small>${t.spot+1}번${t.bid?' · '+won(t.bid):''}</small></td>
      <td style="text-align:left"><div class="goods">${picks(t.d).map(p=>`<span><img src="${P[p].img}" alt="">${P[p].short} ${won(t.d.p[p].price)} · ${r.sold[p]}/${t.d.p[p].qty}${L.sellers[p]===1?' <em style="font-style:normal;color:var(--gam)">독점</em>':''}</span>`).join('')}</div></td>
      <td style="text-align:left">${strat(t.d)||'<span class="pill">기본</span>'}</td><td><div class="faces">${r.face.map((x,k)=>x?`<span title="${FACES[k].lab}">${faceHTML(k)}${x}</span>`:'').join('')}</div></td>
      <td><span class="stars">${r.star==null?'—':stars(r.star)}</span></td><td class="big ${r.profit>=0?'pos':'neg'}">${r.profit>=0?'+':''}${won(r.profit)}</td></tr>`).join('')}</table></div>
     <div><h4 style="margin-bottom:10px">사흘 합계</h4><div class="rank">${tot.map((t,k)=>`<div><span class="n">${k+1}</span><span class="tm" style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:3px;background:${t.col}"></i>${t.name} <span class="stars" style="font-size:12px">${stars(t.rep)}</span></span><b class="${t.total>=0?'pos':'neg'}">${t.total>=0?'+':''}${won(t.total)}</b></div>`).join('')}</div></div></div>
     <div class="econ" style="margin-top:18px">${econCards(L).map(c=>`<div class="ecard"><span class="k">${c.k}</span><b>${c.t}</b><p>${c.d}</p></div>`).join('')}</div>
     <div class="effs" style="margin-top:14px">${rows.map(({t})=>{let ef=L.eff[G.teams.indexOf(t)];ef=ef.filter(x=>x.dProfit!==0);return ef.length?`<div class="eff"><span class="tm"><i style="background:${t.col}"></i>${t.name}</span><div class="echips">${ef.map(x=>`<span class="echip ${x.dProfit>0?'up':x.dProfit<0?'down':''}"><b>${x.label}</b>${x.dProfit>0?'+':''}${won(x.dProfit)}</span>`).join('')}</div></div>`:'';}).join('')}</div>
     <div class="foot"><button class="line" id="x">닫기</button><button class="go" id="n">${last?'시상식':DAY[G.day+1]}</button></div>`);
    s.querySelector('#x').onclick=()=>s.remove();s.querySelector('#n').onclick=()=>{s.remove();if(last)go('awards');else{G.day++;go('brief');}};};
  $('#open').onclick=show;show();}
function econCards(L){const out=[],T2=G.teams;
  const mono=T2.map((t,i)=>({t,ps:picks(t.d).filter(p=>L.sellers[p]===1),r:L.res[i]})).filter(x=>x.ps.length).sort((a,b)=>b.r.profit-a.r.profit)[0];
  if(mono)out.push({k:'독점',t:`${P[mono.ps[0]].name}은 ${mono.t.name}만 팔았어요`,d:'비교할 가게가 없어 값이 높아도 팔렸어요.'});
  PK.forEach(p=>{if(out.length>=3)return;const s=T2.map((t,i)=>({t,pr:t.d.p[p].price,q:t.d.p[p].qty,s:L.res[i].sold[p]})).filter(x=>x.q>0);if(s.length<2)return;s.sort((a,b)=>a.pr-b.pr);const lo=s[0],hi=s[s.length-1];if(hi.pr-lo.pr<300)return;
    out.push({k:'경쟁',t:`${P[p].name}, ${s.length}팀이 같이 팔았어요`,d:`${lo.t.name} ${won(lo.pr)}원 → ${lo.s}/${lo.q}개, ${hi.t.name} ${won(hi.pr)}원 → ${hi.s}/${hi.q}개`});});
  let worst=null;T2.forEach((t,i)=>{const r=L.res[i],q=PK.reduce((a,p)=>a+t.d.p[p].qty,0);if(q&&r.waste/q>=.3&&(!worst||r.waste>worst.w))worst={t,w:r.waste,q};});
  if(worst&&out.length<3)out.push({k:'재고',t:`${worst.t.name}은 ${worst.w}개를 버렸어요`,d:'남은 물건도 다 돈이에요.'});
  const nothing=L.list.filter(c=>c.buy<0&&c.face===-1).length;if(nothing>=15&&out.length<3)out.push({k:'기회',t:`손님 ${nothing}명이 그냥 갔어요`,d:'살 물건이 없거나 다 떨어졌어요.'});
  if(!out.length)out.push({k:'시장',t:'비슷한 하루',d:'내일은 다른 선택을 해 볼까요?'});return out.slice(0,3);}

/* ---------- 6. 시상 ---------- */
function awards(){orbitOn=true;W.flyTo({dist:80,pitch:.6});const T2=G.teams,by=f=>T2.slice().sort((a,b)=>f(b)-f(a))[0];
  const best=by(t=>t.total),sat=by(t=>t.rep),thrift=by(t=>-t.waste),rise=by(t=>t.ranks[0]-t.ranks[2]),bid=T2.filter(t=>t.bidsTotal>0),hunt=bid.length?bid.slice().sort((a,b)=>b.total/b.bidsTotal-a.total/a.bidsTotal)[0]:null;
  const A=[['최고 장사꾼',best,won(best.total)+'원'],['손님 만족',sat,'별점 '+sat.rep.toFixed(1)],['알뜰 경영',thrift,'버린 물건 '+thrift.waste+'개'],['역전',rise,rise.ranks[0]+'위 → '+rise.ranks[2]+'위'],...(hunt?[['명당 사냥꾼',hunt,'자리값 '+won(hunt.bidsTotal)+'원']]:[])];
  frame(`<div class="lab">시상식</div><button class="line" id="again">처음으로</button>`);
  const s=sheet(`<h3>시상식</h3><div class="awards">${A.map(([a,t,d])=>`<div class="award"><span class="t">${a}</span><span class="w" style="color:${t.col}">${t.name}</span><span class="d">${d}</span></div>`).join('')}</div><div class="foot"><button class="go" id="c">닫기</button></div>`);
  s.querySelector('#c').onclick=()=>s.remove();$('#again').onclick=()=>location.reload();}
go('title');
})();
</script>
</body></html>
