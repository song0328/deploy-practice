<div class="wrap" id="app"></div>
<script>
// ===== 장날 엔진 (화면과 분리된 규칙) =====
const ENGINE=(function(){
const START=150000;
const PRODUCTS={gam:{name:'감말랭이',cost:1200},ice:{name:'아이스홍시',cost:1300}};
const PK=['gam','ice'];
const TYPES={
  어르신:{n:38,wtp:{gam:[1800,3400],ice:[800,1800]}},
  주민:{n:26,wtp:{gam:[1500,2900],ice:[1200,2500]}},
  학생:{n:22,wtp:{gam:[600,1500],ice:[1400,2800]}},
  관광객:{n:16,wtp:{gam:[2400,4800],ice:[2400,4400]}}
};
const GOOD=1.4;
const QUAL=1.1;          // 좋은 재료는 보기에도 좋아 조금 더 낼 마음              // 좋은 재료 원가 배수
const PACK={basic:{cost:0,eff:{}},pretty:{cost:300,eff:{관광객:1.35,주민:1.2,학생:1.12,어르신:1.08}}};
const PROMOS={
  insta:{name:'인스타',cost:10000,eff:{},reach:{학생:.4,관광객:.4}},     // 학생·관광객 10명 중 4명이 먼저 찾아옴
  flyer:{name:'전단',cost:7000,eff:{},reach:{어르신:.35,주민:.35}},         // 어르신·주민 약 3명 중 1명이 먼저 찾아옴
  taste:{name:'시식',cost:8000,eff:{어르신:1.05,주민:1.05,학생:1.05,관광객:1.05},reach:{}}
};
const SPOT_STEP=0;
const PASS=[1,.9,.75,.75,.55,.5];   // 집터별로 손님이 지나가며 볼 확률
const REACH_BONUS=700;        // 홍보를 보고 찾아온 손님은 그 가게를 조금 더 좋게 본다(원)
const hf=(a,b,c)=>{const h=Math.sin(a*9137.1+b*71.3+c*13.7)*43758.5453;return h-Math.floor(h);};
const TEMP=700;              // 손님 취향의 폭(원): 클수록 고르게 나뉨
const EVENTS=[
  {id:'normal',t:'평범한 장날',mul:{},wmul:{},cost:{}},
  {id:'bus',t:'관광버스 도착! 관광객 2.5배',mul:{관광객:2.5},wmul:{},cost:{}},
  {id:'cold',t:'찬 바람… 아이스홍시 인기 뚝',mul:{},wmul:{ice:.65},cost:{}},
  {id:'fest',t:'청도 축제! 학생 2배',mul:{학생:2,주민:1.2},wmul:{},cost:{}},
  {id:'gamup',t:'감 흉년, 감말랭이 원가 +300원',mul:{},wmul:{},cost:{gam:300}},
  {id:'rain',t:'비 오는 날, 손님 40% 감소',mul:{어르신:.6,주민:.6,학생:.6,관광객:.6},wmul:{},cost:{}}
];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickEvents(seed){const r=rng(seed);const pool=EVENTS.slice(1);const out=[EVENTS[0]];for(let i=0;i<2;i++)out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);return out;}
function unitCost(ev,p,quality){return Math.round((PRODUCTS[p].cost+(ev.cost[p]||0))*(quality==='good'?GOOD:1))+0;}
const CROWD=2.8;             // 손님 규모 (하루 약 290명)
function crowd(ev){const o={};for(const k in TYPES)o[k]=Math.round(TYPES[k].n*CROWD*(ev.mul[k]||1));return o;}
function planCost(ev,d){let c=d.bid||0;for(const p of PK)c+=d.p[p].qty*(unitCost(ev,p,d.quality)+PACK[d.pack].cost);for(const k of d.promo)c+=PROMOS[k].cost;return c;}
function repEff(rep,conf){return 1+Math.max(-.1,Math.min(.18,(rep-3)*.1))*conf;}
// teams: [{spot, p:{gam:{price,qty},ice:{...}}, quality, pack, promo:[], bid, rep, repConf}]
function simulate(ev,teams,seed){
  const r=rng(seed),c0=crowd(ev),fr=rng(seed*7+3),c={},list=[];let real=0,expect=0;
  // 예상 손님은 미리 알려 주지만, 실제로는 종류마다 ±25% 안에서 더 오거나 덜 온다
  for(const k in c0){c[k]=Math.round(c0[k]*(0.75+fr()*0.5));real+=c[k];expect+=c0[k];}
  for(const k in c)for(let i=0;i<c[k];i++){const w={};for(const p of PK){const [a,b]=TYPES[k].wtp[p];w[p]=(a+(b-a)*r())*(ev.wmul[p]||1);}list.push({type:k,w,o:r()});}
  list.sort((a,b)=>a.o-b.o);
  const st=teams.map(t=>({left:{gam:t.p.gam.qty,ice:t.p.ice.qty},sold:{gam:0,ice:0},sales:0,face:[0,0,0,0],sat:[]}));
  for(const cu of list){
    let best=null;const seen=new Set(),opts=[];
    teams.forEach((t,i)=>{
      // 지나가며 볼지(자리) + 홍보를 보고 일부러 찾아올지
      let came=false;t.promo.forEach((k,j)=>{const rc=PROMOS[k].reach[cu.type]||0;if(rc&&hf(cu.o,i+1,j+5)<rc)came=true;});
      if(!came&&hf(cu.o,t.spot+11,3)>=PASS[t.spot])return;
      let b=(PACK[t.pack].eff[cu.type]||1)*repEff(t.rep,t.repConf)*(t.quality==='good'?QUAL:1);for(const k of t.promo)b*=PROMOS[k].eff[cu.type]||1;
      for(const p of PK){if(st[i].left[p]<=0)continue;const v=cu.w[p]*b,pr=t.p[p].price;
        if(v>=pr)opts.push({i,p,v,u:v-pr+(came?REACH_BONUS:0)});else seen.add(i);}});
    // 손님마다 취향이 달라, 비슷한 조건이면 여러 가게로 고르게 나뉜다 (차이가 클수록 좋은 곳에 몰림)
    if(opts.length){const mx=Math.max(...opts.map(o=>o.u));let sum=0;opts.forEach(o=>{o.w=Math.exp((o.u-mx)/TEMP);sum+=o.w;});let bs=-1;for(const o of opts){const h=Math.sin(cu.o*9137.1+o.i*71.3+(o.p==='gam'?0:13.7))*43758.5453,s=o.w/(1+st[o.i].sold[o.p])*(1+(h-Math.floor(h))*.4);if(s>bs){bs=s;best=o;}}}
    if(!best)seen.forEach(i=>st[i].face[3]++);
    if(!best){cu.buy=-1;cu.face=seen.size?3:-1;continue;}
    const t=teams[best.i],pr=t.p[best.p].price,ratio=pr/best.v,face=ratio<.6?0:ratio<.85?1:2;
    cu.buy=best.i;cu.prod=best.p;cu.face=face;
    const s=st[best.i];s.face[face]++;s.left[best.p]--;s.sold[best.p]++;s.sales+=pr;
    s.sat.push(Math.max(1,Math.min(5,3+(t.quality==='good'?1.2:0)+[1,.4,-1][face])));
  }
  const res=teams.map((t,i)=>{const s=st[i],cost=planCost(ev,t),n=s.sat.length,star=n?s.sat.reduce((a,b)=>a+b,0)/n:null,waste=s.left.gam+s.left.ice;
    return{...s,cost,profit:s.sales-cost,star,n,waste};});
  return{list,res,real,expect};
}
// 무엇이 얼마나 통했나: 한 팀의 한 가지 선택만 빼고 같은 장날을 다시 돌려 비교한다
function attribution(ev,teams,seed){const base=simulate(ev,teams,seed).res,n=teams.length,sold=x=>x.sold.gam+x.sold.ice;
  return teams.map((t,i)=>{const out=[];const test=(label,mod)=>{const alt=teams.map((u,j)=>j===i?mod(JSON.parse(JSON.stringify(u))):u);const r=simulate(ev,alt,seed).res[i];out.push({label,dSold:sold(base[i])-sold(r),dProfit:base[i].profit-r.profit});};
    if(t.spot<n-1)test('자리',u=>{u.spot=n-1;u.bid=0;return u;});
    if(t.quality==='good')test('좋은 재료',u=>{u.quality='normal';return u;});
    if(t.pack==='pretty')test('선물 포장',u=>{u.pack='basic';return u;});
    t.promo.forEach(k=>test(PROMOS[k].name,u=>{u.promo=u.promo.filter(x=>x!==k);return u;}));
    if(t.repConf>0&&Math.abs(t.rep-3)>.05)test('별점',u=>{u.rep=3;u.repConf=0;return u;});
    return out;});}
function nextRep(t,r){if(r.star==null)return{rep:t.rep,conf:t.repConf*.6};return{rep:t.rep*.4+r.star*.6,conf:Math.min(1,r.n/10)};}
return{START,PRODUCTS,PK,TYPES,GOOD,PACK,PROMOS,EVENTS,SPOT_STEP,rng,pickEvents,unitCost,crowd,planCost,simulate,nextRep,repEff,attribution,PASS,REACH_BONUS};

  const uc=p=>E.unitCost(ev(),p,d.quality)+E.PACK[d.pack].cost;const itemCost=E.PK.reduce((a,p)=>a+d.p[p].qty*uc(p),0),fixedAll=bid+d.promo.reduce((a,k)=>a+E.PROMOS[k].cost,0);
  const sent=S.plan?`<div class="ok">✓ 가게 준비를 보냈어요<small>· 선생님이 장을 열기 전까지는 고쳐서 다시 보낼 수 있어요</small></div>`:'';
  frame(`<div class="card"><h2>가게 준비 <small style="font-size:14px;color:var(--ink3);font-weight:500">${t.spot+1}번 집터 · 다른 팀은 보지 않기</small></h2>
   <div class="prods">${E.PK.map(p=>`<div class="prod"><div class="pn">${PN[p]}<small>1개 원가 ${won(uc(p))}원</small></div>
     <div class="stp"><label>판매 가격</label><div class="stepper"><button data-a="${p}.price.-100">−</button><output>${won(d.p[p].price)}</output><button data-a="${p}.price.100">+</button></div></div>
     <div class="stp"><label>준비 개수</label><div class="stepper"><button data-a="${p}.qty.-5">−</button><output>${d.p[p].qty}</output><button data-a="${p}.qty.5">+</button></div></div>${(()=>{const q=d.p[p].qty,pr=d.p[p].price;if(!q)return '<div class="be">이 상품은 팔지 않아요</div>';const share=fixedAll*(q*uc(p))/Math.max(1,itemCost),need=Math.ceil((q*uc(p)+share)/Math.max(1,pr));return need>q?`<div class="be bad">다 팔아도 손해예요 · 본전 ${need}개</div>`:`<div class="be"><b>${need}개</b> 이상 팔면 본전 (${q}개 중)</div>`;})()}</div>`).join('')}</div>
   <div class="opts"><div class="opt"><h5>재료</h5><div class="chips"><button data-q="normal" class="${d.quality==='normal'?'on':''}">보통 재료<small>원가 그대로</small></button><button data-q="good" class="${d.quality==='good'?'on':''}">좋은 재료<small>원가 +40% · 별점 상승</small></button></div></div>
    <div class="opt"><h5>포장</h5><div class="chips"><button data-k="basic" class="${d.pack==='basic'?'on':''}">기본 봉투<small>추가 비용 없음</small></button><button data-k="pretty" class="${d.pack==='pretty'?'on':''}">선물 포장<small>개당 +${won(E.PACK.pretty.cost)}원</small></button></div></div>
    <div class="opt"><h5>홍보 · 여러 개 가능</h5><div class="chips">${Object.entries(E.PROMOS).map(([k,x])=>`<button data-m="${k}" class="${d.promo.includes(k)?'on':''}">${x.name}<small>${won(x.cost)}원</small></button>`).join('')}</div></div></div>
   <label class="note"><span>오늘 우리 팀 전략 한 줄</span><input id="note" maxlength="40" placeholder="예) 관광객이 많으니 선물 포장으로 비싸게" value="${esc(d.note)}"></label>
   <div class="wallet"><div class="nums"><span>밑천<b>${won(E.START)}</b></span><span>자리값<b>${won(bid)}</b></span><span>쓸 돈<b>${won(cost)}</b></span><span>남는 돈<b class="${over?'neg':''}">${won(left)}</b></span><span>다 팔면 매출<b>${won(rev)}</b></span></div>
    <div class="bar ${over?'over':''}"><i style="width:${Math.min(100,cost/E.START*100)}%"></i></div></div>
   ${sent}
   <div class="foot">${over?`<span style="margin-right:auto;color:var(--bad);font-size:14px">${won(-left)}원 넘었어요. 개수를 줄이거나 선택을 빼 주세요.</span><button class="line" id="fit">개수 자동 맞추기</button>`:''}<button class="go" id="ok" ${over?'disabled':''} style="font-size:17px;padding:14px 26px">${S.plan?'고친 걸로 다시 보내기':'확정해서 보내기'}</button></div></div>${research()}`);bindTabs();
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const [p,f,v]=b.dataset.a.split('.');d.p[p][f]=Math.max(0,Math.min(f==='price'?9900:200,d.p[p][f]+ +v));render(true);});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{d.quality=b.dataset.q;render(true);});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{d.pack=b.dataset.k;render(true);});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;d.promo=d.promo.includes(k)?d.promo.filter(x=>x!==k):[...d.promo,k];render(true);});
  const fit=$('#fit');if(fit)fit.onclick=()=>{let guard=200;while(guard--&&E.START<E.planCost(ev(),{...d,bid})){const p=d.p.gam.qty>=d.p.ice.qty?'gam':'ice';if(d.p.gam.qty+d.p.ice.qty===0)break;d.p[p].qty=Math.max(0,d.p[p].qty-5);}render(true);};
  const ni=$('#note');ni.oninput=()=>{d.note=ni.value;};
  $('#ok').onclick=async()=>{d.note=ni.value.trim();const b=$('#ok');b.disabled=true;try{await api({a:'plan',code:S.code,token:S.token,day:S.snap.day,d});S.plan=JSON.parse(JSON.stringify(d));toast('보냈어요. 선생님이 장을 열 때까지 기다려요');render(true);}catch(e){toast(e.message);b.disabled=false;}};}

function market(){const t=myTeam(),lv=S.snap.live,s=lv&&lv.sold&&lv.sold[S.me]||{gam:0,ice:0},d=S.plan||{p:{gam:{qty:0},ice:{qty:0}}};
  frame(`<div class="card"><h2>장이 열렸어요</h2><p class="sub">큰 화면에서 손님들이 장터를 돌아다녀요. 우리 가게에서 얼마나 팔리는지 보세요.</p>
   <div class="live"><div><small>감말랭이</small><b>${s.gam}<span style="font-size:16px;color:var(--ink3)"> / ${d.p.gam.qty}</span></b></div><div><small>아이스홍시</small><b>${s.ice}<span style="font-size:16px;color:var(--ink3)"> / ${d.p.ice.qty}</span></b></div></div>
   <div class="wait"><span class="dot"></span>손님 ${lv?lv.n:0} / ${lv?lv.all:'?'}명 지나감</div></div>`);}

function result(){const t=myTeam(),P=(S.snap.pub||[])[S.snap.day];if(!P){frame(`<div class="card"><h2>결산 중</h2><div class="wait"><span class="dot"></span>장부를 정리하는 중</div></div>`);return;}
  const r=P.res[S.me],teams=S.snap.teams,order=teams.map((x,i)=>i).sort((a,b)=>P.res[b].profit-P.res[a].profit),myRank=order.indexOf(S.me)+1,tot=teams.map((x,i)=>i).sort((a,b)=>teams[b].total-teams[a].total);
  const strat=d=>[d.quality==='good'?'좋은 재료':'',d.pack==='pretty'?'선물 포장':'',...d.promo.map(k=>E.PROMOS[k].name)].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('')||'<span class="pill">기본</span>';
  frame(`<div class="card"><h2>${DAY[S.snap.day]} 우리 장부 <small style="font-size:14px;color:var(--ink3);font-weight:500">${esc(P.ev)} · 실제 손님 ${P.real}명 (예상 ${P.expect}명)</small></h2>
   <div style="display:flex;align-items:baseline;gap:12px;margin:6px 0"><span class="big ${r.profit>=0?'pos':'neg'}">${r.profit>=0?'+':''}${won(r.profit)}원</span><span style="color:var(--ink3)">오늘 ${myRank}위 / ${teams.length}팀${r.auto?' · 컴퓨터가 대신 정했어요':''}</span></div>
   <div class="kv"><div>매출<b>${won(r.sales)}</b></div><div>쓴 돈<b>${won(r.cost)}</b></div><div>후기<b>${r.star==null?'—':stars(r.star)}</b></div>
    ${E.PK.map(p=>`<div>${PN[p]}<b>${r.d.p[p].qty?`${r.sold[p]}/${r.d.p[p].qty}개`:'—'}</b>${r.d.p[p].qty?won(r.d.p[p].price)+'원':''}</div>`).join('')}<div>버린 물건<b>${r.waste}개</b></div></div>
   <div class="summ">${strat(r.d)}${r.d.note?`<span class="pill">“${esc(r.d.note)}”</span>`:''}</div>
   <h3 style="margin-top:16px">손님 반응</h3><div class="summ">${r.face.map((x,k)=>`<span class="pill" style="border-left:4px solid ${FACES[k].col}">${FACES[k].lab} ${x}명</span>`).join('')}</div>
   <h3 style="margin-top:16px">무엇이 통했나 <small style="font-weight:500;color:var(--ink3)">그 선택을 빼고 다시 돌려 본 차이</small></h3><div class="echips">${r.eff&&r.eff.length?r.eff.map(x=>`<span class="echip ${x.dProfit>0?'up':x.dProfit<0?'down':''}"><b>${esc(x.label)}</b>판매 ${x.dSold>0?'+':''}${x.dSold}개<em>${x.dProfit>0?'+':''}${won(x.dProfit)}원</em></span>`).join(''):'<span class="hint">특별한 선택 없음</span>'}</div></div>
   <div class="card"><h3>오늘 순위</h3><div class="rank">${order.map((i,k)=>`<div class="${i===S.me?'me':''}"><span class="n">${k+1}</span><i style="background:${TCOL[i]}"></i>${esc(teams[i].name)} <small style="color:var(--ink3)">${teams[i].spot+1}번 · ${strat(P.res[i].d).replace(/<[^>]+>/g,' ').trim()}</small><b class="${P.res[i].profit>=0?'pos':'neg'}">${P.res[i].profit>=0?'+':''}${won(P.res[i].profit)}</b></div>`).join('')}</div>
   <h3 style="margin-top:16px">사흘 합계</h3><div class="rank">${tot.map((i,k)=>`<div class="${i===S.me?'me':''}"><span class="n">${k+1}</span><i style="background:${TCOL[i]}"></i>${esc(teams[i].name)} <small style="color:var(--ink3)">${stars(teams[i].rep)}</small><b class="${teams[i].total>=0?'pos':'neg'}">${teams[i].total>=0?'+':''}${won(teams[i].total)}</b></div>`).join('')}</div></div>
   <div class="card"><h3>오늘의 경제 이야기</h3>${(P.econ||[]).map(c=>`<div class="ecard"><span class="k">${esc(c.k)}</span><b>${esc(c.t)}</b><p>${esc(c.d)}</p></div>`).join('')}</div>
   <div class="wait" style="padding:6px 4px"><span class="dot"></span>${S.snap.day<2?'선생님이 다음 장날을 열면 화면이 바뀌어요':'곧 시상식이에요'}</div>`);}

function awards(){const teams=S.snap.teams,A=S.snap.awards||[];
  frame(`<div class="card"><h2>청도 장날 시상식</h2><p class="sub">사흘 동안 수고했어요.</p><div class="awards">${A.map(a=>`<div class="award ${a.i===S.me?'me':''}"><span class="t">${esc(a.a)}상</span><span class="w" style="color:${TCOL[a.i]}">${esc(teams[a.i].name)}</span><span class="d">${esc(a.d)}</span></div>`).join('')}</div></div>
   <div class="card"><h3>사흘 합계</h3><div class="rank">${teams.map((x,i)=>i).sort((a,b)=>teams[b].total-teams[a].total).map((i,k)=>`<div class="${i===S.me?'me':''}"><span class="n">${k+1}</span><i style="background:${TCOL[i]}"></i>${esc(teams[i].name)}<b class="${teams[i].total>=0?'pos':'neg'}">${teams[i].total>=0?'+':''}${won(teams[i].total)}</b></div>`).join('')}</div></div>
   <div style="text-align:center;margin-top:14px"><button class="line" id="leave">처음 화면으로</button></div>`,{steps:false});
  $('#leave').onclick=()=>{forget();S.token='';S.me=-1;S.snap=null;joinScreen();};}

/* ---------- 그리기 · 받아오기 ---------- */
let lastKey='';
function render(force){if(!S.snap||S.me<0)return;const sn=S.snap;const t=myTeam();
  // 사람 팀 자리가 아니면(컴퓨터가 맡은 자리) 안내
  if(sn.phase!=='lobby'&&sn.phase!=='title'&&(!t||t.ai)){frame(`<div class="card"><h2>이번 장날에는 참가하지 못했어요</h2><p class="sub">선생님이 장터를 열 때 우리 팀이 들어와 있지 않아 컴퓨터가 맡았어요. 다음 판에 다시 들어와 주세요.</p><button class="line" id="leave">처음 화면으로</button></div>`,{steps:false});$('#leave').onclick=()=>{forget();S.token='';S.me=-1;S.snap=null;joinScreen();};return;}
  const key=JSON.stringify([sn.phase,sn.day,sn.auction&&sn.auction.spot,sn.auction&&sn.auction.open,(sn.auction&&sn.auction.done||[]).length,sn.live,S.bid,S.plan&&S.plan.at,(sn.pub||[]).length,t&&t.spot,S.tab]);
  const active=document.activeElement;const typing=active&&active.tagName==='INPUT'&&sn.phase==='decide';
  if(!force&&key===lastKey)return;if(!force&&typing)return;lastKey=key;
  window.scrollTo({top:sn.phase!==S.lastPhase?0:window.scrollY});S.lastPhase=sn.phase;
  const fn=({lobby,title:lobby,open:openOrMeet,meet:openOrMeet,auction,decide,market,result,awards})[sn.phase]||lobby;fn();}

async function poll(){if(!S.token)return;try{const j=await api({a:'poll',code:S.code,token:S.token});S.fails=0;netWarn('');S.me=j.me;S.snap=j.snap;
    if(!S.plan||S.plan.at!==(j.plan&&j.plan.at))S.plan=j.plan;if(j.snap.phase!=='decide'){/* 장이 열리면 초안은 다음 날을 위해 비운다 */if(j.snap.phase==='market'&&S.draft){S.lastPlan=S.plan||S.draft;S.draft=null;}}
    S.bid=j.bid;render();}
  catch(e){if(e.status===403||e.status===404){forget();S.token='';S.me=-1;S.snap=null;joinScreen(e.message);return;}if(++S.fails>=3)netWarn('서버와 연결이 끊겼어요. 잠시 뒤 다시 이어져요.');}}
setInterval(poll,1500);

/* 시작: 전에 들어온 방이 있으면 이어서 */
(function(){let r=null;try{r=JSON.parse(localStorage.getItem('jn-team')||'null');}catch(_){}
  const q=new URLSearchParams(location.search);if(q.get('code'))S.code=q.get('code').replace(/\D/g,'').slice(0,4);
  if(r&&r.token&&Date.now()-(r.at||0)<12*3600*1000){S.code=r.code;S.token=r.token;S.me=r.me;S.name=r.name||'';poll().then(()=>{if(!S.snap)joinScreen();});}
  else joinScreen();})();
})();
</script>
</body></html>
