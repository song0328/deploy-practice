*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#0F2B20;color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
#c3d{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.tag .lab{background:rgba(251,247,236,.94);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2);text-align:center;line-height:1.25}
.tag .lab small{display:block;font-weight:500;color:var(--ink3);font-size:10px}

.brand .mk{width:12px;height:12px;background:var(--gold);transform:rotate(45deg);border-radius:3px}
.brand small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:500}
.clock{margin-left:auto;padding:8px 16px;font-family:var(--serif);font-size:22px;letter-spacing:.04em}
.clock.low{color:var(--bad)}
.goal{padding:8px 14px;font-size:13px;color:var(--ink2)}
.goal b{font-family:var(--serif);font-size:16px;color:var(--green)}

.pl i{width:14px;height:14px;border-radius:5px;background:var(--c)}

.pl small{color:var(--ink3);display:block}

.pl .g{display:inline-block;width:20px;height:20px;border-radius:6px;background:var(--green);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-right:4px}

.cam button{padding:0;height:36px;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}

.hero h1{font-family:var(--serif);font-size:44px;margin:4px 0 0;color:var(--green);line-height:1.1}

.hero p{color:var(--ink2);margin:0 0 14px;font-size:15px}

.names{display:grid;gap:6px;margin:12px 0}
.names label{display:flex;align-items:center;gap:8px}

.copy{position:fixed;right:12px;top:10px;font-size:11px;color:#9FB5A8;pointer-events:none}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media (max-width:760px){.players{width:170px;font-size:12px}.pl .cash{font-size:13px}.dock .msg{display:none}.goal{display:none}.hero h1{font-size:34px}}

  <div class="panel dock" id="dock"><div class="who" style="--c:${p.col}"><i></i>${p.name}</div>${dock}</div>
  <div class="panel cam"><button id="c1">↺</button><button id="c2">＋</button><button id="c3">↻</button><button id="c4">⌂</button><button id="c5">－</button><button id="c6">▣</button></div><div class="copy">© 2026 따숨교육</div>`;
  $('#c1').onclick=()=>W.flyTo({yaw:W.want.yaw+.5});$('#c3').onclick=()=>W.flyTo({yaw:W.want.yaw-.5});$('#c2').onclick=()=>W.flyTo({dist:Math.max(20,W.want.dist*.75)});$('#c5').onclick=()=>W.flyTo({dist:Math.min(110,W.want.dist*1.3)});$('#c4').onclick=()=>W.flyTo({yaw:0,pitch:1.22,dist:82,tx:0,tz:0});$('#c6').onclick=()=>W.flyTo({pitch:1.4,dist:70,tx:0,tz:0});}
setInterval(()=>{const c=$('#clock');if(!c||G.phase==='title'||G.over)return;c.textContent=clockTxt();c.classList.toggle('low',Date.now()-G.t0>(D.TIME_MIN-3)*60000);if(Date.now()-G.t0>=D.TIME_MIN*60000)endGame('time');},500);

/* 시작 화면 */
let n=4,names=['1번','2번','3번','4번'];
function title(){G.phase='title';
  ui.innerHTML=`<div class="panel hero"><div class="maker"><span class="mk2"></span>따숨교육</div><div class="en">GOOD POWER COMPANY</div><h1>착한전력 주식회사</h1><h2>ESG 10억 챌린지</h2><p>태양과 바람으로 전기를 만들고, ESG 실천으로 회사를 키워요!</p>
   <div class="seg" id="nseg">${[2,3,4].map(k=>`<button data-n="${k}" class="${k===n?'on':''}">${k}명</button>`).join('')}</div>
   <div class="names" id="names"></div>
   <div class="row"><button class="line" id="rules">규칙</button><button class="go" id="start">회사 세우기</button></div>
   <div class="cr"><b>© 2026 따숨교육</b> · 착한전력 주식회사는 따숨교육이 기획·제작한 교육용 게임입니다. 무단 복제·배포·수정을 금합니다.</div></div><div class="copy">© 2026 따숨교육</div>`;
  const drawNames=()=>{$('#names').innerHTML=[...Array(n).keys()].map(i=>`<label><i style="background:${PCOL[i]}"></i><input maxlength="8" value="${names[i]}" data-i="${i}" placeholder="이름"></label>`).join('');$('#names').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{names[+inp.dataset.i]=inp.value;});};drawNames();
  document.querySelectorAll('#nseg button').forEach(b=>b.onclick=()=>{n=+b.dataset.n;document.querySelectorAll('#nseg button').forEach(x=>x.classList.toggle('on',x===b));drawNames();});
  $('#rules').onclick=showRules;$('#start').onclick=()=>start();}
function showRules(){const s=sheet(`<h3>규칙</h3><div class="rules">
  <div class="rule"><b>시작</b><span>개인당 2억, ESG C 등급</span></div>
  <div class="rule"><b>이동</b><span>주사위 2개. 더블이면 한 번 더</span></div>
  <div class="rule"><b>사업</b><span>빈 사업은 사고, 남의 사업은 방문료를 내요. 부족하면 가진 현금만</span></div>
  <div class="rule"><b>업그레이드</b><span>내 차례에 사업 1곳, 구매가의 절반. 방문료 +50%, ESG +1</span></div>
  <div class="rule"><b>출발점</b><span>지나거나 도착하면 ESG 등급별 운영 수익 (D 5,000만 ~ S 2억)</span></div>
  <div class="rule"><b>행동카드</b><span>모둠 전원 45초 미션. 강사님이 성공을 확인하면 뽑은 사람 2억, 전원 ESG +1</span></div>
  <div class="rule"><b>ESG D</b><span>전력망 점검소로 이동, 최대 두 차례 정지. 더블이면 즉시 출발</span></div>
  <div class="rule"><b>승리</b><span>현금 + 사업 구매가가 10억이면 승리. 25분 뒤엔 최고액</span></div></div>
  <div class="foot"><button class="go" id="ok">알겠어요</button></div>`);s.querySelector('#ok').onclick=()=>s.remove();}
function start(){G.players=[...Array(n).keys()].map(i=>({i,name:(names[i]||'').trim()||(i+1)+'번',col:PCOL[i],cash:D.START_CASH,esg:1,pos:0,own:{},jail:0,shortcut:false,upThisTurn:false,tok:W.makeToken(PCOL[i])}));
  G.players.forEach((p,i)=>{const w=W.tileWorld(0,-1.2+(i%2)*2.4,-1.2+Math.floor(i/2)*2.4);p.tok.position.set(w.x,0,w.z);});
  G.news=shuffle(D.NEWS.slice());G.acts=shuffle(D.ACTIONS.slice());G.cur=0;G.t0=Date.now();G.phase='play';beginTurn();}

/* 턴 */
function beginTurn(){const p=cp();p.upThisTurn=false;G.doubles=0;
  const w=W.tileWorld(p.pos);W.flyTo({tx:w.x*.12,tz:w.z*.12,dist:76});
  if(p.shortcut){p.shortcut=false;frame(`<span class="msg">전력망 지름길! 원하는 칸으로 가요</span><button class="go" id="pick">칸 고르기</button>`);$('#pick').onclick=()=>pickTile(p);return;}
  frame(`${p.jail?`<span class="msg">점검소 ${p.jail}차례 남음 · 더블이면 출발</span>`:`<span class="msg">주사위를 굴려요</span>`}<div class="dice"><div class="die" data-v="1">${'<i></i>'.repeat(9)}</div><div class="die" data-v="1">${'<i></i>'.repeat(9)}</div></div><button class="go" id="roll">굴리기</button>${canUpgrade(p)?'<button class="gold" id="up">업그레이드</button>':''}`);
  $('#roll').onclick=()=>roll();const u=$('#up');if(u)u.onclick=()=>upgradeSheet(p);}
function canUpgrade(p){return !p.upThisTurn&&Object.keys(p.own).some(i=>!p.own[i].up&&p.cash>=D.BOARD[i].price/2);}
function roll(){const p=cp();$('#roll').disabled=true;const dies=[...document.querySelectorAll('.die')];dies.forEach(d=>d.classList.add('roll'));
  let k=0;const iv=setInterval(()=>{dies.forEach(d=>d.dataset.v=1+Math.floor(Math.random()*6));if(++k>8){clearInterval(iv);const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);dies.forEach(d=>d.classList.remove('roll'));dies[0].dataset.v=a;dies[1].dataset.v=b;setTimeout(()=>afterRoll(a,b),500);}},90);}
function afterRoll(a,b){const p=cp(),dbl=a===b;
  if(p.jail){if(dbl){p.jail=0;toast('더블! 점검소에서 출발');}else{p.jail--;toast(p.jail?'점검 중… 한 차례 쉬어요':'점검 끝. 다음 차례에 출발');endTurn(false);return;}}
  if(dbl)G.doubles++;
  move(p,a+b,true,()=>land(p,dbl));}
function move(p,steps,income,done){let k=0;const hop=()=>{if(k>=steps){done();return;}const next=(p.pos+1)%32;p.pos=next;k++;
    if(next===0&&income){const inc=D.START_INCOME[p.esg];p.cash+=inc;pop(p,'+'+fmt(inc),'plus');toast(`출발점 통과! 운영 수익 ${fmt(inc)}`);}
    hopTo(p,next,()=>setTimeout(hop,40));};hop();}
function hopTo(p,idx,cb){const o=p.tok.position.clone(),w=W.tileWorld(idx,-1.2+(p.i%2)*2.4,-1.2+Math.floor(p.i/2)*2.4),dur=.22;let t=0;
  W.tickers.push(dt=>{t=Math.min(dur,t+dt);const k=t/dur;p.tok.position.set(o.x+(w.x-o.x)*k,Math.sin(k*Math.PI)*1.2,o.z+(w.z-o.z)*k);if(t>=dur){p.tok.position.y=0;cb();return false;}});
  W.flyTo({tx:w.x*.12,tz:w.z*.12});}
function pickTile(p){const s=sheet(`<h3>전력망 지름길</h3><p class="sub">갈 칸을 고르세요. 출발 수익은 없어요.</p><div class="grid">${D.BOARD.map((b,i)=>i===p.pos?'':`<button data-t="${i}">${b.name}<small>${b.t==='biz'?fmt(b.price):b.t}</small></button>`).join('')}</div>`);
  s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{s.remove();const to=+b.dataset.t;const steps=(to-p.pos+32)%32;move(p,steps,false,()=>land(p,false));});}

/* 도착 */
function land(p,dbl){const b=D.BOARD[p.pos];frame(`<span class="msg">${b.name}</span>`);
  const next=()=>endTurn(dbl);
  if(b.t==='start'){const inc=D.START_INCOME[p.esg];/* move()에서 이미 지급 */setTimeout(next,600);return;}
  if(b.t==='biz')return landBiz(p,b,next);
  if(b.t==='news')return newsCard(p,next);
  if(b.t==='action')return actionCard(p,next);
  if(b.t==='practice')return mission(p,{kind:'teacher',h:'교실 절전 탐정',txt:'안 쓰는 전등이나 기기를 찾아요. 강사님 허락을 받고 끄거나, 끄는 동작을 해요.'},ok=>{if(ok){p.cash+=10000;pop(p,'+1억','plus');esgChange(p,1);}next();});
  if(b.t==='event'){if(b.kind==='shortcut'){p.shortcut=true;info('전력망 지름길',b.desc,next);}
    else if(b.kind==='again'){info('바람 타고 한 번 더',b.desc,()=>{frame(`<span class="msg">한 번 더!</span><div class="dice"><div class="die" data-v="1">${'<i></i>'.repeat(9)}</div><div class="die" data-v="1">${'<i></i>'.repeat(9)}</div></div><button class="go" id="roll">굴리기</button>`);$('#roll').onclick=()=>{$('#roll').disabled=true;const dies=[...document.querySelectorAll('.die')];dies.forEach(d=>d.classList.add('roll'));setTimeout(()=>{const a=1+Math.floor(Math.random()*6),c=1+Math.floor(Math.random()*6);dies.forEach(d=>d.classList.remove('roll'));dies[0].dataset.v=a;dies[1].dataset.v=c;setTimeout(()=>move(p,a+c,true,()=>land(p,dbl)),400);},700);};});}
    else if(b.kind==='fund'){const ps=G.players.slice().sort((x,y)=>networth(y)-networth(x));const top=ps[0],bot=ps[ps.length-1];
      if(ps.length>1&&networth(top)!==networth(ps[1])&&networth(bot)!==networth(ps[ps.length-2])&&top!==bot){const amt=Math.min(2000,top.cash);top.cash-=amt;bot.cash+=amt;info('지역 상생 기금',`순자산 1위 ${top.name}이 최하위 ${bot.name}에게 ${fmt(amt)}을 지원해요.`,next);}
      else info('지역 상생 기금','동률이라 이번엔 생략해요.',next);}
    return;}
  if(b.t==='check'){setTimeout(next,600);return;}
  next();}
function info(h,txt,cb){const s=sheet(`<h3>${h}</h3><p style="font-size:16px">${txt}</p><div class="foot"><button class="go" id="ok">확인</button></div>`);s.querySelector('#ok').onclick=()=>{s.remove();cb();};}
function bizCard(b){return`<div class="biz"><div class="ic" style="background:var(--${b.cat})">${b.cat}</div><div><div class="nm">${b.name}</div><div class="es">${b.esg}</div></div></div>`;}
function landBiz(p,b,next){const idx=p.pos,owner=G.players.find(q=>q.own[idx]);
  if(!owner){const can=p.cash>=b.price;const s=sheet(`${bizCard(b)}<div class="kv"><span>구매가<b>${fmt(b.price)}</b></span><span>방문료<b>${fmt(b.rent)}</b></span><span>내 현금<b>${fmt(p.cash)}</b></span></div>
    <div class="foot"><button class="line" id="no">안 사요</button><button class="go" id="buy" ${can?'':'disabled'}>${can?'사기':'현금 부족'}</button></div>`);
    s.querySelector('#no').onclick=()=>{s.remove();next();};s.querySelector('#buy').onclick=()=>{s.remove();p.cash-=b.price;p.own[idx]={up:false};raise(p,idx);pop(p,'−'+fmt(b.price),'minus');toast(`${b.name} 창업!`);checkWin(p)||next();};return;}
  if(owner===p){toast('내 사업이에요');setTimeout(next,600);return;}
  const rent=b.rent*(owner.own[idx].up?1.5:1),pay=Math.min(rent,p.cash);p.cash-=pay;owner.cash+=pay;pop(p,'−'+fmt(pay),'minus');
  info(`${owner.name}의 ${b.name}`,`방문료 ${fmt(rent)}${pay<rent?` 중 가진 현금 ${fmt(pay)}만 내요.`:'을 내요.'}`,()=>{checkWin(owner)||next();});}
function raise(p,idx){const t=W.TILES[idx],old=t.bld;if(old)W.scene.remove(old);const g=W.makeBuilding(D.BOARD[idx].cat,t.col,p.col,p.own[idx].up);g.scale.setScalar(.75);const w=W.tileWorld(idx,0,1.6);g.position.set(w.x,0,w.z);g.rotation.y=t.p.rot;g.scale.setScalar(.01);W.scene.add(g);t.bld=g;
  let k=0;W.tickers.push(dt=>{k=Math.min(1,k+dt*1.8);const e=1+2.7*Math.pow(k-1,3)+1.7*Math.pow(k-1,2);g.scale.setScalar(Math.max(.01,e*.75));return k<1;});}
function upgradeSheet(p){const list=Object.keys(p.own).map(Number);const s=sheet(`<h3>업그레이드</h3><p class="sub">구매가의 절반. 방문료 +50%, ESG +1. 내 차례에 1곳</p><div class="grid">${list.map(i=>{const b=D.BOARD[i],up=p.own[i].up,can=!up&&p.cash>=b.price/2;return`<button data-u="${i}" class="${up?'done':''}" ${can?'':'disabled'}>${b.name}<small>${up?'완료':fmt(b.price/2)}</small></button>`;}).join('')}</div><div class="foot"><button class="line" id="x">닫기</button></div>`);
  s.querySelector('#x').onclick=()=>s.remove();s.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;p.cash-=D.BOARD[i].price/2;p.own[i].up=true;p.upThisTurn=true;raise(p,i);pop(p,'−'+fmt(D.BOARD[i].price/2),'minus');esgChange(p,1);s.remove();toast(`${D.BOARD[i].name} 업그레이드!`);refreshDock();});}
function refreshDock(){const p=cp();const u=$('#up');if(u&&!canUpgrade(p))u.remove();const ps=$('.players');if(ps)ps.outerHTML=`<div class="players">${G.players.map((q,i)=>`<div class="pl ${i===G.cur?'on':''}" style="--c:${q.col}"><i></i><div><b>${q.name}</b><small><span class="g ${D.GRADES[q.esg]}">${D.GRADES[q.esg]}</span>사업 ${Object.keys(q.own).length}곳${q.jail?' · 점검 중':''}</small></div><div class="cash">${fmt(q.cash)}</div></div>`).join('')}</div>`;}
function esgChange(p,d){const was=p.esg;p.esg=Math.max(0,Math.min(4,p.esg+d));if(p.esg!==was)toast(`${p.name} ESG ${D.GRADES[was]} → ${D.GRADES[p.esg]}`);
  if(p.esg===0&&was>0){p.jail=2;const w=W.tileWorld(22,-1.2+(p.i%2)*2.4,-1.2+Math.floor(p.i/2)*2.4);p.pos=22;p.tok.position.set(w.x,0,w.z);toast(`${p.name}: D 등급! 전력망 점검소로`,2500);}refreshDock();}

/* 뉴스카드 */
function newsCard(p,next){if(!G.news.length)G.news=shuffle(D.NEWS.slice());const c=G.news.pop();
  const s=sheet(`<h3>뉴스카드</h3><p class="sub">소리 내어 읽어요</p><div class="card news"><h4>${c.h}</h4><p>${c.txt}</p><div class="fx">${fxText(c.fx)}</div></div><div class="foot"><button class="go" id="ok">효과 적용</button></div>`);
  s.querySelector('#ok').onclick=()=>{s.remove();applyFx(c.fx,p);refreshDock();if(!G.players.some(q=>checkWin(q)))next();};}
function fxText(fx){return fx.split(';').map(f=>{const [k,a,b]=f.split(':');const v=+(b||a);const s=v>0?'+'+fmt(v):fmt(v);
  if(k==='gen')return`발전 사업마다 ${s}`;if(k==='cat')return`${{E:'환경',S:'사회',G:'지배구조'}[a]}(${a}) 사업마다 ${s}`;if(k==='all')return`모두 ${s}`;if(k==='me')return`뽑은 사람 ${s}`;if(k==='esg')return`뽑은 사람 ESG ${v>0?'+':''}${v}`;if(k==='lowest')return`ESG 최하위 ${s}`;if(k==='own')return`${D.BOARD[a-1].name} 주인 ${s}`;return'';}).join(' · ');}
function applyFx(fx,p){fx.split(';').forEach(f=>{const [k,a,b]=f.split(':');const v=+(b||a);
  const give=(q,amt)=>{if(!amt)return;q.cash=Math.max(0,q.cash+amt);pop(q,(amt>0?'+':'−')+fmt(Math.abs(amt)),amt>0?'plus':'minus');};
  if(k==='gen')G.players.forEach(q=>give(q,v*Object.keys(q.own).filter(i=>D.BOARD[i].gen).length));
  if(k==='cat')G.players.forEach(q=>give(q,v*Object.keys(q.own).filter(i=>D.BOARD[i].cat===a).length));
  if(k==='all')G.players.forEach(q=>give(q,v));if(k==='me')give(p,v);if(k==='esg')esgChange(p,v);
  if(k==='lowest'){const m=Math.min(...G.players.map(q=>q.esg));G.players.filter(q=>q.esg===m).forEach(q=>give(q,v));}
  if(k==='own'){const q=G.players.find(q=>q.own[a-1]);if(q)give(q,v);}});}

/* 행동카드 · 미션 */
function actionCard(p,next){if(!G.acts.length)G.acts=shuffle(D.ACTIONS.slice());const c=G.acts.pop();
  mission(p,c,ok=>{if(ok){p.cash+=20000;pop(p,'+2억','plus');G.players.forEach(q=>esgChange(q,1));toast('성공! 뽑은 사람 2억, 전원 ESG +1',2500);}else toast('아쉬워요. 다음에 다시!');checkWin(p)||next();});}
function mission(p,c,cb){let left=45,iv;
  const s=sheet(c.kind==='quiz'?`<h3>행동카드 · 퀴즈</h3><p class="sub">모둠이 상의해서 45초 안에 고르세요</p><div class="tmr" id="tmr">45</div><div class="card quiz"><h4>${c.q}</h4><div class="qopts">${c.opts.map((o,i)=>`<button data-q="${i}">${o}</button>`).join('')}</div></div>`
   :`<h3>행동카드</h3><p class="sub">모둠 전원이 함께 · 45초 · 강사님이 성공을 확인해요</p><div class="tmr" id="tmr">45</div><div class="card act"><h4>${c.h}</h4><p>${c.txt}</p></div><div class="foot"><button class="danger" id="no">실패</button><button class="go" id="ok">강사님 확인 · 성공!</button></div>`);
  const tick=()=>{left--;const e=s.querySelector('#tmr');if(!e)return;e.textContent=left;e.classList.toggle('low',left<=10);if(left<=0){clearInterval(iv);e.textContent='끝!';}};iv=setInterval(tick,1000);
  const done=ok=>{clearInterval(iv);s.remove();cb(ok);};
  if(c.kind==='quiz'){s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,ok=i===c.a;s.querySelectorAll('[data-q]').forEach((x,j)=>{x.disabled=true;if(j===c.a)x.classList.add('ok');else if(j===i)x.classList.add('no');});setTimeout(()=>done(ok),1200);});}
  else{s.querySelector('#ok').onclick=()=>done(true);s.querySelector('#no').onclick=()=>done(false);}}

/* 턴 끝 · 승리 */
function endTurn(dbl){const p=cp();refreshDock();
  if(G.over)return;
  if(dbl&&!p.jail&&G.doubles<3){toast('더블! 한 번 더');setTimeout(()=>{beginTurn();},700);return;}
  G.cur=(G.cur+1)%G.players.length;setTimeout(beginTurn,500);}
function checkWin(p){if(G.over)return false;if(networth(p)>=D.GOAL){endGame('goal',p);return true;}return false;}
function endGame(why,winner){if(G.over)return;G.over=true;const ps=G.players.slice().sort((a,b)=>networth(b)-networth(a));const w=winner||ps[0];
  document.querySelectorAll('.scrim').forEach(x=>x.remove());
  sheet(`<h3>${why==='goal'?'10억 달성!':'25분 종료'}</h3><p class="sub">${w.name}의 승리 · 현금 + 사업 구매가</p><div class="rank">${ps.map((q,k)=>`<div class="${q===w?'win':''}"><span class="n">${k+1}</span><i style="background:${q.col}"></i>${q.name} <small style="color:var(--ink3)">ESG ${D.GRADES[q.esg]} · 사업 ${Object.keys(q.own).length}곳</small><b>${fmt(networth(q))}</b></div>`).join('')}</div>
   <div class="foot"><button class="go" id="again">처음으로</button></div>`).querySelector('#again').onclick=()=>location.reload();}
title();
})();
</script>
</body></html>
