    if (G.canStand(walk.pos.x, walk.pos.z + dz, feet)) walk.pos.z += dz;
    const floor = G.groundHeight(walk.pos.x, walk.pos.z, walk.pos.y - WALK_CFG.eye) + WALK_CFG.eye;
    walk.pos.y += walk.vy * dt - 7 * dt * dt;
    walk.vy -= WALK_CFG.gravity * dt;
    if (walk.pos.y <= floor) {
      if (walk.vy < -9 && E.onLand) E.onLand(walk.vy);
      walk.pos.y = floor; walk.vy = 0; walk.jumps = 0;
      walk.bob = (forward || right) ? walk.bob + dt * (speed === WALK_CFG.run ? 16 : 10) : 0;
    } else if (walk.jumps === 0 && walk.pos.y > floor + 0.05) {
      walk.jumps = 1;   // 발판에서 걸어 내려가도 공중 재점프 한 번은 남겨 둔다
    }
    if (walk.pos.y < -20) { walk.pos.set(G.LAYOUT.spawn.x, WALK_CFG.eye, G.LAYOUT.spawn.z); walk.vy = 0; }
  }
  function turnToward(dt) {
    if (walk.turnTo === null) return;
    let d = walk.turnTo - walk.yaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    if (Math.abs(d) < 0.01) { walk.yaw = walk.turnTo; walk.turnTo = null; return; }
    walk.yaw += d * Math.min(1, dt * 7);
    walk.pitch *= 1 - Math.min(1, dt * 4);
  }
  function placeWalkCamera() {
    camera.position.copy(walk.pos);
    const bobOffset = walk.bob ? Math.sin(walk.bob) * 0.12 : 0;
    camera.position.y += bobOffset;
    camera.lookAt(walk.pos.x - Math.sin(walk.yaw), walk.pos.y + Math.tan(walk.pitch) + bobOffset, walk.pos.z - Math.cos(walk.yaw));
  }

  /* ═══════════ 미니맵 (걷기 중에도 보이고 매번 갱신) ═══════════ */
  const mini = $('miniMap'), mctx = mini.getContext('2d');
  const MW = 240, MH = 180;
  const mapPoint = (x, z) => [120 + x * 1.4, 90 + z];
  const mapWorld = (mx, my) => [(mx - 120) / 1.4, my - 90];
  let baseLayer = null, lastPaint = 0;
  function paintBase() {
    baseLayer = document.createElement('canvas');
    baseLayer.width = MW; baseLayer.height = MH;
    const ctx = baseLayer.getContext('2d');
    const rect = (x, z, w, d, color) => { const [mx, my] = mapPoint(x - w / 2, z - d / 2); ctx.fillStyle = color; ctx.fillRect(mx, my, w * 1.4, d); };
    ctx.fillStyle = '#54705c'; ctx.fillRect(8, 10, 224, 160);
    rect(0, 38, 160, 14, '#68b8d5');
    G.LAYOUT.roads.forEach(r => rect(r.x, r.z, r.w, r.d, '#253d49'));
    G.buildings.forEach(b => rect(b.x, b.z, b.w, b.d, '#d4cbb4'));
    rect(-8, 38, 4, 18, '#f2d9a0');
    G.mapShapes.forEach(s => rect(s.x, s.z, s.w, s.d, s.color));
    ctx.font = `12px ${G.FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of G.mapLabels) {
      const [mx, my] = mapPoint(l.x, l.z);
      const w = ctx.measureText(l.text).width + 8;
      ctx.fillStyle = 'rgba(18,42,53,.85)'; ctx.fillRect(mx - w / 2, my - 7, w, 14);
      ctx.fillStyle = '#fff3c9'; ctx.fillText(l.text, mx, my + 1);
    }
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText('N ↑', 13, 20);
  }
  function paintMiniMap(now) {
    if (!baseLayer) paintBase();
    mctx.clearRect(0, 0, MW, MH);
    mctx.drawImage(baseLayer, 0, 0);
    // 게임 마커
    const pulse = 1 + Math.sin(now * 0.006) * 0.18;
    for (const m of markers) {
      const [mx, my] = mapPoint(m.x, m.z);
      mctx.fillStyle = m.color; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
      mctx.beginPath(); mctx.arc(mx, my, 7 * (E.near === m ? pulse : 1), 0, Math.PI * 2); mctx.fill(); mctx.stroke();
      mctx.fillStyle = '#10202a'; mctx.font = `bold 10px ${G.FONT}`; mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
      mctx.fillText(m.num, mx, my + 1);
      if (G.store.game(m.id).clears) { mctx.fillStyle = '#ffd23f'; mctx.font = '10px sans-serif'; mctx.fillText('★', mx + 7, my - 7); }
    }
    G.smart?.paintMap?.(mctx, mapPoint, now);
    // 내 위치 (걷기) 또는 조망 중심
    if (E.walking) {
      const [px, py] = mapPoint(walk.pos.x, walk.pos.z);
      const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
      mctx.save(); mctx.translate(px, py); mctx.rotate(Math.atan2(fz, fx * 1.4));
      mctx.fillStyle = '#ffe071'; mctx.strokeStyle = '#17283d'; mctx.lineWidth = 1.5;
      mctx.beginPath(); mctx.moveTo(8, 0); mctx.lineTo(-5, -5); mctx.lineTo(-2, 0); mctx.lineTo(-5, 5); mctx.closePath(); mctx.fill(); mctx.stroke();
      mctx.restore();
    } else {
      const [mx, my] = mapPoint(orbit.target.x, orbit.target.z);
      mctx.strokeStyle = '#ffe071'; mctx.lineWidth = 2;
      mctx.beginPath(); mctx.arc(mx, my, 5, 0, Math.PI * 2); mctx.stroke();
      mctx.fillStyle = '#ffe071'; mctx.beginPath(); mctx.arc(mx, my, 2, 0, Math.PI * 2); mctx.fill();
    }
    lastPaint = now;
  }
  E.repaintMap = () => { baseLayer = null; };
  mini.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = mini.getBoundingClientRect();
    const [x, z] = mapWorld((e.clientX - r.left) / r.width * MW, (e.clientY - r.top) / r.height * MH);
    if (E.walking && E.mode === 'walk') {
      // 걷는 중: 그 장소 쪽으로 몸을 돌린다
      const dx = x - walk.pos.x, dz = z - walk.pos.z;
      if (Math.hypot(dx, dz) > 1) walk.turnTo = walk.yaw + Math.atan2(Math.sin(Math.atan2(-dx, -dz) - walk.yaw), Math.cos(Math.atan2(-dx, -dz) - walk.yaw));
      G.toast('🧭 그쪽을 바라봐요', 1400);
    } else if (E.mode === 'orbit') {
      focusMap({ x: G.clamp(x, -70, 70), y: 2, z: G.clamp(z, -68, 72), dist: 78 }, '선택한 동네 둘러보기');
    }
  });

  /* ═══════════ 미니게임 마커 (바닥 고리 + 빛기둥 + 떠 있는 아이콘) ═══════════ */
  const markers = E.markers = [];
  const ringGeo = new T.RingGeometry(1.15, 1.55, 36).rotateX(-Math.PI / 2);
  const discGeo = new T.CircleGeometry(1.15, 36).rotateX(-Math.PI / 2);
  const beamGeo = new T.CylinderGeometry(0.75, 0.75, 44, 18, 1, true).translate(0, 22, 0);
  function iconTexture(def, cleared) {
    return G.canvasTex(128, 128, (g) => {
      g.fillStyle = def.color; g.beginPath(); g.arc(64, 60, 50, 0, Math.PI * 2); g.fill();
      g.lineWidth = 8; g.strokeStyle = '#ffffff'; g.stroke();
      g.beginPath(); g.moveTo(48, 104); g.lineTo(64, 124); g.lineTo(80, 104); g.fillStyle = '#ffffff'; g.fill();
      g.font = '58px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(def.icon, 64, 64);
      if (cleared) { g.fillStyle = '#ffd23f'; g.font = 'bold 40px sans-serif'; g.fillText('★', 104, 24); }
    });
  }
  E.buildMarkers = () => {
    G.games.forEach((def, i) => {
      const s = def.spot, y = G.groundHeight(s.x, s.z) + 0.04;
      const color = new T.Color(def.color);
      const group = new T.Group(); group.position.set(s.x, y, s.z);
      const disc = new T.Mesh(discGeo, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.28, depthWrite: false }));
      const ring = new T.Mesh(ringGeo, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false }));
      ring.position.y = disc.position.y = 0.06;
      const beam = new T.Mesh(beamGeo, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.13, depthWrite: false, side: T.DoubleSide }));
      const icon = new T.Sprite(new T.SpriteMaterial({ map: iconTexture(def, G.store.game(def.id).clears > 0), depthTest: false, transparent: true }));
      icon.renderOrder = 10;
      const label = G.labelSprite(def.name, { bg: 'rgba(12,24,40,.88)', border: def.color, scale: 0.7, font: 30, depthTest: false });
      label.renderOrder = 10;
      group.add(disc, ring, beam, icon, label);
      G.scene.add(group);
      markers.push({ id: def.id, def, x: s.x, z: s.z, y, r: def.spotRadius || 2.6, color: def.color, num: String(i + 1), group, ring, icon, label, beam });
    });
  };
  E.refreshMarker = id => {
    const m = markers.find(v => v.id === id);
    if (!m) return;
    m.icon.material.map.dispose();
    m.icon.material.map = iconTexture(m.def, G.store.game(id).clears > 0);
    m.icon.material.needsUpdate = true;
  };
  E.setMarkersVisible = v => markers.forEach(m => { m.group.visible = v; });
  const _v = new T.Vector3();
  function updateMarkers(now) {
    const t = now * 0.001;
    for (const m of markers) {
      if (!m.group.visible) continue;
      _v.set(m.x, m.y + 3, m.z);
      const d = camera.position.distanceTo(_v);
      // 바로 옆에 서면 빛기둥·아이콘을 숨긴다 (기둥 안에 갇힌 것처럼 보이지 않게)
      const flat = Math.hypot(camera.position.x - m.x, camera.position.z - m.z);
      const close = E.walking && flat < 3.4;
      m.icon.visible = !close; m.beam.visible = !close;
      const s = G.clamp(d * 0.05, 1.5, 9);
      const lift = G.clamp(d * 0.035, 3, 10);
      m.icon.scale.set(s, s, 1);
      m.icon.position.y = lift + Math.sin(t * 2 + m.x) * 0.25 * s * 0.4;
      m.label.visible = !close && (d < 60 || !E.walking);
      m.label.scale.set(s * 2.4 * 0.62, s * 0.62, 1);
      m.label.position.y = m.icon.position.y - s * 0.72;
      m.ring.scale.setScalar(1 + Math.sin(t * 3) * 0.06);
      m.ring.material.opacity = E.near === m ? 1 : 0.75;
      m.beam.material.opacity = E.walking ? (d < 12 ? 0.05 : 0.13) : 0.2;
    }
  }

  /* ── 가까이 가면 안내 카드 (자동 시작하지 않는다 — E 또는 버튼) ── */
  function checkNear() {
    let near = null;
    if (E.mode === 'walk') {
      const feet = walk.pos.y - WALK_CFG.eye;
      let best = Infinity;
      for (const m of markers) {
        const d = Math.hypot(walk.pos.x - m.x, walk.pos.z - m.z);
        if (d < m.r && Math.abs(feet - m.y) < 2.5 && d < best) { best = d; near = m; }
      }
      // 스마트시티 팻말이 더 가까우면 그쪽에 양보한다 (안내 카드는 한 번에 하나만)
      const sn = G.smart?.near;
      if (near && sn && Math.hypot(walk.pos.x - sn.x, walk.pos.z - sn.z) < best) near = null;
    }
    if (near === E.near) return;
    E.near = near;
    const card = $('prompt');
    if (!near) { card.hidden = true; return; }
    const def = near.def, rec = G.store.game(def.id);
    if (!G.store.data.found[def.id]) { G.store.data.found[def.id] = true; G.store.save(); G.hub.refresh(); }
    $('promptIcon').textContent = def.icon;
    $('promptIcon').style.background = def.color;
    $('promptName').textContent = def.name;
    $('promptDesc').textContent = def.tagline;
    $('promptCtl').textContent = (G.touch ? def.controlsTouch : def.controlsKey) || '';
    $('promptRec').textContent = rec.best !== null ? `최고 기록 ${def.format(rec.best)}${rec.clears ? ' · ★ 성공' : ''}` : '첫 도전!';
    $('promptKey').textContent = G.touch ? '' : 'E';
    card.hidden = false;
    G.sfx.play('ding');
  }
  $('promptStart').addEventListener('click', () => { if (E.near) G.play.start(E.near.id); });

  /* ═══════════ 화면 요소 표시 상태 ═══════════ */
  E.refreshUi = () => {
    const walking = E.walking, inGame = E.mode === 'game';
    $('crosshair').hidden = !walking || (inGame && !E.walkGame);
    const touchWalk = walking && G.touch && (!inGame || E.walkGame);
    $('jumpBtn').hidden = !touchWalk;
    if (!touchWalk) joyEnd();
    if (walking) E.near = undefined; else { E.near = null; $('prompt').hidden = true; }
    if (!walking) G.smart?.clear?.();
  };

  /* ═══════════ 게임 시작/종료 때 탐험 상태 보관·복원 ═══════════ */
  E.suspend = () => {
    const snap = {
      mode: E.mode, walking: E.walking,
      pos: walk.pos.clone(), yaw: walk.yaw, pitch: walk.pitch,
      orbit: { theta: orbit.theta, phi: orbit.phi, dist: orbit.dist, target: orbit.target.clone() },
    };
    E.mode = 'game';
    clearMovement(); stopCameraTrip();
    walk.vy = 0;
    E.near = null; $('prompt').hidden = true;
    G.smart?.clear?.();
    if (document.pointerLockElement === canvas) document.exitPointerLock();
    document.body.classList.add('in-game');
    E.refreshUi();
    return snap;
  };
  E.resume = (snap, { blend: doBlend = true } = {}) => {
    E.walkGame = false;
    walk.pos.copy(snap.pos); walk.yaw = snap.yaw; walk.pitch = snap.pitch; walk.vy = 0; walk.jumps = 0; walk.turnTo = null;
    orbit.theta = snap.orbit.theta; orbit.phi = snap.orbit.phi; orbit.dist = snap.orbit.dist; orbit.target.copy(snap.orbit.target);
    clearMovement();
    document.body.classList.remove('in-game');
    E.mode = snap.walking ? 'walk' : 'orbit';
    E.walking = snap.walking;
    if (snap.walking) {
      document.body.classList.add('walking'); canvas.classList.add('walking');
      $('walkBtn').textContent = '🌐 조망';
    } else {
      document.body.classList.remove('walking'); canvas.classList.remove('walking');
      $('walkBtn').textContent = '🚶 걷기';
    }
    if (doBlend) E.startBlend(0.7); else blend.on = false;
    E.refreshUi();
  };

  /* ═══════════ 버튼 ═══════════ */
  $('walkBtn').addEventListener('click', () => (E.walking ? exitWalk() : enterWalk()));
  $('mapBig').addEventListener('click', () => setMapExpanded(!mapExpanded));
  $('zoomIn').addEventListener('click', () => zoomMap(0.8));
  $('zoomOut').addEventListener('click', () => zoomMap(1.25));
  $('resetView').addEventListener('click', () => focusMap(HOME_VIEW));
  const placeBox = $('mapPlaces');
  Object.entries(G.PLACES).forEach(([key, p]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = `${p.icon} ${p.name}`; b.setAttribute('aria-label', p.label + ' 보기');
    b.addEventListener('click', () => focusMap(p, p.label));
    placeBox.appendChild(b);
  });

  /* ═══════════ 첫 화면: 도시 위를 천천히 도는 카메라 ═══════════ */
  E.begin = () => {
    E.mode = 'orbit';
    introAt = 0;
    orbit.theta = HOME_VIEW.theta; orbit.phi = HOME_VIEW.phi; orbit.dist = HOME_VIEW.dist; orbit.target.set(0, 3, 0);
    E.startBlend(0.8);
    enterWalk({ noBlend: false });
  };

  /* ═══════════ 프레임 갱신 ═══════════ */
  E.update = (dt, now) => {
    if (E.mode === 'title') {
      orbit.theta += dt * 0.05;
      applyOrbit();
    } else if (E.walking && (E.mode === 'walk' || E.walkGame)) {
      stepWalk(dt);
      turnToward(dt);
      placeWalkCamera();
      if (E.mode === 'walk') checkNear();
    } else if (E.mode === 'orbit') {
      updateCameraTrip(now);
      applyOrbit();
    }
    if (E.mode !== 'game' || E.walkGame) applyBlend(now);
    updateMarkers(now);
    if (E.mode !== 'title' && (!document.body.classList.contains('in-game') || E.walkGame) && now - lastPaint > (E.walking ? 66 : 33)) paintMiniMap(now);
  };
  E.applyBlend = applyBlend;
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   hub.js — 미니게임 등록·진행·결과·기록 + 미니게임 수첩(허브) 화면
   · 새 게임은 js/games/ 에 파일 하나 만들고 G.registerGame({...})만 부르면
     마커·미니맵·허브·기록·일시정지·결과 화면이 자동으로 붙는다.
   · 게임 파일이 채우는 항목은 아래 registerGame 주석 참고.
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const $ = G.$, E = () => G.explore;

  /* ═══════════ 게임 등록 ═══════════
     필수: id, name, icon, color, tagline, rules[], controlsKey, controlsTouch,
           format(v)  기록 표시, better(a,b)  a가 b보다 좋은 기록인가
           world: 'city'(도시 씬에서 진행) | 'own'(자기 씬: scene·camera 제공)
           init(ctx) 처음 한 번, enter(ctx) 장소 준비, start(ctx) 새 판, update(dt,now,ctx),
           exit(ctx) 정리, onKey(e,down,ctx)
     선택: walkGame(걷기 조작 사용), spotRadius, onBlur(ctx) */
  /* ═══════════ 마을 점수 (모든 게임을 한 자로 재는 공통 점수) ═══════════
     게임마다 눈금이 달라서(점수·초·미터) 그냥 더할 수 없다.
     그래서 각 게임이 결과에 progress(0~1, 얼마나 해냈나)를 함께 넘기고,
     여기서 게임별 만점(maxPts)을 곱해 같은 단위로 바꾼다.
     못 깨도 progress 만큼은 점수가 남는다 — 0점이 되지 않게. */
  const DEFAULT_MAX_PTS = 1000;
  G.gamePoints = (def, r) => {
    const prog = G.clamp(Number(r?.progress ?? (r?.success ? 1 : 0)) || 0, 0, 1);
    return Math.round((def.maxPts || DEFAULT_MAX_PTS) * prog);
  };
  /** 모든 게임의 최고 마을 점수 합계 */
  G.totalPoints = () => G.games.reduce((a, g) => a + (G.store.game(g.id).pts || 0), 0);
  G.maxPoints = () => G.games.reduce((a, g) => a + (g.maxPts || DEFAULT_MAX_PTS), 0);
  G.paintTotal = () => {
    const el = $('totalScore');
    if (el) el.textContent = `${G.totalPoints().toLocaleString('ko-KR')}점`;
  };

  G.games = [];
  G.registerGame = def => {
    def.spot = def.spot || G.SPOTS[def.id];
    def.better = def.better || ((a, b) => a > b);
    def.format = def.format || (v => String(v));
    G.games.push(def);
  };
  const gameById = id => G.games.find(g => g.id === id);

  /* ═══════════ 게임 화면 공통 도구 (ctx) ═══════════ */
  const statBox = $('hudStats');
  let statCache = [];
  const ctx = {
    G,
    layer: $('gameLayer'),
    /** 상단 점수판. [{label, value, warn}] — 바뀐 칸만 다시 쓴다 */
    setStats(list) {
      if (statCache.length !== list.length) {
        statBox.innerHTML = '';
        statCache = list.map(() => {
          const el = document.createElement('div'); el.className = 'stat';
          el.innerHTML = '<span class="l"></span><b class="v"></b>';
          statBox.appendChild(el);
          return { el, l: el.firstChild, v: el.lastChild, label: null, value: null, warn: null };
        });
      }
      list.forEach((s, i) => {
        const c = statCache[i];
        if (c.label !== s.label) { c.l.textContent = s.label; c.label = s.label; }
        const v = String(s.value);
        if (c.value !== v) { c.v.textContent = v; c.value = v; }
        const w = !!s.warn;
        if (c.warn !== w) { c.el.classList.toggle('warn', w); c.warn = w; }
      });
    },
    /** 화면 가운데 큰 글자 */
    flash(text, cls = '', ms = 900) {
      const f = $('hudFlash');
      f.textContent = text;
      f.className = 'show ' + cls;
      clearTimeout(ctx._flashT);
      ctx._flashT = setTimeout(() => { f.className = ''; }, ms);
    },
    /** 아래쪽 한 줄 안내 */
    hint(text) { $('hudHint').textContent = text || ''; $('hudHint').hidden = !text; },
    finish(result) { G.play.finish(result); },
    /** 점수판은 1초에 10번만 새로 쓴다 (매 프레임 객체를 만들지 않도록) */
    hudDue(dt) { ctx._hudT = (ctx._hudT || 0) - dt; if (ctx._hudT > 0) return false; ctx._hudT = 0.1; return true; },
    /** 도시 씬 게임용: 카메라를 목표 위치로 부드럽게 옮긴다 */
    easeCamera(pos, look, dt, speed = 4) {
      const cam = G.camera, k = 1 - Math.exp(-speed * dt);
      cam.position.lerp(pos, k);
      ctx._look = ctx._look || new THREE.Vector3();
      if (!ctx._lookInit) { ctx._look.copy(look); ctx._lookInit = true; }
      ctx._look.lerp(look, k);
      cam.lookAt(ctx._look);
    },
    snapCamera(pos, look) {
      G.camera.position.copy(pos);
      ctx._look = ctx._look || new THREE.Vector3();
      ctx._look.copy(look); ctx._lookInit = true;
      G.camera.lookAt(look);
    },
    touch: G.touch,
  };
  G.ctx = ctx;

  /* ═══════════ 진행 상태 기계: idle → intro → play ⇄ paused → over ═══════════ */
  const P = G.play = {
    current: null, state: 'idle', snap: null, pausedAt: 0,
    start(id) {
      const def = gameById(id);
      if (!def || P.current) return;
      G.hub.close(true);
      G.sfx.unlock(); G.sfx.play('click');
      P.snap = E().suspend();
      $('toasts').innerHTML = '';
      P.current = def;
      G.store.data.found[id] = true;
      if (!def._inited) { def.init(ctx); def._inited = true; }
      ctx._lookInit = false;
      document.body.classList.add('game-' + def.id);
      $('gameHud').hidden = false;
      $('hudTitle').textContent = `${def.icon} ${def.name}`;
      ctx.setStats([]); ctx.hint('');
      const go = () => {
        if (def.walkGame) { const ex = E(); ex.walkGame = true; ex.walking = true; G.renderer.domElement.classList.add('walking'); ex.refreshUi(); }
        def.enter(ctx);
        P.showIntro();
      };
      if (def.world === 'own') fade(go); else go();
    },
    showIntro() {
      const def = P.current;
      P.state = 'intro';
      $('introIcon').textContent = def.icon;
      $('introIcon').style.background = def.color;
      $('introName').textContent = def.name;
      const rec = G.store.game(def.id);
      $('introRec').textContent = rec.best !== null ? `내 최고 기록: ${def.format(rec.best)}` : '첫 도전이에요!';
      $('introGo').textContent = G.touch ? '▶ 시작' : '▶ 시작 (Space)';
      $('intro').hidden = false;
      setTimeout(() => $('introGo').focus({ preventScroll: true }), 30);
    },
    go() {
      if (P.state !== 'intro' && P.state !== 'over' && P.state !== 'paused') return;
      $('intro').hidden = true; $('result').hidden = true; $('pause').hidden = true;
      document.activeElement?.blur?.();
      P.state = 'play';
      G.store.game(P.current.id).plays++;
      P.current.start(ctx);
    },
    update(dt, now) {
      if (P.current && (P.state === 'play' || (P.current.idleUpdate && P.state !== 'paused'))) P.current.update(dt, now, ctx, P.state);
    },
    pause() {
      if (P.state !== 'play') return;
      P.state = 'paused'; P.pausedAt = performance.now();
      P.current.onBlur?.(ctx);
      E().clearMovement();
      $('pause').hidden = false;
      setTimeout(() => $('pauseResume').focus({ preventScroll: true }), 30);
    },
    resume() {
      if (P.state !== 'paused') return;
      $('pause').hidden = true;
      document.activeElement?.blur?.();
      P.state = 'play';
    },
    finish(r) {
      if (P.state !== 'play') return;
      const def = P.current;
      P.state = 'over';
      def.onBlur?.(ctx);
      E().clearMovement();
      if (document.pointerLockElement) document.exitPointerLock();
      G.store.load();   // 다른 탭에서 남긴 기록을 먼저 읽고 그 위에 더한다 (서로 덮어쓰지 않게)
      G.store.data.found[def.id] = true;
      const rec = G.store.game(def.id);
      const score = r.record;
      let isNew = false;
      if (score !== undefined && score !== null && (r.success || def.recordOnFail !== false)) {
        if (rec.best === null || def.better(score, rec.best)) { rec.best = score; isNew = true; }
      }
      // 마을 점수 — 못 깼어도 진행한 만큼 남는다 (최고 기록만 갱신)
      const gained = G.gamePoints(def, r);
      const ptsBefore = rec.pts || 0;
      if (gained > ptsBefore) rec.pts = gained;
      const allBefore = G.games.every(g => G.store.game(g.id).clears > 0);
      if (r.success) rec.clears++;
      G.store.save();
      G.paintTotal();
      if (r.success && !allBefore && G.games.every(g => G.store.game(g.id).clears > 0)) {
        r.lines = [...(r.lines || []), `🏆 <b>놀이도시 정복!</b> 미니게임 ${G.games.length}개를 모두 성공했어요!`];
      }
      if (r.success) E().refreshMarker(def.id);
      G.hub.refresh();
      G.sfx.play(r.success ? 'win' : 'lose');
      $('resIcon').textContent = def.icon;
      $('resIcon').style.background = def.color;
      $('resTitle').textContent = r.title || (r.success ? '성공!' : '아쉬워요!');
      $('resTitle').className = r.success ? 'good' : 'bad';
      $('resBig').textContent = r.big ?? '';
      $('resLines').innerHTML = (r.lines || []).map(l => `<li>${l}</li>`).join('');
      $('resBest').textContent = rec.best !== null ? `최고 기록 ${def.format(rec.best)}` : '';
      $('resPts').textContent =
        `🏆 마을 점수 +${gained.toLocaleString('ko-KR')}`
        + (gained > ptsBefore ? ` (이 게임 최고 기록 경신)` : ` · 이 게임 최고 ${ptsBefore.toLocaleString('ko-KR')}`)
        + `   ·   총점 ${G.totalPoints().toLocaleString('ko-KR')} / ${G.maxPoints().toLocaleString('ko-KR')}`;
      $('resNew').hidden = !isNew;
      setTimeout(() => {
        if (P.state !== 'over') return;
        $('result').hidden = false;
        $('resRetry').focus({ preventScroll: true });
      }, r.delay ?? 700);
    },
    retry() {
      if (!P.current || (P.state !== 'over' && P.state !== 'paused')) return;   // 키·클릭이 겹쳐 두 번 불려도 한 번만
      $('result').hidden = true; $('pause').hidden = true;
      P.state = 'over';
      P.go();
    },
    exit(then) {
      const def = P.current;
      if (!def) return;
      $('intro').hidden = $('result').hidden = $('pause').hidden = true;
      $('gameHud').hidden = true;
      $('hudFlash').className = '';
      ctx.hint('');
      const done = () => {
        def.exit(ctx);
        document.body.classList.remove('game-' + def.id);
        P.current = null; P.state = 'idle';
        E().resume(P.snap, { blend: def.world !== 'own' });
        P.snap = null;
        G.hub.refresh();
        if (then) then();
      };
      if (def.world === 'own') fade(done); else done();
    },
    onKey(e, down) {
      const def = P.current, code = e.code;
      if (!down) { if (P.state === 'play') (def.walkGame ? E().onKey(e, false) : def.onKey(e, false, ctx)); return; }
      if (P.state === 'intro') {
        if (code === 'Space' || code === 'Enter') { e.preventDefault(); P.go(); }
        else if (code === 'Escape') P.exit();
        return;
      }
      if (P.state === 'over') {
        if (!$('result').hidden) {
          if (code === 'KeyR' || code === 'Enter' || code === 'Space') { e.preventDefault(); P.retry(); }
          else if (code === 'Escape') P.exit();
          else if (code === 'Tab') { e.preventDefault(); P.exit(() => G.hub.open()); }
        }
        return;
      }
      if (P.state === 'paused') {
        if (code === 'Escape' && performance.now() - P.pausedAt > 350) P.resume();
        else if (code === 'Enter' || code === 'Space') { e.preventDefault(); P.resume(); }
        else if (code === 'KeyR') P.retry();
        else if (code === 'KeyQ') P.exit();
        return;
      }
      if (P.state === 'play') {
        if (code === 'Escape' || code === 'KeyP') { P.pause(); return; }
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(code)) e.preventDefault();
        if (def.walkGame && E().onKey(e, true)) return;
        def.onKey(e, true, ctx);
      }
    },
  };

  /* 검은 화면 전환 (자기 씬을 쓰는 게임) */
  function fade(mid) {
    const f = $('fade');
    if (G.reduceMotion) { mid(); return; }
    f.classList.add('on');
    setTimeout(() => { mid(); requestAnimationFrame(() => f.classList.remove('on')); }, 230);
  }

  $('introGo').addEventListener('click', () => P.go());
  $('introBack').addEventListener('click', () => P.exit());
  $('resRetry').addEventListener('click', () => P.retry());
  $('resHub').addEventListener('click', () => P.exit(() => G.hub.open()));
  $('resExit').addEventListener('click', () => P.exit());
  $('pauseResume').addEventListener('click', () => P.resume());
  $('pauseRetry').addEventListener('click', () => P.retry());
  $('pauseExit').addEventListener('click', () => P.exit());
  $('hudPause').addEventListener('click', () => (P.state === 'paused' ? P.resume() : P.pause()));
  addEventListener('blur', () => P.pause());
  document.addEventListener('visibilitychange', () => { if (document.hidden) P.pause(); });

  /* ═══════════ 미니게임 수첩 (허브) ═══════════ */
  let prevMode = null;
  const H = G.hub = {
    isOpen: false,
    open() {
      if (H.isOpen || P.current) return;
      const ex = E();
      prevMode = ex.mode;
      if (ex.mode === 'title') return;
      ex.clearMovement();
      ex.mode = 'menu';
      if (document.pointerLockElement) document.exitPointerLock();
      H.refresh();
      $('hub').hidden = false; H.isOpen = true;
      G.sfx.play('click');
      setTimeout(() => $('hubClose').focus({ preventScroll: true }), 30);
    },
    close(silent) {
      if (!H.isOpen) return;
      $('hub').hidden = true; H.isOpen = false;
      const ex = E();
      if (!silent || ex.mode === 'menu') {
        ex.mode = prevMode === 'walk' ? 'walk' : 'orbit';
      }
      document.activeElement?.blur?.();
    },
    refresh() {
      const total = G.games.length, cleared = G.games.filter(g => G.store.game(g.id).clears > 0).length;
      $('hubBtnCount').textContent = `★ ${cleared}/${total}`;
      $('hubProgress').textContent = `성공한 게임 ★ ${cleared} / ${total}`;
      if (!H.isOpen && !$('hub').hidden === false) { /* 닫혀 있으면 목록은 열 때 다시 그린다 */ }
      const list = $('hubList');
      list.innerHTML = '';
      G.games.forEach((def, i) => {
        const rec = G.store.game(def.id), found = !!G.store.data.found[def.id];
        const card = document.createElement('article');
        card.className = 'gcard' + (rec.clears ? ' cleared' : '') + (found ? '' : ' locked');
        card.innerHTML = `
          <div class="gtop"><span class="gicon" style="background:${def.color}">${def.icon}</span>
            <div><h3>${i + 1}. ${G.esc(def.name)}</h3><p class="gplace">📍 ${G.esc(def.place)}</p></div>
            <span class="gstate">${rec.clears ? '★ 성공' : found ? '발견' : '미발견'}</span></div>
          <p class="gtag">${G.esc(def.tagline)}</p>
          <p class="grec">${rec.best !== null ? `최고 기록 <b>${G.esc(def.format(rec.best))}</b> · ${rec.plays}판` : found ? '아직 기록이 없어요' : '도시에서 마커를 찾아가 E를 누르면 열려요'}</p>
          <div class="gbtns"><button type="button" class="ghostBtn" data-act="where">📍 위치 보기</button>
            <button type="button" class="playBtn" data-act="play" ${found ? '' : 'disabled'}>${rec.plays ? '▶ 다시 하기' : '▶ 하기'}</button></div>`;
        card.querySelector('[data-act="where"]').addEventListener('click', () => {
          H.close(true);
          const ex = E();
          ex.mode = 'orbit';
          if (ex.walking) ex.exitWalk({ keepOrbit: true });
          ex.focusMap({ x: def.spot.x, y: 2, z: def.spot.z, dist: 52 }, `${def.icon} ${def.name} — ${def.place}`);
        });
        card.querySelector('[data-act="play"]').addEventListener('click', () => { if (found) P.start(def.id); });
        list.appendChild(card);
      });
    },
  };
  $('hubBtn').addEventListener('click', () => (H.isOpen ? H.close() : H.open()));
  $('hubClose').addEventListener('click', () => H.close());
  $('hubReset').addEventListener('click', () => {
    if (!confirm('모든 미니게임 기록과 발견 표시를 지울까요?')) return;
    G.store.data.games = {}; G.store.data.found = {}; G.store.save();
    G.games.forEach(g => E().refreshMarker(g.id));
    H.refresh();
  });
  const soundBtn = $('soundBtn');
  const paintSound = () => { soundBtn.textContent = G.sfx.muted ? '🔇' : '🔊'; soundBtn.setAttribute('aria-label', G.sfx.muted ? '소리 켜기' : '소리 끄기'); };
  soundBtn.addEventListener('click', () => { G.sfx.setMuted(!G.sfx.muted); paintSound(); G.sfx.play('click'); });
  paintSound();

  /* ═══════════ 키보드 한 곳에서 나눠 준다: 게임 / 허브 / 탐험 ═══════════ */
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (e.isComposing) return;
    G.sfx.unlock();
    if (P.current) { P.onKey(e, true); return; }
    if (H.isOpen) {
      if (e.code === 'Escape' || e.code === 'Tab') { e.preventDefault(); H.close(); }
      return;
    }
    const ex = E();
    if (ex.mode === 'title') {
      if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); G.main.begin(); }
      return;
    }
    if (e.code === 'Tab') { e.preventDefault(); H.open(); return; }
    ex.onKey(e, true);
  });
  addEventListener('keyup', e => {
    if (P.current) P.onKey(e, false);
    E().onKey(e, false);
  });
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   smartcity.js — 도시 곳곳의 「스마트시티 팻말」 5개

   게임이 아니다. 걸어가서 읽기만 하면 된다.
   팻말 하나 = 아래 SIGNS 배열의 덩이 하나. 덩이를 더하거나 빼면
   구조물·팻말·미니맵 표시·진행 칩(0/5)이 전부 따라온다.

   각 덩이가 채우는 것
     id      기록 저장 키 (바꾸면 예전 「읽음」 기록과 끊긴다)
     name    팻말 제목 · icon 이모지 · color 강조색
     place   어디에 있는지 한 줄
     sign    {x, z, yaw}  팻말이 설 자리. yaw 는 팻말이 바라보는 쪽(라디안)
     lead    패널 맨 위 한 줄 설명
     data    모으는 데이터 · issue 푸는 문제 · how 하는 일 (두 줄)
     build() 그 자리에 세울 구조물 (없어도 된다)

   자리를 옮기거나 새로 잡을 때는 반드시  node tests/probe.mjs  로
   그 땅이 비어 있는지 먼저 확인한다. 겹침은 화면에서 잘 안 보인다.
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE, scene = G.scene, city = G.cityBatch, $ = G.$;

  /* ═══════════ 팻말 5개 ═══════════ */
  const SIGNS = G.SMART_SIGNS = [
    {
      id: 'sc-cross', name: '스마트 횡단보도', icon: '🚸', color: '#FFD23F',
      place: '학교 앞 횡단보도',
      sign: { x: 29.5, z: 50.3, yaw: Math.PI * 0.25 },
      lead: '길을 건너는 사람을 알아보고 신호를 맞춰 준다.',
      data: '보행자 감지 — 횡단보도 위에 사람이 있는지',
      issue: '보행자 사고. 특히 어린이·어르신은 초록불 안에 다 못 건널 때가 있다',
      how: ['아직 건너는 사람이 있으면 초록불을 조금 더 준다',
        '차가 다가오면 바닥 조명이 켜져 운전자에게 알린다'],
      build: () => {
        // 감지 센서 기둥 두 개 (횡단보도 양쪽) + 바닥 LED 띠
        for (const [sx, sz] of [[28.2, 57.6], [43.8, 50.0]]) {
          city.add(0.16, 2.8, 0.16, sx, 1.4, sz, 0x5d6670);
          const eye = G.box(0.42, 0.3, 0.34, 0x1e2a36); eye.position.set(sx, 2.95, sz); scene.add(eye);
          const lens = new T.Mesh(G.boxGeo(0.16, 0.16, 0.05), new T.MeshBasicMaterial({ color: 0x5AC8FA, transparent: true }));
          lens.position.set(sx, 2.95, sz + (sz < 54 ? 0.19 : -0.19)); scene.add(lens);
          G.blockArea(sx, sz, 0.3, 0.3);
          blink.push(lens.material);
        }
        // 횡단보도 가장자리 조명 띠
        for (const lz of [49.9, 57.3]) city.add(16, 0.03, 0.18, 36, 0.2, lz, 0xffe9a8);
      },
    },
    {
      id: 'sc-flood', name: '침수 예측 시스템', icon: '🌊', color: '#5AC8FA',
      place: '다리 북쪽 강가',
      sign: { x: -3.8, z: 28.6, yaw: Math.PI * 0.12 },
      lead: '비가 얼마나 왔는지, 강물이 얼마나 찼는지 계속 잰다.',
      data: '강수량과 하천 수위 — 시간마다 얼마나 올랐는지',
      issue: '집중호우로 하천이 넘치는 것. 물은 순식간에 불어난다',
      how: ['물이 빠르게 오르면 넘치기 전에 미리 알린다',
        '위험해지면 강변길과 다리 아래를 먼저 막는다'],
      build: () => {
        // 강 안 수위 관측 기둥 (빨강·흰색 눈금 + 꼭대기 경보등)
        const px = -2.6, pz = 33.5;
        for (let i = 0; i < 8; i++) city.add(0.26, 0.5, 0.26, px, 0.25 + i * 0.5, pz, i % 2 ? 0xf4f1e6 : 0xd8493c);
        const lampBase = G.box(0.4, 0.28, 0.4, 0x2b3138); lampBase.position.set(px, 4.3, pz); scene.add(lampBase);
        const lamp = new T.Mesh(G.boxGeo(0.26, 0.26, 0.26), new T.MeshBasicMaterial({ color: 0xFF7A70, transparent: true }));
        lamp.position.set(px, 4.58, pz); scene.add(lamp);
        blink.push(lamp.material);
        // 강가 계측함 + 빗물받이
        city.add(0.9, 1.1, 0.7, -5.6, 0.55, 29.8, 0xcfd8de).add(1.0, 0.12, 0.8, -5.6, 1.16, 29.8, 0x8d97a0);
        G.blockArea(-5.6, 29.8, 0.9, 0.7);
        city.add(0.5, 0.06, 0.5, -2.0, 0.04, 29.2, 0x6f7b85);
      },
    },
    {
      id: 'sc-bin', name: '스마트 쓰레기통', icon: '🗑️', color: '#3ED47E',
      place: '하늘언덕 공원 놀이터',
      sign: { x: 2.0, z: -36.6, yaw: Math.PI * 1.0 },
      lead: '통이 얼마나 찼는지 스스로 알리는 쓰레기통.',
      data: '쓰레기 적재량 — 지금 몇 퍼센트 찼는지',
      issue: '넘치는 쓰레기. 비어 있는 통까지 수거차가 매일 도는 낭비',
      how: ['가득 찬 통만 골라서 수거한다',
        '헛걸음이 줄어 수거차가 덜 다니고 매연도 줄어든다'],
      build: () => {
        // 적재량 표시등이 달린 쓰레기통 세 개
        [[-0.4, -36.6, 0x3ED47E], [1.9, -41.4, 0xFFD23F], [4.4, -36.6, 0xFF7A70]].forEach(([bx, bz, c]) => {
          city.add(0.62, 0.95, 0.62, bx, 0.48, bz, 0x2f5d46).add(0.7, 0.1, 0.7, bx, 1.0, bz, 0x24493a);
          const led = new T.Mesh(G.boxGeo(0.3, 0.09, 0.04), new T.MeshBasicMaterial({ color: c }));
          led.position.set(bx, 0.82, bz + 0.32); scene.add(led);
          G.blockArea(bx, bz, 0.7, 0.7);
        });
      },
    },
    {
      id: 'sc-park', name: '스마트 주차장', icon: '🅿️', color: '#5AC8FA',
      place: '놀이초등학교 서쪽',
      sign: { x: 20.4, z: 67.6, yaw: Math.PI * 1.15 },
      lead: '칸마다 센서가 있어 빈자리를 바로 알려 준다.',
      data: '주차 칸 센서 — 칸마다 차가 있는지 없는지',
      issue: '빈자리를 찾느라 주차장을 빙빙 도는 것. 그만큼 시간과 기름이 든다',
      how: ['입구 전광판에 남은 자리 수가 바로 뜬다',
        '어느 줄이 비었는지 알려 주니 헤매지 않는다'],
      build: () => {
        const cx = 17, cz = 72, W = 7.5, D = 10;
        city.add(W, 0.08, D, cx, 0.04, cz, 0x4a5058);                       // 아스팔트
        for (let i = 0; i <= 4; i++) city.add(3.2, 0.02, 0.12, cx - 1.9, 0.09, cz - D / 2 + 1 + i * 2, 0xf2efe4);
        city.add(0.12, 0.02, D - 1.4, cx + 0.2, 0.09, cz, 0xf2efe4);
        // 주차된 차 두 대 + 빈 칸 센서 점
        [[cx - 1.9, cz - 3.5, 0xe8533f], [cx - 1.9, cz + 0.5, 0xf2f2f2]].forEach(([carX, carZ, c]) => {
          city.add(2.6, 0.75, 1.5, carX, 0.45, carZ, c).add(1.5, 0.45, 1.4, carX, 1.05, carZ, 0x2b3138);
          G.blockArea(carX, carZ, 2.6, 1.5);
        });
        [[cx - 1.9, cz + 4.5], [cx - 1.9, cz + 2.5], [cx - 1.9, cz - 1.5]].forEach(([dx, dz]) => {
          const dot = new T.Mesh(G.boxGeo(0.2, 0.02, 0.2), new T.MeshBasicMaterial({ color: 0x3ED47E }));
          dot.position.set(dx, 0.1, dz); scene.add(dot);
        });
        // 입구 전광판
        const tex = G.canvasTex(256, 128, g => {
          g.fillStyle = '#0b1a26'; g.fillRect(0, 0, 256, 128);
          g.fillStyle = '#5AC8FA'; g.font = `26px ${G.FONT}`; g.textAlign = 'center';
          g.fillText('남은 자리', 128, 42);
          g.fillStyle = '#3ED47E'; g.font = `bold 58px ${G.FONT}`; g.fillText('3', 128, 100);
        });
        const board = G.signBox(1.5, 0.85, 0.1, tex, 0x2b3138);
        board.rotation.y = Math.PI * 1.15; board.position.set(20.9, 2.5, 69.6); scene.add(board);
        city.add(0.14, 2.1, 0.14, 20.9, 1.05, 69.6, 0x5d6670);
        G.blockArea(20.9, 69.6, 0.3, 0.3);
        G.mapShapes.push({ x: cx, z: cz, w: W, d: D, color: '#6b737c' });
      },
    },
    {
      id: 'sc-station', name: '스마트 기차역', icon: '🚉', color: '#FF9F4A',
      place: '모노레일 선로 옆 승강장',
      sign: { x: -18.4, z: 17.6, yaw: Math.PI * 0.05 },
      lead: '시간마다 몇 명이 타고 내리는지 세어 열차를 조절한다.',
      data: '시간대별 승하차 인원 — 어느 때 가장 붐비는지',
      issue: '출퇴근 시간에 너무 붐비는 것. 어떤 칸만 유독 꽉 찬다',
      how: ['붐빌 시간을 미리 내다보고 열차를 늘린다',
        '승강장 전광판에 칸마다 얼마나 찼는지 보여 준다'],
      build: () => {
        const px = -18.4, pz = 22, W = 3.4, D = 8;
        city.add(W, 0.35, D, px, 0.175, pz, 0xd8d2c4);                        // 승강장
        for (let z = pz - D / 2 + 0.4; z < pz + D / 2; z += 0.8) city.add(W - 0.3, 0.02, 0.1, px, 0.36, z, 0xc4bdad);
        city.add(0.12, 0.02, D, px + W / 2 - 0.15, 0.36, pz, 0xffd23f);       // 안전선
        G.platforms.push({ x: px, z: pz, w: W, d: D, top: 0.35, bottom: 0, name: 'station' });
        // 지붕
        for (const [qx, qz] of [[px - 1.3, pz - 3], [px + 1.3, pz - 3], [px - 1.3, pz + 3], [px + 1.3, pz + 3]]) {
          city.add(0.14, 2.8, 0.14, qx, 1.75, qz, 0x8d97a0);
          G.blockArea(qx, qz, 0.2, 0.2);
        }
        city.add(W + 0.6, 0.18, D - 0.6, px, 3.24, pz, 0xbfd9e6);
        // 벤치
        city.add(1.6, 0.1, 0.5, px - 0.8, 0.75, pz + 1.2, 0x966b47).add(0.12, 0.4, 0.5, px - 1.5, 0.55, pz + 1.2, 0x7a5230);
        // 혼잡도 전광판
        const tex = G.canvasTex(256, 128, g => {
          g.fillStyle = '#0b1a26'; g.fillRect(0, 0, 256, 128);
          g.fillStyle = '#EDF4FF'; g.font = `22px ${G.FONT}`; g.textAlign = 'center';
          g.fillText('칸별 혼잡도', 128, 32);
          [['#3ED47E', 36], ['#FFD23F', 100], ['#FF7A70', 164], ['#3ED47E', 228]].forEach(([c, x], i) => {
            g.fillStyle = c; g.fillRect(x - 24, 52, 48, 40);
            g.fillStyle = '#0b1a26'; g.font = `bold 20px ${G.FONT}`; g.fillText(String(i + 1), x, 80);
          });
        });
        const board = G.signBox(2.0, 1.0, 0.1, tex, 0x2b3138);
        board.rotation.y = Math.PI * 1.05; board.position.set(px, 2.5, pz + 3.6); scene.add(board);
        G.mapShapes.push({ x: px, z: pz, w: W, d: D, color: '#cfd8de' });
        G.mapLabels.push({ text: '기차역', x: px, z: pz + 6.5 });
      },
    },
  ];

  const byId = id => SIGNS.find(s => s.id === id);
  const readSet = () => (G.store.data.smart || (G.store.data.smart = {}));
  const isRead = id => !!readSet()[id];
  const readCount = () => SIGNS.filter(s => isRead(s.id)).length;

  /* ═══════════ 팻말 만들기 ═══════════ */
  const blink = [];          // 깜빡이는 표시등 재질
  const posts = [];          // {def, x, z, y, group, icon, stamp, ring}

  /** 팻말 판에 그릴 그림 — 제목 띠 + 「모으는 데이터」 + 「푸는 문제」 두 줄 */
  function boardTex(def) {
    return G.canvasTex(640, 400, (g) => {
      g.fillStyle = '#0E2233'; g.fillRect(0, 0, 640, 400);
      g.strokeStyle = def.color; g.lineWidth = 10; g.strokeRect(5, 5, 630, 390);
      // 제목 띠
      g.fillStyle = def.color; g.fillRect(10, 10, 620, 96);
      g.fillStyle = '#10202a'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `bold 50px ${G.FONT}`;
      g.fillText(`${def.icon} ${def.name}`, 320, 60);
      // 본문 두 줄 — 꼬리표 폭은 글자를 재서 정한다 (고정 폭으로 뒀더니 잘렸다)
      const row = (y, chip, chipColor, text) => {
        g.font = `bold 24px ${G.FONT}`;
        const cw = g.measureText(chip).width + 26;
        g.fillStyle = chipColor; g.fillRect(34, y - 21, cw, 42);
        g.fillStyle = '#10202a'; g.textAlign = 'center';
        g.fillText(chip, 34 + cw / 2, y + 1);
        g.fillStyle = '#EDF4FF'; g.font = `29px ${G.FONT}`; g.textAlign = 'left';
        g.fillText(text, 34 + cw + 16, y + 1);
      };
      row(172, '모으는 데이터', '#9FC8E8', def.data.split(' — ')[0]);
      row(244, '푸는 문제', '#F2B8B2', def.issue.split('.')[0]);
      // 안내
      g.fillStyle = '#8FA6C8'; g.font = `26px ${G.FONT}`; g.textAlign = 'center';
      g.fillText(G.touch ? '가까이 와서 「읽기」를 눌러 보세요' : '가까이 와서 E 를 눌러 보세요', 320, 336);
    });
  }

  function iconTex(def) {
    return G.canvasTex(128, 128, (g) => {
      g.fillStyle = def.color; g.beginPath(); g.arc(64, 60, 50, 0, Math.PI * 2); g.fill();
      g.lineWidth = 8; g.strokeStyle = '#ffffff'; g.stroke();
      g.beginPath(); g.moveTo(48, 104); g.lineTo(64, 124); g.lineTo(80, 104); g.fillStyle = '#ffffff'; g.fill();
      g.font = '58px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(def.icon, 64, 62);
    });
  }

  const ringGeo = new T.RingGeometry(0.95, 1.3, 30).rotateX(-Math.PI / 2);

  G.buildSmartCity = () => {
    for (const def of SIGNS) {
      def.build?.();
      const { x, z, yaw } = def.sign;
      const y = G.groundHeight(x, z);
      // 판 + 기둥 두 개
      const board = G.signBox(3.0, 1.9, 0.14, boardTex(def), 0x243447);
      board.position.set(x, y + 2.35, z); board.rotation.y = yaw; scene.add(board);
      const ox = Math.cos(yaw) * 1.25, oz = -Math.sin(yaw) * 1.25;
      city.add(0.15, 1.5, 0.15, x - ox, y + 0.75, z - oz, 0x6b4a2e);
      city.add(0.15, 1.5, 0.15, x + ox, y + 0.75, z + oz, 0x6b4a2e);
      G.blockArea(x, z, 1.4, 1.4);

      // 바닥 고리 + 떠 있는 아이콘 + 읽음 도장
      const group = new T.Group(); group.position.set(x, y + 0.05, z);
      const color = new T.Color(def.color);
      const ring = new T.Mesh(ringGeo, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.75, depthWrite: false }));
      const icon = new T.Sprite(new T.SpriteMaterial({ map: iconTex(def), depthTest: false, transparent: true }));
      icon.renderOrder = 10; icon.position.y = 4.4; icon.scale.set(1.6, 1.6, 1);
      const stamp = G.labelSprite('✓ 읽음', { bg: 'rgba(18,50,31,.92)', border: '#3ED47E', scale: 0.62, font: 30, depthTest: false });
      stamp.renderOrder = 11; stamp.position.y = 3.5; stamp.visible = isRead(def.id);
      group.add(ring, icon, stamp);
      scene.add(group);
      posts.push({ def, x, z, y, r: 2.7, group, ring, icon, stamp });
    }
    paintCount();
  };

  /* ═══════════ 가까이 가면 뜨는 안내 · 읽기 패널 ═══════════ */
  const S = G.smart = { near: null, posts, signs: SIGNS };

  S.clear = () => { S.near = null; $('signPrompt').hidden = true; };

  function checkNear() {
    const E = G.explore;
    let near = null;
    if (E.mode === 'walk' && E.walking && $('signPanel').hidden) {
      const p = E.walk.pos;
      let best = Infinity;
      for (const m of posts) {
        const d = Math.hypot(p.x - m.x, p.z - m.z);
        if (d < m.r && d < best) { best = d; near = m; }
      }
      // 게임 마커가 더 가까우면 그쪽에 양보한다 (카드 두 장이 겹쳐 뜨지 않게)
      if (near && E.near && Math.hypot(p.x - E.near.x, p.z - E.near.z) < best) near = null;
    }
    if (near === S.near) return;
    S.near = near;
    const card = $('signPrompt');
    if (!near) { card.hidden = true; return; }
    const def = near.def;
    $('signPromptIcon').textContent = def.icon;
    $('signPromptIcon').style.background = def.color;
    $('signPromptName').textContent = def.name;
    $('signPromptSub').textContent = isRead(def.id) ? '✓ 읽은 팻말이에요' : def.lead;
    $('signPromptKey').textContent = G.touch ? '' : 'E';
    card.hidden = false;
    G.sfx.play('ding');
  }

  S.open = (id) => {
    const def = id ? byId(id) : S.near?.def;
    if (!def) return;
    G.sfx.unlock(); G.sfx.play('click');
    $('signIcon').textContent = def.icon;
    $('signIcon').style.background = def.color;
    $('signName').textContent = def.name;
    $('signPlace').textContent = `📍 ${def.place}`;
    $('signLead').textContent = def.lead;
    $('signRows').innerHTML =
      row('📥', '모으는 데이터', def.data) +
      row('❓', '푸는 문제', def.issue) +
      row('💡', '이렇게 해결해요', def.how.map(h => `<span>${G.esc(h)}</span>`).join(''), true);
    $('signPanel').hidden = false;
    $('signPanel').style.setProperty('--sign', def.color);
    S.clear();
    mark(def.id);
  };
  const row = (icon, label, body, raw) =>
    `<div class="signRow"><i>${icon}</i><div><b>${label}</b>${raw ? body : `<span>${G.esc(body)}</span>`}</div></div>`;

  S.close = () => { $('signPanel').hidden = true; };

  /** 읽음으로 표시하고 진행 상황을 갱신한다 (두 번 읽어도 한 번만 센다) */
  function mark(id) {
    const first = !isRead(id);
    if (first) { readSet()[id] = true; G.store.save(); }
    const m = posts.find(p => p.def.id === id);
    if (m) m.stamp.visible = true;
    paintCount();
    $('signDone').hidden = !isRead(id);
    $('signProgress').textContent = `🏙️ 스마트시티 ${readCount()} / ${SIGNS.length}`;
    if (!first) return;
    G.sfx.play('checkpoint');
    if (readCount() === SIGNS.length) setTimeout(showAllDone, 500);
    else G.toast(`🏙️ 스마트시티 ${readCount()}/${SIGNS.length} — ${SIGNS.length - readCount()}곳 더 있어요`, 2600);
  }

  function paintCount() {
    const el = $('smartCount');
    if (el) el.textContent = `${readCount()}/${SIGNS.length}`;
    const wrap = $('smartWrap');
    if (wrap) wrap.classList.toggle('done', readCount() === SIGNS.length);
  }
  S.paintCount = paintCount;
  S.readCount = readCount;

  function showAllDone() {
    $('smartDoneList').innerHTML = SIGNS.map(s =>
      `<li>${s.icon} <b>${G.esc(s.name)}</b> — ${G.esc(s.lead)}</li>`).join('');
    $('smartDone').hidden = false;
    G.sfx.play('win');
  }

  $('signPromptRead').addEventListener('click', () => S.open());
  $('signClose').addEventListener('click', () => { S.close(); G.sfx.play('click'); });
  $('smartDoneClose').addEventListener('click', () => { $('smartDone').hidden = true; G.sfx.play('click'); });
  addEventListener('keydown', e => {
    if (e.code === 'Escape' && !$('signPanel').hidden) { S.close(); e.preventDefault(); }
    else if (e.code === 'Escape' && !$('smartDone').hidden) { $('smartDone').hidden = true; e.preventDefault(); }
  });

  /* ═══════════ 미니맵 ═══════════ */
  S.paintMap = (ctx, mapPoint, now) => {
    const pulse = 1 + Math.sin(now * 0.006) * 0.18;
    for (const m of posts) {
      const [mx, my] = mapPoint(m.x, m.z);
      const done = isRead(m.def.id);
      const s = 5.5 * (S.near === m ? pulse : 1);
      ctx.fillStyle = done ? '#3ED47E' : m.def.color;
      ctx.strokeStyle = '#0d1829'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mx, my - s); ctx.lineTo(mx + s, my); ctx.lineTo(mx, my + s); ctx.lineTo(mx - s, my);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      if (done) {
        ctx.strokeStyle = '#0d1829'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(mx - 2.6, my); ctx.lineTo(mx - 0.6, my + 2.2); ctx.lineTo(mx + 2.8, my - 2.4); ctx.stroke();
      }
    }
  };

  /* ═══════════ 매 프레임 ═══════════ */
  let blinkOn = false;
  G.ambient.push((dt, now) => {
    checkNear();
    const t = now * 0.001;
    // 센서·경보등 깜빡임 (색을 바꾸지 않고 보였다 감췄다 한다 — 가장 싸다)
    const on = Math.sin(t * 2.4) > -0.2;
    if (on !== blinkOn) { blinkOn = on; for (const m of blink) m.opacity = on ? 1 : 0.25; }
    // 고리·아이콘 움직임
    const p = G.explore.walk.pos;
    for (const m of posts) {
      m.ring.scale.setScalar(1 + Math.sin(t * 3) * 0.06);
      m.ring.material.opacity = S.near === m ? 1 : (isRead(m.def.id) ? 0.4 : 0.75);
      const close = G.explore.walking && Math.hypot(p.x - m.x, p.z - m.z) < 3.2;
      m.icon.visible = !close;
      m.icon.position.y = 4.4 + Math.sin(t * 2 + m.x) * 0.12;
      m.stamp.visible = isRead(m.def.id) && !close;
    }
  });

  /* 도시를 합치기(main.js) 전에 구조물을 세워 둔다 */
  G.buildSmartCity();
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   🎣 강변 낚시왕 — 스타듀밸리식 낚시 (도시 씬의 북쪽 강변 낚시터에서 진행)
   흐름: 누르고 있다 떼서 던지기 → 찌가 쑥 들어가면 바로 누르기(챔질)
        → 초록 막대를 물고기에 겹쳐 게이지를 채우면 낚음
   규칙 숫자는 CFG·FISH에서 고친다.
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE, $ = G.$;
  const CFG = {
    time: 75, goal: 250,             // 제한 시간(초), 성공 점수
    hookWindow: 0.8,                 // 입질 뒤 챔질 가능한 시간(초)
    bar: 0.27,                       // 초록 막대 길이 (게이지 전체 = 1)
    barAcc: 3.4, barMax: 1.7,        // 막대 가속·최대 속도
    fillIn: 0.4, drainOut: 0.3,      // 막대 안일 때 차는 속도·밖일 때 줄어드는 속도 (/초)
  };
  // 물고기: 점수, 난이도(0~1), 움직임, 멀리 던질수록 나오는 정도(far), 드문 정도(w)
  const FISH = [
    { id: 'minnow', name: '송사리', emoji: '🐟', pts: 10, diff: 0.15, move: 'smooth', w: 30, far: -1, color: 0x9fb7c9, size: 0.5 },
    { id: 'crucian', name: '붕어', emoji: '🐟', pts: 20, diff: 0.35, move: 'mixed', w: 26, far: 0, color: 0xb59a5a, size: 0.75 },
    { id: 'carp', name: '잉어', emoji: '🐟', pts: 35, diff: 0.5, move: 'smooth', w: 18, far: 0.5, color: 0xc9774a, size: 1.0 },
    { id: 'catfish', name: '메기', emoji: '🐡', pts: 50, diff: 0.62, move: 'sinker', w: 12, far: 0.8, color: 0x5d5a4e, size: 1.1 },
    { id: 'mandarin', name: '쏘가리', emoji: '🐠', pts: 70, diff: 0.78, move: 'dart', w: 8, far: 1.2, color: 0xd9b24a, size: 0.95 },
    { id: 'golden', name: '황금 잉어', emoji: '✨', pts: 150, diff: 0.92, move: 'dart', w: 2.2, far: 2.2, color: 0xffd23f, size: 1.2 },
    { id: 'boot', name: '헌 장화', emoji: '👢', pts: 2, diff: 0, move: 'junk', w: 7, far: -0.5, color: 0x4a3a2a, size: 0.8 },
  ];
  const PIER = { x: 35, z: 35.4, y: 0.35 };

  let root, player, rod, rodTip, line, linePos, bobber, fishMesh, fishMats = {};
  let ui = {};
  let st = null;                      // 한 판의 상태
  const _v = new T.Vector3(), _v2 = new T.Vector3(), camPos = new T.Vector3(), camLook = new T.Vector3();

  function waterY(x, z, now) {
    const t = now * 0.002;
    return 0.2 + Math.sin(x * 0.5 + t) * 0.12 + Math.cos((z - 38) * 0.5 + t) * 0.12;
  }

  function buildUi(ctx) {
    const wrap = document.createElement('div');
    wrap.id = 'fishUi'; wrap.hidden = true;
    wrap.innerHTML = `
      <div class="fzone" id="fZone" aria-label="누르고 있기"></div>
      <div class="fpower" id="fPower" hidden><i></i><span>멀리 던질수록 큰 물고기!</span></div>
      <div class="fbang" id="fBang" hidden>!</div>
      <div class="fmeter panel" id="fMeter" hidden>
        <div class="ftrack"><div class="fbar" id="fBar"></div><div class="ftreasure" id="fTreasure" hidden>🎁</div><div class="ffish" id="fFish">🐟</div></div>
        <div class="fprog"><i id="fProg"></i></div>
        <div class="fname" id="fName"></div>
      </div>
      <button class="tbtn big" id="fBtn" type="button" hidden>🎣<br>꾹</button>`;
    ctx.layer.appendChild(wrap);
    ui = { wrap, zone: wrap.querySelector('#fZone'), power: wrap.querySelector('#fPower'), powerI: wrap.querySelector('#fPower i'),
      bang: wrap.querySelector('#fBang'), meter: wrap.querySelector('#fMeter'), bar: wrap.querySelector('#fBar'), fish: wrap.querySelector('#fFish'),
      prog: wrap.querySelector('#fProg'), name: wrap.querySelector('#fName'), treasure: wrap.querySelector('#fTreasure'), btn: wrap.querySelector('#fBtn') };
    const css = document.createElement('style');
    css.textContent = `
      #fishUi .fzone{position:fixed; inset:0; z-index:31; touch-action:none;}
      #fishUi .fpower{position:fixed; left:50%; bottom:22%; transform:translateX(-50%); z-index:32; width:260px; height:22px; border-radius:99px; background:rgba(10,20,36,.85); border:2px solid #fff; overflow:hidden; pointer-events:none;}
      #fishUi .fpower i{display:block; height:100%; width:0; background:linear-gradient(90deg,#3ed47e,#ffd23f 60%,#ff7a70);}
      #fishUi .fpower span{position:absolute; inset:0; font:12px/18px 'Jua',sans-serif; text-align:center; color:#fff; text-shadow:0 1px 2px #000;}
      #fishUi .fbang{position:fixed; z-index:32; width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid #1b2b44; font:900 44px/56px 'Jua',sans-serif; text-align:center; color:#e8433f; box-shadow:0 6px 18px rgba(0,0,0,.35); transform:translate(-50%,-120%); pointer-events:none; animation:fbang .22s ease infinite alternate;}
      @keyframes fbang{to{transform:translate(-50%,-125%) scale(1.15);}}
      #fishUi .fmeter{position:fixed; right:max(24px,6vw); top:50%; transform:translateY(-50%); z-index:32; padding:12px; display:grid; grid-template-columns:auto auto; gap:8px; border-radius:18px; pointer-events:none;}
      #fishUi .ftrack{position:relative; width:52px; height:min(52vh,340px); border-radius:12px; background:linear-gradient(#1f6f9a,#0e3550); border:3px solid #6b4a2e; overflow:hidden;}
      #fishUi .fbar{position:absolute; left:3px; right:3px; bottom:0; border-radius:8px; background:rgba(94,230,126,.55); border:2px solid #9df5b0; box-shadow:0 0 12px rgba(94,230,126,.5);}
      #fishUi .fbar.in{background:rgba(94,230,126,.8);}
      #fishUi .ffish{position:absolute; left:50%; bottom:0; font-size:28px; line-height:1; transform:translate(-50%,50%);}
      #fishUi .ftreasure{position:absolute; left:50%; bottom:0; font-size:24px; transform:translate(-50%,50%); opacity:.9;}
      #fishUi .fprog{position:relative; width:14px; height:min(52vh,340px); border-radius:8px; background:#0a1424; border:2px solid #2d4561; overflow:hidden;}
      #fishUi .fprog i{position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(#ffd23f,#3ed47e); transition:background .2s;}
      #fishUi .fprog i.low{background:#ff7a70;}
      #fishUi .fname{grid-column:1 / 3; text-align:center; font:15px 'Jua',sans-serif;}
      @media (max-width:820px){ #fishUi .fmeter{right:14px; top:44%;} #fishUi .ftrack,#fishUi .fprog{height:min(42vh,260px);} }`;
    wrap.appendChild(css);
    const press = e => { if (e) e.preventDefault(); input(true); };
    const release = e => { if (e) e.preventDefault(); input(false); };
    ui.zone.addEventListener('pointerdown', press);
    ui.zone.addEventListener('pointerup', release);
    ui.zone.addEventListener('pointercancel', release);
    ui.zone.addEventListener('pointerleave', release);
    ui.btn.addEventListener('pointerdown', press);
    ui.btn.addEventListener('pointerup', release);
    ui.btn.addEventListener('pointercancel', release);
  }

  function buildWorld() {
    root = new T.Group(); root.visible = false; G.scene.add(root);
    player = G.makePerson({ shirt: 0x3f8fbf, pants: 0x3a3f4a, hat: 0xe8c547 });
    player.position.set(PIER.x - 0.2, PIER.y, PIER.z);
    root.add(player);
    // 낚싯대: 오른손 근처 회전축 + 긴 막대
    rod = new T.Group();
    rod.position.set(PIER.x + 0.35, PIER.y + 1.25, PIER.z + 0.25);
    const stick = new T.Mesh(G.boxGeo(0.06, 0.06, 2.8), G.mat(0x5a3a22)); stick.position.z = 1.4; rod.add(stick);
    const reelM = new T.Mesh(G.boxGeo(0.16, 0.16, 0.16), G.mat(0xcfcfcf)); reelM.position.set(0, -0.08, 0.35); rod.add(reelM);
    rodTip = new T.Object3D(); rodTip.position.z = 2.8; rod.add(rodTip);
    root.add(rod);
    linePos = new Float32Array(6);
    const lg = new T.BufferGeometry(); lg.setAttribute('position', new T.BufferAttribute(linePos, 3));
    line = new T.Line(lg, new T.LineBasicMaterial({ color: 0xf6f6f6 }));
    line.frustumCulled = false; root.add(line);
    bobber = new T.Group();
    const top = new T.Mesh(new T.SphereGeometry(0.13, 10, 8), G.mat(0xe8433f)); top.position.y = 0.05; bobber.add(top);
    const bot = new T.Mesh(new T.SphereGeometry(0.11, 10, 8), G.mat(0xf6f6f6)); bot.position.y = -0.06; bobber.add(bot);
    root.add(bobber);
    // 잡힌 물고기 (종류마다 색만 바꿔 쓰는 한 마리)
    fishMesh = new T.Group();
    const body = new T.Mesh(G.boxGeo(0.34, 0.3, 0.8), G.mat(0xffffff));
    const tail = new T.Mesh(G.boxGeo(0.06, 0.34, 0.3), G.mat(0xffffff)); tail.position.z = -0.52;
    fishMesh.add(body, tail); fishMesh.userData.parts = [body, tail];
    fishMesh.visible = false; root.add(fishMesh);
    FISH.forEach(f => { fishMats[f.id] = G.mat(f.color); });
  }

  function pickFish(dist) {
    // dist 0(가까이)~1(멀리): 멀리 던질수록 far가 큰 물고기의 가중치가 커진다
    let total = 0;
    const ws = FISH.map(f => { const w = Math.max(0.2, f.w * (1 + f.far * (dist - 0.35) * 1.6)); total += w; return w; });
    let r = Math.random() * total;
    for (let i = 0; i < FISH.length; i++) { r -= ws[i]; if (r <= 0) return FISH[i]; }
    return FISH[0];
  }

  function setPhase(p) { st.phase = p; st.pt = 0; }

  function input(down) {
    if (!st || G.play.state !== 'play') return;
    st.hold = down;
    ui.btn.classList.toggle('on', down);
    if (down) {
      if (st.phase === 'ready') { setPhase('charge'); st.power = 0; st.dir = 1; ui.power.hidden = false; }
      else if (st.phase === 'wait') {
        // 입질 전에 당기면 물고기가 달아난다
        G.ctx.flash('너무 빨라요! 🫧', 'bad', 900); G.sfx.play('splash');
        st.misses++; reelIn(0.9);
      } else if (st.phase === 'bite') {
        ui.bang.hidden = true;
        if (st.fish.move === 'junk') { landCatch(true); return; }
        startReel();
      }
    } else if (st.phase === 'charge') {
      ui.power.hidden = true;
      cast(st.power);
    }
  }

  function cast(power) {
    const dist = 0.1 + power * 0.9;
    st.castDist = dist;
    st.treasure = null;
    st.from.set(PIER.x + 0.2, 2.6, PIER.z + 0.8);
    st.to.set(PIER.x + G.rnd(-1.4, 1.4), 0.2, PIER.z + 2 + dist * 7.4);
    setPhase('cast');
    G.sfx.play('whoosh');
  }
  function reelIn(delay = 0.5) { setPhase('reelin'); st.reelDelay = delay; ui.meter.hidden = true; ui.bang.hidden = true; }

  function startReel() {
    const f = st.fish;
    setPhase('reel');
    st.barY = 0; st.barV = 0; st.fy = 0.2; st.fv = 0; st.ftarget = 0.5; st.fnext = 0.4;
    st.progress = 0.3; st.perfect = true;
    st.treasure = Math.random() < 0.28 ? { y: G.rnd(0.15, 0.85), t: 0, appear: G.rnd(0.8, 2.2), got: false, on: false } : null;
    ui.treasure.hidden = true;
    ui.meter.hidden = false;
    ui.name.textContent = '??? 가 물었다!';
    ui.fish.textContent = f.emoji === '✨' ? '🐟' : f.emoji;
    ui.bar.style.height = CFG.bar * 100 + '%';
    G.sfx.play('bite');
    G.ctx.flash('챔질!', 'gold', 600);
  }

  function landCatch(ok) {
    const f = st.fish;
    ui.meter.hidden = true;
    if (!ok) {
      st.misses++; st.streak = 0;
      G.ctx.flash(`${f.name}이(가) 도망갔어요…`, 'bad', 1100); G.sfx.play('lose');
      reelIn(0.6);
      return;
    }
    let pts = f.pts;
    const bonus = [];
    if (f.move !== 'junk' && st.perfect) { pts = Math.round(pts * 1.5); bonus.push('PERFECT ×1.5'); }
    if (st.treasure && st.treasure.got) { pts += 30; bonus.push('🎁 +30'); }
    if (f.move !== 'junk') { st.streak++; if (st.streak >= 3) { pts += 5 * (st.streak - 2); bonus.push(`${st.streak}연속 +${5 * (st.streak - 2)}`); } }
    st.score += pts;
    st.caught.push(f);
    if (!st.best || f.pts > st.best.pts) st.best = f;
    G.ctx.flash(`${f.emoji} ${f.name} +${pts}${bonus.length ? '\n' + bonus.join(' · ') : ''}`, f.id === 'golden' ? 'gold' : 'good', 1400);
    G.sfx.play(f.move === 'junk' ? 'boing' : 'catch');
    if (!st.goalShown && st.score >= CFG.goal) { st.goalShown = true; setTimeout(() => G.ctx.flash('목표 달성! 🎉 더 낚아 봐요', 'gold', 1500), 1300); }
    // 물고기가 물 밖으로 튀어 올라 낚시꾼 쪽으로
    fishMesh.visible = true;
    fishMesh.userData.parts.forEach(p => { p.material = fishMats[f.id]; });
    fishMesh.scale.setScalar(f.size);
    st.flyT = 0;
    setPhase('landed');
  }

  function stats() {
    const left = Math.max(0, Math.ceil(st.time));
    G.ctx.setStats([
      { label: '점수', value: st.score },
      { label: '목표', value: CFG.goal },
      { label: '남은 시간', value: left, warn: left <= 10 },
      { label: '낚은 수', value: st.caught.length },
    ]);
  }

  function finish() {
    const ok = st.score >= CFG.goal;
    const counts = {};
    st.caught.forEach(f => { counts[f.name] = (counts[f.name] || 0) + 1; });
    const list = Object.entries(counts).map(([n, c]) => `${n} ×${c}`).join(', ');
    G.ctx.finish({
      success: ok, record: st.score, big: `${st.score}점`,
      progress: st.score / CFG.goal,   // 못 채워도 모은 만큼 마을 점수가 남는다
      title: ok ? '강변 낚시왕 탄생! 🎣' : '시간 종료!',
      lines: [
        ok ? `목표 ${CFG.goal}점을 넘었어요.` : `목표 ${CFG.goal}점까지 ${CFG.goal - st.score}점 모자랐어요.`,
        `낚은 물고기: ${list || '없음'}`,
        st.best ? `가장 큰 수확: ${st.best.emoji} ${st.best.name} (${st.best.pts}점)` : '팁: 막대가 물고기를 따라가게 짧게 여러 번 누르세요',
        `놓친 물고기 ${st.misses}마리`,
      ],
    });
  }

  G.registerGame({
    id: 'fishing', name: '강변 낚시왕', icon: '🎣', color: '#3aa0d8',
    place: '북쪽 강변 낚시터 (다리 동쪽)',
    tagline: '찌를 던지고, 입질에 챔질하고, 막대로 물고기를 붙잡아요!',
    rules: [
      `<b>${CFG.time}초</b> 안에 <b>${CFG.goal}점</b>을 넘기면 성공`,
      '누르고 있다가 떼면 찌를 던져요 — <b>멀리</b> 던질수록 큰 물고기',
      '찌가 쑥 들어가고 <b>!</b>가 뜨면 바로 누르기 (너무 빨리 누르면 도망가요)',
      '누르면 초록 막대가 올라가요. 물고기에 겹쳐 오른쪽 게이지를 채우면 낚음',
      '한 번도 안 놓치면 <b>PERFECT ×1.5</b>, 🎁 보물 상자 +30, 3연속부터 보너스',
    ],
    controlsKey: 'Space 또는 마우스 왼쪽 버튼을 누르고 있기 / 떼기 · Esc 잠깐 멈춤',
    controlsTouch: '화면 아무 곳이나 누르고 있기 / 떼기',
    format: v => `${v}점`,
    world: 'city',
    debug: () => st,
    init(ctx) { buildWorld(); buildUi(ctx); },
    enter(ctx) {
      root.visible = true;
      G.explore.setMarkersVisible(false);
      ui.wrap.hidden = false;
      ui.btn.hidden = !G.touch;
      st = null;
      bobber.visible = false; line.visible = false; fishMesh.visible = false;
      G.resetPose(player); rod.rotation.set(-0.5, 0, 0);
      camPos.set(PIER.x - 2.1, 4.1, PIER.z - 5.4); camLook.set(PIER.x + 0.7, 0.4, PIER.z + 7);
      ctx.hint('');
    },
    start(ctx) {
      st = {
        phase: 'ready', pt: 0, time: CFG.time, score: 0, caught: [], misses: 0, streak: 0, best: null, goalShown: false,
        hold: false, power: 0, dir: 1, from: new T.Vector3(), to: new T.Vector3(), castDist: 0,
        fish: null, biteAt: 0, nibbles: 0, nextNibble: 0,
      };
      ui.meter.hidden = true; ui.power.hidden = true; ui.bang.hidden = true;
      bobber.visible = false; line.visible = false; fishMesh.visible = false;
      stats();
      ctx.hint(G.touch ? '화면을 꾹 누르고 있다가 떼면 던져요' : 'Space(또는 마우스)를 누르고 있다가 떼면 던져요');
    },
    update(dt, now, ctx) {
      if (!st) return;
      ctx.easeCamera(camPos, camLook, dt, 3);
      st.pt += dt;
      if (st.time <= 0 && (st.phase === 'ready' || st.phase === 'charge')) { ui.power.hidden = true; return finish(); }
      if (st.phase !== 'reel' && st.phase !== 'landed') st.time -= dt;
      else st.time -= dt * 0.25;      // 물고기와 씨름하는 동안엔 시간이 천천히 흐른다
      const prevLeft = Math.ceil(st.time + dt);
      if (Math.ceil(st.time) !== prevLeft && st.time <= 5 && st.time > 0) G.sfx.play('tick');
      const r = player.userData.rig;
      rod.getWorldPosition(_v);
      // ── 단계별 ──
      switch (st.phase) {
        case 'ready':
          rod.rotation.x = -0.5 + Math.sin(now * 0.002) * 0.03;
          r.armR.rotation.x = -0.9;
          bobber.visible = false; line.visible = false;
          if (st.time <= 0) return finish();
          break;
        case 'charge':
          st.power += st.dir * dt / 0.85;
          if (st.power >= 1) { st.power = 1; st.dir = -1; } else if (st.power <= 0) { st.power = 0; st.dir = 1; }
          ui.powerI.style.width = (st.power * 100).toFixed(1) + '%';
          rod.rotation.x = -0.5 - st.power * 0.9;
          r.armR.rotation.x = -1.6 - st.power * 0.6;
          break;
        case 'cast': {
          const k = Math.min(1, st.pt / 0.55);
          rod.rotation.x = G.lerp(-1.4, -0.25, Math.min(1, k * 2.5));
          r.armR.rotation.x = -1.1;
          bobber.visible = line.visible = true;
          bobber.position.lerpVectors(st.from, st.to, k);
          bobber.position.y += Math.sin(k * Math.PI) * (2 + st.castDist * 3);
          if (k >= 1) {
            G.sfx.play('splash');
            st.fish = pickFish(st.castDist);
            st.biteAt = G.rnd(1.1, 3.4) - st.castDist * 0.3;
            st.nibbles = Math.floor(G.rnd(0, 3)); st.nextNibble = G.rnd(0.4, 0.9);
            setPhase('wait');
            ctx.hint('기다려요… 찌가 쑥 들어가면 바로 누르기!');
          }
          break;
        }
        case 'wait': {
          const y = waterY(bobber.position.x, bobber.position.z, now);
          bobber.position.y = y;
          if (st.nibbles > 0 && st.pt > st.nextNibble && st.pt < st.biteAt - 0.3) {
            st.nibbles--; st.nextNibble = st.pt + G.rnd(0.45, 0.9); st.nib = 0.22; G.sfx.play('tick');
          }
          if (st.nib > 0) { st.nib -= dt; bobber.position.y -= Math.sin((0.22 - st.nib) / 0.22 * Math.PI) * 0.12; }
          if (st.pt >= st.biteAt) {
            setPhase('bite');
            G.sfx.play('bite');
            ui.bang.hidden = false;
            ctx.hint('지금! 누르기!');
          }
          if (st.time <= 0) { reelIn(0.2); }
          break;
        }
        case 'bite': {
          bobber.position.y = waterY(bobber.position.x, bobber.position.z, now) - 0.28 - Math.sin(st.pt * 30) * 0.05;
          G.camera.updateMatrixWorld();
          _v2.copy(bobber.position).project(G.camera);
          ui.bang.style.left = ((_v2.x + 1) / 2 * innerWidth) + 'px';
          ui.bang.style.top = ((1 - _v2.y) / 2 * innerHeight) + 'px';
          if (st.pt > CFG.hookWindow) {
            ui.bang.hidden = true;
            G.ctx.flash('놓쳤어요! 입질엔 바로 누르기', 'bad', 1000); G.sfx.play('lose');
            st.misses++; st.streak = 0;
            reelIn(0.5);
          }
          break;
        }
        case 'reel': {
          const f = st.fish;
          // 막대: 누르면 위로 가속, 떼면 아래로 (바닥에서 살짝 튄다)
          st.barV += (st.hold ? CFG.barAcc : -CFG.barAcc) * dt;
          st.barV = G.clamp(st.barV, -CFG.barMax, CFG.barMax);
          st.barY += st.barV * dt;
          if (st.barY < 0) { st.barY = 0; st.barV = st.barV < -0.4 ? -st.barV * 0.35 : 0; }
          if (st.barY > 1 - CFG.bar) { st.barY = 1 - CFG.bar; st.barV = Math.min(0, st.barV); }
          // 물고기: 종류마다 다르게 움직인다
          st.fnext -= dt;
          const d = f.diff;
          if (st.fnext <= 0) {
            if (f.move === 'dart') { st.ftarget = G.rnd(0.05, 0.95); st.fnext = G.rnd(0.25, 0.9) * (1.2 - d * 0.5); }
            else if (f.move === 'sinker') { st.ftarget = Math.random() < 0.7 ? G.rnd(0.02, 0.4) : G.rnd(0.5, 0.95); st.fnext = G.rnd(0.5, 1.3); }
            else if (f.move === 'mixed') { st.ftarget = Math.random() < 0.35 ? G.rnd(0, 1) : G.clamp(st.fy + G.rnd(-0.3, 0.3), 0.03, 0.97); st.fnext = G.rnd(0.4, 1.2); }
            else { st.ftarget = G.clamp(st.fy + G.rnd(-0.35, 0.35), 0.05, 0.95); st.fnext = G.rnd(0.7, 1.6); }
          }
          const accel = f.move === 'dart' ? 26 : 9;
          st.fv += ((st.ftarget - st.fy) * accel * (0.4 + d) - st.fv * (f.move === 'dart' ? 7 : 5)) * dt;
          st.fy = G.clamp(st.fy + st.fv * dt, 0.02, 0.98);
          const inBar = st.fy >= st.barY && st.fy <= st.barY + CFG.bar;
          // 보물 상자
          const tr = st.treasure;
          if (tr && !tr.got) {
            tr.t += dt;
            if (tr.t > tr.appear) {
              if (!tr.on) { tr.on = true; ui.treasure.hidden = false; ui.treasure.style.bottom = tr.y * 100 + '%'; tr.fill = 0; }
              const over = tr.y >= st.barY && tr.y <= st.barY + CFG.bar;
              if (over) tr.fill += dt;
              ui.treasure.style.opacity = 0.5 + tr.fill / 1.2 * 0.5;
              if (tr.fill >= 1.2) { tr.got = true; ui.treasure.hidden = true; G.sfx.play('coin'); ctx.flash('🎁 보물 상자!', 'gold', 700); }
              if (tr.t > tr.appear + 5 && !tr.got) { tr.got = false; st.treasure = null; ui.treasure.hidden = true; }
            }
          }
          if (inBar) st.progress += CFG.fillIn * (1.15 - d * 0.35) * dt;
          else { st.progress -= CFG.drainOut * (0.8 + d * 0.5) * dt; st.perfect = false; }
          if (Math.random() < dt * 14) G.sfx.play('reel');
          ui.bar.style.bottom = (st.barY * 100).toFixed(2) + '%';
          ui.bar.classList.toggle('in', inBar);
          ui.fish.style.bottom = (st.fy * 100).toFixed(2) + '%';
          ui.prog.style.height = (G.clamp(st.progress, 0, 1) * 100).toFixed(1) + '%';
          ui.prog.classList.toggle('low', st.progress < 0.25);
          if (st.progress > 0.55) ui.name.textContent = `${f.emoji} ${f.name}!`;
          // 3D: 찌가 물고기 따라 흔들리고 낚싯대가 휜다
          bobber.position.x = st.to.x + (st.fy - 0.5) * 2.4;
          bobber.position.y = waterY(bobber.position.x, bobber.position.z, now) - 0.15 + Math.sin(now * 0.03) * 0.04;
          rod.rotation.x = -0.9 - (st.hold ? 0.25 : 0) + Math.sin(now * 0.04) * 0.04;
          r.armR.rotation.x = -1.3 + Math.sin(now * 0.05) * 0.1;
          if (st.progress >= 1) landCatch(true);
          else if (st.progress <= 0) landCatch(false);
          break;
        }
        case 'landed': {
          const k = Math.min(1, st.pt / 0.9);
          _v.set(PIER.x + 0.2, 1.8, PIER.z + 0.9);
          fishMesh.position.lerpVectors(bobber.position, _v, k);
          fishMesh.position.y += Math.sin(k * Math.PI) * 2.2;
          fishMesh.rotation.set(Math.sin(now * 0.03) * 0.6, now * 0.01, 0);
          bobber.visible = false;
          rod.rotation.x = -1.3;
          if (st.pt > 1.4) { fishMesh.visible = false; setPhase('ready'); ctx.hint(st.time > 0 ? '다시 던져요!' : ''); }
          break;
        }
        case 'reelin': {
          const k = Math.min(1, st.pt / 0.4);
          bobber.position.lerp(_v.set(PIER.x + 0.3, 1.2, PIER.z + 1), k * 0.5);
          if (st.pt > st.reelDelay) { setPhase('ready'); bobber.visible = false; ctx.hint(st.time > 0 ? '다시 던져요!' : ''); }
          break;
        }
      }
      // 낚싯줄: 대 끝 → 찌
      if (line.visible) {
        rod.updateMatrixWorld(); rodTip.getWorldPosition(_v2);
        linePos[0] = _v2.x; linePos[1] = _v2.y; linePos[2] = _v2.z;
        const target = bobber.visible ? bobber.position : _v2;
        linePos[3] = target.x; linePos[4] = target.y; linePos[5] = target.z;
        line.geometry.attributes.position.needsUpdate = true;
      }
      if (ctx.hudDue(dt)) stats();
    },
    onKey(e, down) {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') { if (!e.repeat || !down) input(down); }
    },
    onBlur() { if (st) { st.hold = false; if (st.phase === 'charge') { ui.power.hidden = true; setPhase('ready'); } } },
    exit(ctx) {
      root.visible = false; ui.wrap.hidden = true; st = null;
      G.explore.setMarkersVisible(true);
    },
  });
})(window.G);

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   🚸 등굣길 건너기 — 한 칸씩 뛰어 도로·기찻길·강을 건너 학교 정문까지 (자기 씬)
   · 주인공: 노란 모자에 빨간 가방을 멘 「새싹이」 (원작 캐릭터·이름·그림을 쓰지 않음)
   · 차도, 모노레일 선로, 통나무가 떠내려가는 강, 신호등 있는 횡단보도

   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE, $ = G.$;
  const CFG = {

    scroll: [0.28, 0.62],      // 화면이 저절로 앞으로 가는 속도 (처음, 끝) 칸/초
    idleCrow: 8,               // 이만큼 앞으로 안 가면 까치
