<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- playcity standalone · 2026-09-25 -->
<title>놀이도시 — 걸어서 찾는 미니게임</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D 도시를 걸어 다니며 미니게임을 찾아 도전하는 가벼운 웹 게임">
<style>
/* ═══ 놀이도시 · 게임 HUD 테마 (원래 베이스의 남색 패널·노란 강조색을 이어받음) ═══ */
:root{
  --bg:#0A1523;
  --panel:rgba(13,24,41,.9); --panel-solid:#0D1829; --panel2:#16283F;
  --line:#263D5F; --line-soft:#1A2C47;
  --text:#EDF4FF; --dim:#8FA6C8;
  --accent:#FFD23F; --accent-ink:#332800;
  --good:#3ED47E; --warn:#FF7A70; --info:#5AC8FA;
  --chip:#1B2F4E;
  --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* 글꼴은 기기에 이미 있는 것만 쓴다 — 인터넷에서 받아오지 않는다.
     약한 와이파이·오프라인 교실에서 외부 호스트를 기다리지 않게 하려는 것. */
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;}
h1,h2,h3,.jua,button{font-family:var(--font); font-weight:800; letter-spacing:-.02em;}
button{cursor:pointer; -webkit-tap-highlight-color:transparent; color:inherit;}
button:disabled{cursor:default; opacity:.45;}
kbd{display:inline-block; min-width:1.6em; padding:1px 6px; border-radius:6px; background:#0A1424; border:1px solid var(--line); font:12px/1.5 'Noto Sans KR',sans-serif; color:var(--text); text-align:center;}
#stage{position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
#stage.walking{cursor:crosshair;}
#stage.locked{cursor:none;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.panel{position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 32px rgba(3,8,18,.45);}

/* ── 상단 바 ── */
#topbar{top:14px; left:50%; transform:translateX(-50%); z-index:20; display:flex; gap:10px; align-items:center; padding:8px 10px 8px 18px; border-radius:99px;}
#logo{font-size:16px; white-space:nowrap;}
.divider{width:1px; height:18px; background:var(--line); flex:none;}
#topbar button{border:1px solid var(--line); background:var(--chip); border-radius:99px; padding:7px 14px; font-size:14.5px; white-space:nowrap; transition:filter .15s, transform .15s;}
#topbar button:hover{filter:brightness(1.15); transform:translateY(-1px);}
#hubBtn b{font-weight:400; color:var(--accent); margin-left:3px;}
#walkBtn{background:var(--accent) !important; color:var(--accent-ink); border:none !important;}
#soundBtn{padding:7px 11px !important;}

/* ── 지도 ── */
#mapDock{left:16px; bottom:16px; width:236px; padding:10px 12px 12px; z-index:19;}
#mapDock h2{font-size:14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
#mapBig{font:11px 'Noto Sans KR',sans-serif; background:var(--chip); border:1px solid var(--line); border-radius:99px; padding:3px 9px;}
#miniMap{display:block; width:100%; height:auto; border-radius:10px; background:#152c37; cursor:crosshair; touch-action:none;}
.mapPlaces{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:8px 0 6px;}
.mapPlaces button,.mapTools button{background:var(--chip); border:1px solid var(--line); border-radius:8px; min-height:34px; font-size:12px; white-space:nowrap;}
.mapPlaces button:hover,.mapTools button:hover{border-color:var(--accent);}
.mapTools{display:flex; gap:5px;}
.mapTools button{flex:1; font-size:17px;}
.mapTools #resetView{flex:2.4; font-size:13px;}
body.walking .mapPlaces, body.walking .mapTools{display:none;}
body.walking #mapDock{width:200px; padding:8px 9px 9px;}
body.map-expanded #mapDock{width:min(520px, calc(100vw - 32px));}
body.in-game #mapDock, body.in-game #topbar{display:none;}
body.in-game.game-obby #mapDock{display:block;}

/* ── 걷기 ── */
#crosshair{position:fixed; left:50%; top:50%; width:7px; height:7px; margin:-3px 0 0 -3px; border:1px solid #17283d; border-radius:50%; background:white; pointer-events:none; z-index:12;}
#jumpBtn{color:var(--text); background:rgba(13,24,41,.72); border:1px solid var(--line); touch-action:none; user-select:none; -webkit-user-select:none;}
#jumpBtn:active{background:#27536b; border-color:var(--info);}
#jumpBtn{position:fixed; right:28px; bottom:calc(40px + var(--safe-b)); width:92px; height:92px; z-index:30; border-radius:50%; font-size:17px;}

/* ── 마커 안내 카드 ── */
#prompt{left:50%; bottom:66px; transform:translateX(-50%); z-index:31; display:flex; gap:14px; align-items:center; padding:12px 14px 12px 12px; width:min(520px, calc(100vw - 24px)); border-color:var(--accent); animation:rise .25s ease;}
@keyframes rise{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
#promptIcon{flex:none; width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.pbody{flex:1; min-width:0;}
#promptName{font-family:var(--font); font-weight:800; font-size:19px;}
#promptDesc{font-size:13px; color:var(--text); margin-top:2px; word-break:keep-all;}
#promptCtl{font-size:11.5px; color:var(--dim); margin-top:2px; word-break:keep-all;}
#promptRec{font-size:11.5px; color:var(--accent); margin-top:2px;}
#promptStart{flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px; padding:12px 16px; font-size:17px; min-height:52px;}
#promptStart kbd{background:rgba(0,0,0,.14); border-color:rgba(0,0,0,.2); color:var(--accent-ink); margin-right:3px;}
#promptStart kbd:empty{display:none;}

/* ── 토스트 ── */
#toasts{position:fixed; top:66px; left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{background:var(--panel); border:1px solid var(--good); border-radius:16px; padding:8px 18px; font-size:13.5px; box-shadow:0 6px 24px rgba(3,8,18,.5); text-align:center; max-width:calc(100vw - 30px); animation:toastIn .3s ease, toastOut .5s ease var(--life,3.2s) forwards;}
@keyframes toastIn{from{opacity:0; transform:translateY(-10px);} to{opacity:1;}}
@keyframes toastOut{to{opacity:0; transform:translateY(-8px);}}

/* ── 공통 오버레이 카드 ── */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(5,11,20,.72); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:14px;}
.overlay.soft{background:rgba(5,11,20,.42); backdrop-filter:none; -webkit-backdrop-filter:none;}
.card{background:var(--panel-solid); border:1px solid var(--line); border-radius:22px; padding:28px 32px; width:min(560px, 100%); max-height:calc(100vh - 28px); overflow-y:auto; text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.5); animation:pop .28s ease;}
@keyframes pop{from{opacity:0; transform:scale(.95);} to{opacity:1; transform:none;}}
.badge{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; background:var(--chip); border:1px solid var(--line); color:var(--dim); border-radius:99px; padding:4px 14px; margin-bottom:12px;}
.card h1{font-size:40px; line-height:1.2; margin-bottom:8px;}
.yellow{color:var(--accent);} .green{color:var(--good);}
.sub{color:var(--dim); font-size:14.5px; line-height:1.75; margin-bottom:18px; word-break:keep-all;}
.sub b{color:var(--text); font-weight:500;}
.steps{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:14px; text-align:left;}
.step{display:flex; gap:10px; align-items:flex-start; background:var(--panel2); border:1px solid var(--line-soft); border-radius:14px; padding:10px 12px;}
.step .no{flex:none; font-size:20px; line-height:1.2;}
.step p{font-size:12.5px; line-height:1.55; color:var(--dim); word-break:keep-all;}
.step p b{color:var(--text); font-weight:500;}
.titleGames{font-family:var(--font); font-weight:800; font-size:14px; color:var(--accent); margin-bottom:16px; line-height:1.7; word-break:keep-all;}
.bigBtn{width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px; padding:13px; font-size:20px; transition:filter .15s, transform .15s;}
.bigBtn:hover{filter:brightness(1.07); transform:translateY(-1px);}
.bigBtn.ghost{background:var(--chip); color:var(--text); border:1px solid var(--line); font-size:16px;}
.foot{font-size:12px; color:var(--dim); margin-top:12px;}
.rowBtns{display:flex; gap:8px; margin-top:14px;}
.rowBtns .bigBtn{font-size:16px; padding:12px 8px;}
.gIcon{width:64px; height:64px; margin:0 auto 10px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);}
.card h2{font-size:28px; margin-bottom:4px;}
.rules{list-style:none; text-align:left; margin:14px 0; display:flex; flex-direction:column; gap:6px;}
.rules li{background:var(--panel2); border:1px solid var(--line-soft); border-radius:12px; padding:8px 12px 8px 34px; font-size:13.5px; line-height:1.55; position:relative; word-break:keep-all;}
.rules li::before{content:'▸'; position:absolute; left:14px; color:var(--accent);}
.rules li b{color:var(--accent); font-weight:500;}
.ctl{font-size:12.5px; color:var(--dim); background:#0A1424; border-radius:10px; padding:8px 10px; line-height:1.6; word-break:keep-all;}
.rec{font-size:13px; color:var(--accent); margin-top:10px;}
#resTitle{font-size:34px;}
#resTitle.good{color:var(--good);} #resTitle.bad{color:var(--warn);}
#resBig{font-family:var(--font); font-weight:800; font-size:46px; line-height:1.1; margin:6px 0 2px;}
#resNew{display:inline-block; background:var(--accent); color:var(--accent-ink); border-radius:99px; padding:2px 12px; font-size:13px; font-family:var(--font); font-weight:800; margin-left:6px; animation:pulse 1s ease infinite;}
@keyframes pulse{50%{transform:scale(1.08);}}
#pause .card{width:min(360px,100%);}
#pause .bigBtn{margin-top:8px;}

/* ── 허브 (미니게임 수첩) ── */
#hub .card{width:min(860px,100%); text-align:left; padding:22px 24px;}
.hubHead{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.hubHead h1{font-size:28px; margin:0;}
#hubProgress{color:var(--accent); font-family:var(--font); font-weight:800; font-size:15px;}
#hubClose{margin-left:auto; background:var(--chip); border:1px solid var(--line); border-radius:99px; padding:8px 16px; font-size:15px;}
#hubList{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px;}
.gcard{background:var(--panel2); border:1px solid var(--line-soft); border-radius:16px; padding:12px 13px; display:flex; flex-direction:column; gap:7px;}
.gcard.cleared{border-color:#6d5f1f; box-shadow:0 0 0 1px rgba(255,210,63,.18) inset;}
.gcard.locked .gicon{filter:grayscale(.75) brightness(.8);}
.gtop{display:flex; gap:10px; align-items:center;}
.gicon{flex:none; width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:24px;}
.gcard h3{font-size:16.5px; line-height:1.2;}
.gplace{font-size:11.5px; color:var(--dim);}
.gstate{margin-left:auto; flex:none; font-size:11.5px; border-radius:99px; padding:2px 9px; background:var(--chip); color:var(--dim); border:1px solid var(--line);}
.gcard.cleared .gstate{color:var(--accent); border-color:#6d5f1f; background:#2a250f;}
.gtag{font-size:12.5px; line-height:1.5; word-break:keep-all;}
.grec{font-size:12px; color:var(--dim); word-break:keep-all;}
.grec b{color:var(--accent); font-weight:500;}
.gbtns{display:flex; gap:6px; margin-top:auto;}
.gbtns button{flex:1; border-radius:10px; padding:8px 6px; font-size:14px; min-height:40px;}
.ghostBtn{background:var(--chip); border:1px solid var(--line);}
.playBtn{background:var(--accent); color:var(--accent-ink); border:none;}
.hubFoot{display:flex; gap:10px; align-items:center; margin-top:14px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
.hubFoot span{flex:1; min-width:220px; line-height:1.6;}
#hubReset{background:none; border:1px solid var(--line); border-radius:99px; padding:5px 12px; font:12px 'Noto Sans KR',sans-serif; color:var(--dim);}

/* ── 게임 HUD ── */
#hudBar{top:12px; left:50%; transform:translateX(-50%); z-index:32; display:flex; align-items:center; gap:12px; padding:7px 8px 7px 16px; border-radius:99px; max-width:calc(100vw - 20px);}
#hudTitle{font-family:var(--font); font-weight:800; font-size:16px; white-space:nowrap;}
#hudStats{display:flex; gap:6px;}
#hudStats .stat{display:flex; flex-direction:column; align-items:center; background:#0A1424; border-radius:10px; padding:2px 10px 3px; min-width:54px;}
#hudStats .l{font-size:10px; color:var(--dim); white-space:nowrap;}
#hudStats .v{font-family:var(--font); font-weight:800; font-size:17px; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap;}
#hudStats .stat.warn .v{color:var(--warn);}
#hudPause{flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--chip); font-size:15px;}
#hudFlash{position:fixed; left:50%; top:30%; transform:translate(-50%,-50%) scale(.8); z-index:33; font-family:var(--font); font-weight:800; font-size:46px; line-height:1.25; white-space:pre-line !important; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .15s, transform .2s; text-align:center;}
#hudFlash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
#hudFlash.good{color:#aef7c9;} #hudFlash.bad{color:#ffb4ab;} #hudFlash.gold{color:var(--accent);}
#hudHint{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:32; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:7px 16px; font-size:13px; color:var(--text); max-width:calc(100vw - 24px); text-align:center; pointer-events:none;}
#gameLayer{position:fixed; inset:0; z-index:31; pointer-events:none;}
#gameLayer > *{pointer-events:auto;}
.tbtn{position:fixed; z-index:31; background:rgba(13,24,41,.78); border:1px solid var(--line); color:var(--text); border-radius:18px; font-family:var(--font); font-weight:800; font-size:18px; touch-action:none; user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:center;}
.tbtn:active,.tbtn.on{background:#27536b; border-color:var(--info);}
.tbtn.big{width:118px; height:118px; border-radius:50%; font-size:21px; right:22px; bottom:calc(26px + var(--safe-b));}

#title{background:rgba(5,11,20,.38); backdrop-filter:none; -webkit-backdrop-filter:none;}
#fade{position:fixed; inset:0; background:#050b14; z-index:60; opacity:0; pointer-events:none; transition:opacity .22s;}
#fade.on{opacity:1;}

@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
@media (max-width:1100px){
}
@media (max-width:820px){
  #topbar{top:8px; padding:6px 6px 6px 12px; gap:6px;}
  #logoText{display:none;}
  #topbar .divider{display:none;}
  #topbar button{padding:7px 10px; font-size:13.5px;}
  #mapDock{top:62px; bottom:auto; left:8px; width:170px; padding:7px;}
  #mapDock h2{font-size:12px; margin-bottom:5px;}
  body.walking #mapDock{width:132px; padding:6px;}
  body.walking #mapDock h2{display:none;}
  body.map-expanded #mapDock{width:calc(100vw - 16px);}
  .mapPlaces button{font-size:11px; min-height:32px;}
  #prompt, #signPrompt{bottom:auto; top:64px; padding:9px 10px; gap:10px;}
  #promptIcon{width:44px; height:44px; font-size:24px;}
  #promptName{font-size:16px;}
  #promptCtl{display:none;}
  .steps{grid-template-columns:1fr;}
  .card{padding:20px 18px;}
  .card h1{font-size:32px;}
  #hudBar{gap:6px; padding:5px 6px 5px 10px; top:8px;}
  #hudTitle{font-size:13px; max-width:92px; overflow:hidden; text-overflow:ellipsis;}
  #hudStats .stat{min-width:42px; padding:2px 6px;}
  #hudStats .v{font-size:14.5px;}
  #hudFlash{font-size:38px;}
  #hudHint{font-size:12px; bottom:auto; top:62px;}
  body.touch #prompt, body.touch #signPrompt{top:auto; bottom:calc(160px + var(--safe-b));}
}
@media (max-width:480px){
  #hubBtn b{display:none;}
  #hudTitle{display:none;}
}
body.touch.walking #prompt, body.touch.walking #signPrompt{bottom:calc(160px + var(--safe-b));}

/* ── 터치 기기: 아래쪽은 이동 버튼 자리라서 지도·알림을 위로 올린다 ── */
body.touch #mapDock{top:62px; bottom:auto; left:8px; width:170px; padding:7px;}
body.touch.walking #mapDock{width:132px; padding:6px;}
body.touch.walking #mapDock h2{display:none;}
body.touch.map-expanded #mapDock{width:min(520px, calc(100vw - 16px));}
body.touch #toasts{left:calc(50% + 76px); max-width:calc(100vw - 170px); top:64px;}
body.touch #fishUi .fmeter{right:150px;}
@media (max-width:820px){
  #hudHint{top:152px;}
  body.touch #fishUi .fmeter{right:14px; top:40%;}
}
@media (max-width:520px){
  .hubHead{flex-wrap:wrap; gap:6px 10px;}
  .hubHead h1{font-size:22px;}
  #hubProgress{order:3; width:100%; font-size:13px;}
  #hubClose{padding:6px 12px; font-size:13px;}
  #hub .card{padding:16px 14px;}
  body.touch #toasts{left:calc(50% + 70px); max-width:calc(100vw - 160px);}
}

/* ── 떠다니는 조이스틱 (누른 자리에서 생김) ── */
#joy{position:fixed; z-index:29; width:var(--joy,132px); height:var(--joy,132px); transform:translate(-50%,-50%); border-radius:50%; background:rgba(13,24,41,.28); border:2px solid rgba(237,244,255,.55); pointer-events:none; transition:border-color .15s, background .15s;}
#joy i{position:absolute; left:50%; top:50%; width:58px; height:58px; border-radius:50%; background:rgba(237,244,255,.85); box-shadow:0 3px 10px rgba(0,0,0,.35); transform:translate(-50%,-50%);}
#joy.run{border-color:var(--accent); background:rgba(255,210,63,.18);}
#joy.run i{background:var(--accent);}

#title .card{width:min(360px,100%);}
#title h1{margin-bottom:18px;}
#intro .card{width:min(380px,100%);}
#intro .rowBtns{margin-top:16px;}


/* ── 🏙️ 스마트시티 팻말 ──────────────────────────────────────
   읽기 패널은 옛 「에코시티 남산」 대화창의 아래 가운데 배치를 이어받았다.
   게임이 아니라 「읽는 것」이라 버튼은 닫기 하나뿐이다. */
#signPrompt{
  left:50%; bottom:66px; transform:translateX(-50%); z-index:31;
  display:flex; gap:14px; align-items:center; padding:12px 14px 12px 12px;
  width:min(520px, calc(100vw - 24px)); border-color:var(--info); animation:rise .25s ease;
}
#signPromptIcon{
  flex:none; width:54px; height:54px; border-radius:16px;
  display:flex; align-items:center; justify-content:center; font-size:30px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
#signPromptName{font-family:var(--font); font-weight:800; font-size:19px;}
#signPromptSub{font-size:13px; color:var(--dim); margin-top:3px; word-break:keep-all;}
#signPromptRead{
  flex:none; background:var(--info); color:#06263a; border:none; border-radius:14px;
  padding:12px 16px; font-size:17px; min-height:52px;
}
#signPromptRead kbd{background:rgba(0,0,0,.14); border-color:rgba(0,0,0,.2); color:#06263a; margin-right:3px;}
#signPromptRead kbd:empty{display:none;}

#signPanel{
  --sign:var(--info);
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + var(--safe-b)); z-index:34;
  width:min(860px, calc(100vw - 32px));
  max-height:calc(100vh - 36px - var(--safe-b));
  display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:0 18px 48px rgba(0,0,0,.45); backdrop-filter:blur(6px);
  overflow:hidden; animation:rise .22s ease;
}
#signHead{
  display:flex; align-items:center; gap:12px; padding:13px 18px; flex:none;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg, rgba(255,255,255,.05), transparent);
}
#signIcon{
  flex:none; width:46px; height:46px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; font-size:26px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
#signName{display:block; font-family:var(--font); font-weight:800; font-size:20px;}
#signPlace{display:block; font-size:12.5px; color:var(--dim); margin-top:2px;}
#signDone{
  margin-left:auto; flex:none; color:var(--good); font-size:13px; font-weight:700;
  background:rgba(62,212,126,.12); border:1px solid rgba(62,212,126,.4);
  border-radius:99px; padding:5px 11px;
}
#signBody{
  padding:15px 18px 4px;
  overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto;
}
#signLead{
  margin:0 0 13px; font-size:17px; line-height:1.55; color:var(--text);
  word-break:keep-all; padding-left:11px; border-left:3px solid var(--sign);
}
.signRow{
  display:flex; gap:11px; align-items:flex-start;
  padding:11px 13px; margin-bottom:8px;
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:12px;
}
.signRow i{flex:none; font-style:normal; font-size:19px; line-height:1.4;}
.signRow b{display:block; font-size:12.5px; color:var(--sign); margin-bottom:3px; letter-spacing:.02em;}
.signRow span{display:block; font-size:15px; line-height:1.6; color:var(--text); word-break:keep-all;}
.signRow span + span{margin-top:3px;}
#signFoot{
  display:flex; align-items:center; gap:12px; padding:11px 18px 15px;
}
#signProgress{font-size:13px; color:var(--dim);}
#signClose{
  margin-left:auto; min-width:120px; min-height:48px; border:none; border-radius:13px;
  background:var(--accent); color:var(--accent-ink);
  font-family:inherit; font-size:16px; font-weight:700; transition:filter .12s;
}
#signClose:hover{filter:brightness(1.07);}
#smartDoneBig{font-size:44px; font-weight:800; color:var(--good); margin:6px 0 10px;}

/* ── 🏙️ 진행 칩 (상단 바) ── */
#smartWrap{
  display:inline-flex; align-items:center; gap:5px; padding:5px 12px;
  background:var(--chip); border:1px solid var(--line); border-radius:99px;
  font-size:13px; color:var(--dim); white-space:nowrap;
}
#smartWrap b{color:var(--info);}
#smartWrap.done{border-color:var(--good);}
#smartWrap.done b{color:var(--good);}
body.in-game #smartWrap{display:none;}

/* ── 🏆 마을 점수 (모든 게임 합산) ── */
#totalWrap{
  display:inline-flex; align-items:center; gap:5px; padding:5px 12px;
  background:var(--chip); border:1px solid var(--line); border-radius:99px;
  font-size:13px; color:var(--dim); white-space:nowrap;
}
#totalScore{color:var(--accent); font-size:15px;}
#resPts.pts{
  margin:8px 0 0; font-size:14px; color:var(--accent);
  word-break:keep-all; line-height:1.55;
}

/* ═══ 태블릿 버전: 큰 화면 — 손가락 닿는 곳을 크게, 지도도 크게 ═══ */
body.dev-tablet #topbar button{font-size:17px; padding:10px 18px;}
body.dev-tablet #logo{font-size:18px;}
body.dev-tablet #mapDock{width:230px;}
body.dev-tablet.walking #mapDock{width:200px;}
body.dev-tablet #jumpBtn{width:118px; height:118px; right:40px; bottom:calc(48px + var(--safe-b)); font-size:20px;}
body.dev-tablet #joy i{width:74px; height:74px;}
body.dev-tablet #prompt{width:min(600px, calc(100vw - 40px)); padding:16px 18px;}
body.dev-tablet #promptName{font-size:22px;} body.dev-tablet #promptDesc{font-size:15px;}
body.dev-tablet #promptStart{font-size:21px; padding:16px 22px;}
body.dev-tablet #hudBar{padding:9px 10px 9px 20px;} body.dev-tablet #hudStats .v{font-size:20px;} body.dev-tablet #hudStats .l{font-size:11.5px;}
body.dev-tablet #hudPause{width:46px; height:46px; font-size:18px;}
body.dev-tablet .tbtn{font-size:22px;}
body.dev-tablet .tbtn.big{width:140px; height:140px;}
body.dev-tablet .card h1{font-size:46px;} body.dev-tablet .bigBtn{font-size:22px; padding:16px;}

/* ═══ 폰 버전: 세로 화면 — 위는 정보, 아래는 엄지 ═══ */
body.dev-phone #logo, body.dev-phone #topbar .divider{display:none;}
body.dev-phone #topbar{top:8px; padding:5px; gap:5px;}
body.dev-phone #topbar button{padding:8px 11px; font-size:14px;}
body.dev-phone #hubBtn b{display:none;}
body.dev-phone #mapDock{top:60px; width:150px;}
body.dev-phone.walking #mapDock{width:112px; padding:5px;}
body.dev-phone #jumpBtn{width:96px; height:96px; right:22px; bottom:calc(34px + var(--safe-b));}
body.dev-phone #joy i{width:52px; height:52px;}
body.dev-phone #prompt{top:auto; bottom:calc(150px + var(--safe-b)); padding:10px;}
body.dev-phone #promptCtl{display:none;}
body.dev-phone #hudTitle{display:none;}
body.dev-phone #hudBar{top:6px; gap:5px; padding:4px 5px 4px 8px;}
body.dev-phone #hudStats .stat{min-width:40px; padding:2px 6px;}
body.dev-phone #hudStats .v{font-size:15px;}
body.dev-phone #toasts{top:auto; bottom:calc(270px + var(--safe-b)); left:50%; max-width:calc(100vw - 24px);}
body.dev-phone .tbtn.big{width:108px; height:108px;}

/* ── 퀴즈: 기기별 ── */
body.dev-tablet #signPanel{width:min(960px, calc(100vw - 48px));}
body.dev-tablet #signLead{font-size:20px;}
body.dev-tablet .signRow span{font-size:17px;}
body.dev-tablet #signClose{min-height:56px; font-size:18px;}
body.dev-tablet #signPromptName{font-size:22px;} body.dev-tablet #signPromptSub{font-size:15px;}
body.dev-tablet #signPromptRead{font-size:21px; padding:16px 22px;}
body.dev-phone #signPanel{width:calc(100vw - 20px); bottom:calc(10px + var(--safe-b));}
body.dev-phone #signBody{padding:12px 13px 2px;}
body.dev-phone #signLead{font-size:15.5px; margin-bottom:10px;}
body.dev-phone .signRow{padding:9px 11px; margin-bottom:7px;}
body.dev-phone .signRow span{font-size:14px;}
body.dev-phone #signName{font-size:17px;}
body.dev-phone #signFoot{padding:9px 13px 12px;}
body.dev-phone #signClose{min-height:46px; font-size:15px; min-width:96px;}
body.dev-phone #signPrompt{top:auto; bottom:calc(150px + var(--safe-b)); padding:10px;}

body.dev-tablet #totalWrap{font-size:15px; padding:7px 14px;}
body.dev-tablet #totalScore{font-size:18px;}
body.dev-phone #totalWrap{font-size:11.5px; padding:4px 9px; gap:3px;}
body.dev-phone #totalScore{font-size:13px;}
body.in-game #totalWrap{display:none;}

/* ═══ 기기 모드 선택 (시작 화면 & 상단 바) ═══ */
.devPickGroup{
  display:flex; gap:8px; justify-content:center; margin:16px 0 20px; width:100%;
}
.devPickBtn{
  flex:1; padding:10px 8px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel2); color:var(--dim); font-size:14px; font-weight:700;
  cursor:pointer; transition:all .15s ease; outline:none;
}
.devPickBtn:hover{border-color:var(--info); color:var(--text);}
.devPickBtn.active{
  background:var(--info); color:#06263a; border-color:var(--info);
  box-shadow:0 0 14px rgba(62,174,255,.4);
}

#devSwitchBtn{
  background:var(--chip); border:1px solid var(--line); border-radius:10px;
  padding:6px 10px; font-size:15px; cursor:pointer; color:var(--text);
  transition:all .15s ease;
}
#devSwitchBtn:hover{border-color:var(--accent); background:rgba(255,255,255,.08);}

/* ═══ 화면 폭 기준 반응형 보조 ═══ */
@media (max-width: 600px){
  #signPanel{width:calc(100vw - 16px); bottom:calc(8px + var(--safe-b)); max-height:calc(100vh - 48px - var(--safe-b));}
  #signBody{padding:10px 12px 2px; max-height:calc(100vh - 160px);}
  #signLead{font-size:15px; margin-bottom:8px;}
  .signRow{padding:8px 10px; margin-bottom:6px;}
  .signRow span{font-size:13.5px;}
  #signName{font-size:16.5px;}
  #signFoot{padding:8px 12px 10px;}
  #signClose{min-height:44px; font-size:14.5px;}
  #topbar{gap:4px; padding:4px 6px;}
  #smartWrap{padding:4px 8px; font-size:12px;}
  #totalWrap{display:none;}
}

</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- ═══ 시작 화면 ═══ -->
<div class="overlay" id="title">
  <div class="card">
    <h1><span class="yellow">놀이</span>도시 🏙️</h1>
    <div class="devPickGroup" id="devPickGroup" aria-label="기기 화면 비율 선택">
      <button type="button" class="devPickBtn" data-dev="pc">💻 노트북</button>
      <button type="button" class="devPickBtn" data-dev="tablet">📟 태블릿</button>
      <button type="button" class="devPickBtn" data-dev="phone">📱 폰</button>
    </div>
    <button class="bigBtn" id="startBtn" type="button">🚶 탐험 시작</button>
  </div>
</div>

<!-- ═══ 상단 바 ═══ -->
<div id="topbar" class="panel" hidden>
  <span id="logo" class="jua">🏙️ <span id="logoText">놀이도시</span></span>
  <span class="divider"></span>
  <span id="totalWrap">🏆 <b id="totalScore">0점</b></span>
  <span id="smartWrap" title="스마트시티 팻말">🏙️ <b id="smartCount">0/5</b></span>
  <button id="hubBtn" type="button" title="미니게임 수첩 (Tab)">🎮 미니게임 <b id="hubBtnCount">★ 0/0</b></button>
  <button id="walkBtn" type="button" title="걷기 ↔ 조망 (M)">🚶 걷기</button>
  <button id="devSwitchBtn" type="button" title="화면 비율 변경 (노트북·태블릿·폰)">💻</button>
  <button id="soundBtn" type="button" aria-label="소리 끄기">🔊</button>
</div>

<!-- ═══ 지도 ═══ -->
<aside id="mapDock" class="panel" hidden aria-label="지도">
  <h2>우리 동네 지도 <button id="mapBig" type="button" aria-pressed="false">지도 크게</button></h2>
  <canvas id="miniMap" width="240" height="180" aria-label="지도를 누르면 그곳을 바라봐요"></canvas>
  <div class="mapPlaces" id="mapPlaces"></div>
  <div class="mapTools">
    <button id="zoomIn" type="button" aria-label="확대">＋</button>
    <button id="zoomOut" type="button" aria-label="축소">−</button>
    <button id="resetView" type="button" aria-label="도시 전체 보기">전체 보기</button>
  </div>
</aside>

<!-- ═══ 걷기 도구 ═══ -->
<div id="crosshair" hidden></div>
<div id="joy" hidden aria-hidden="true"><i id="joyKnob"></i></div>
<button id="jumpBtn" type="button" hidden aria-label="점프">점프</button>

<!-- ═══ 마커 가까이에서 뜨는 안내 ═══ -->
<div id="prompt" class="panel" hidden role="dialog" aria-live="polite">
  <span id="promptIcon"></span>
  <div class="pbody">
    <b id="promptName"></b>
    <p id="promptDesc"></p>
    <p id="promptCtl"></p>
    <p id="promptRec"></p>
  </div>
  <button id="promptStart" type="button"><kbd id="promptKey">E</kbd> 시작</button>
</div>

<!-- ═══ 스마트시티 팻말 ═══ -->
<div id="signPrompt" class="panel" hidden role="dialog" aria-live="polite">
  <span id="signPromptIcon"></span>
  <div class="pbody">
    <b id="signPromptName"></b>
    <p id="signPromptSub"></p>
  </div>
  <button id="signPromptRead" type="button"><kbd id="signPromptKey">E</kbd> 읽기</button>
</div>

<div id="signPanel" hidden role="dialog" aria-modal="true" aria-labelledby="signName">
  <div id="signHead">
    <span id="signIcon"></span>
    <div>
      <b id="signName"></b>
      <span id="signPlace"></span>
    </div>
    <span id="signDone" hidden>✓ 읽음</span>
  </div>
  <div id="signBody">
    <p id="signLead"></p>
    <div id="signRows"></div>
  </div>
  <div id="signFoot">
    <span id="signProgress"></span>
    <button id="signClose" type="button">닫기</button>
  </div>
</div>

<!-- 팻말 5개를 다 읽었을 때 -->
<div class="overlay soft" id="smartDone" hidden>
  <div class="card">
    <div class="gIcon" id="smartDoneIcon">🏙️</div>
    <h2>스마트시티 탐험 완료!</h2>
    <div id="smartDoneBig">5 / 5</div>
    <ul class="rules" id="smartDoneList"></ul>
    <div class="rowBtns">
      <button class="bigBtn" id="smartDoneClose" type="button">🚶 탐험으로</button>
    </div>
  </div>
</div>

<!-- ═══ 게임 공통 HUD ═══ -->
<div id="gameHud" hidden>
  <div id="hudBar" class="panel"><span id="hudTitle"></span><div id="hudStats"></div><button id="hudPause" type="button" aria-label="일시정지 (Esc)">⏸</button></div>
  <div id="hudFlash"></div>
  <div id="hudHint" hidden></div>
</div>
<div id="gameLayer"></div>

<!-- 게임 설명 -->
<div class="overlay soft" id="intro" hidden>
  <div class="card">
    <div class="gIcon" id="introIcon"></div>
    <h2 id="introName"></h2>
    <p class="rec" id="introRec"></p>
    <div class="rowBtns">
      <button class="bigBtn ghost" id="introBack" type="button">← 탐험으로 (Esc)</button>
      <button class="bigBtn" id="introGo" type="button">▶ 시작</button>
    </div>
  </div>
</div>

<!-- 결과 -->
<div class="overlay soft" id="result" hidden>
  <div class="card">
    <div class="gIcon" id="resIcon"></div>
    <h2 id="resTitle"></h2>
    <div id="resBig"></div>
    <p class="rec"><span id="resBest"></span><span id="resNew" hidden>NEW!</span></p>
    <p id="resPts" class="pts"></p>
    <ul class="rules" id="resLines"></ul>
    <div class="rowBtns">
      <button class="bigBtn" id="resRetry" type="button">↻ 다시 도전 (R)</button>
    </div>
    <div class="rowBtns">
      <button class="bigBtn ghost" id="resHub" type="button">🎮 미니게임 수첩</button>
      <button class="bigBtn ghost" id="resExit" type="button">🚶 탐험으로 (Esc)</button>
    </div>
  </div>
</div>

<!-- 일시정지 -->
<div class="overlay soft" id="pause" hidden>
  <div class="card">
    <h2>⏸ 잠깐 멈춤</h2>
    <button class="bigBtn" id="pauseResume" type="button">▶ 계속하기 (Esc)</button>
    <button class="bigBtn ghost" id="pauseRetry" type="button">↻ 처음부터 (R)</button>
    <button class="bigBtn ghost" id="pauseExit" type="button">🚶 탐험으로 나가기 (Q)</button>
  </div>
</div>

<!-- 미니게임 수첩 -->
<div class="overlay" id="hub" hidden>
  <div class="card">
    <div class="hubHead">
      <h1>🎮 미니게임 수첩</h1>
      <span id="hubProgress"></span>
      <button id="hubClose" type="button">탐험으로 (Tab)</button>
    </div>
    <div id="hubList"></div>
    <div class="hubFoot">
      <span>📍 위치 보기: 조망 카메라가 그 장소로 날아가요 · ▶ 하기: 한 번 찾아간 게임은 여기서 바로 다시 할 수 있어요 · 게임 중 Esc: 잠깐 멈춤</span>
      <button id="hubReset" type="button">기록 지우기</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="fade"></div>

window.G = {};
(function (G) {
  G.$ = id => document.getElementById(id);

  const qDev = (location.search.match(/[?&]device=(phone|tablet|pc)\b/) || [])[1];
  const autoDev = G.touch
    ? (Math.min(screen.width, screen.height) < 600 ? 'phone' : 'tablet')
    : (window.innerWidth < 640 ? 'phone' : (window.innerWidth <= 1024 ? 'tablet' : 'pc'));
  G.DEVICE = qDev || autoDev;

  /** 기기별 맞춤 값 — 시야각(걷기), 조이스틱 반지름(px) */
  G.DEVICE_MAP = {
    phone: { fov: 70, joyR: 52 },
    tablet: { fov: 58, joyR: 72 },
    pc: { fov: 55, joyR: 58 },
  };

    if (!G.DEVICE_MAP[dev]) return;
    G.DEVICE = dev;

    document.body.classList.add('dev-' + dev);

    u.searchParams.set('device', dev);

    const jump = G.$('jumpBtn');
    if (joy && jump) {

      joy.hidden = !showTouch;
      jump.hidden = !showTouch;
    }
    const iconBtn = G.$('devSwitchBtn');

<script>

(function (G) {

  city.add(160, 0.35, 1.6, 0, 0.1, 30.5, 0xA8B394).add(160, 0.35, 1.6, 0, 0.1, 45.5, 0xA8B394);   // 강둑

  }

  }

  for (const x of [-20, 14]) for (const z of [-16, 14]) for (const side of [-1, 1]) {
    for (let i = -1.5; i <= 1.5; i += 0.6) city.add(0.32, 0.04, 1.7, x + i, 0.2, z + side * 4, 0xf1ecdb);
  }

  /* ═══════════ 나무 (잎은 바람에 흔들린다 — 공유 지오메트리·재질) ═══════════ */
  const treeLeaves = [];

  // 원본 순서 그대로 (시드 난수를 같은 횟수 소비해야 건물 배치가 같다)
  // (10,-46)·(12,-40) 나무는 언덕 점프 코스와 겹쳐 심지 않지만 난수는 소비한다
  const SKIP_TREES = new Set(['10,-46', '12,-40']);
  [[-12, -38], [12, -40], [-14, -44], [10, -46], [-30, 26], [24, 26], [-52, 26], [48, 26]].forEach(([x, z]) => {
    const s = cityRandom(0.8, 1.15);
    if (!SKIP_TREES.has(x + ',' + z)) G.addTree(x, z, s);
  });
  for (let x = -68; x <= 68; x += 12) {
    if (Math.abs(x + 8) < 5) continue;
    G.addTree(x, 25, cityRandom(0.9, 1.3));
    city.add(2, 0.3, 0.7, x + 3, 0.65, 26.4, 0x966b47);     // 벤치
  }

  /* ═══════════ 도심 건물 ═══════════ */
  const winTexCache = {};

    const c = document.createElement('canvas'); c.width = 128; c.height = Math.max(64, floors * 64);
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
    for (let y = 12; y < c.height - 12; y += 64) for (let x = 16; x < 112; x += 32) {

  // 건물 생성 예약 영역 — 원본 목록을 그대로 둔다 (배치가 같게 유지되도록).
  // 새 장소는 모두 이 영역들 안이나 원래 빈 남쪽 강변에 있어 건물과 겹치지 않는다 (places.js가 검사).
  const reserved = G.reserved = [...LAYOUT.roads.map(r => ({ ...r, w: r.w + 3, d: r.d + 3 })),
    { x: 0, z: -48, w: 23, d: 26 }, { x: 0, z: -27, w: 6, d: 20 },          // 공원 언덕과 진입로
    { x: 0, z: 38, w: 160, d: 30 }, { x: -8, z: 22, w: 6, d: 16 }, { x: -8, z: 56, w: 6, d: 18 }, // 강변·다리 진입로
    { x: 38, z: 52, w: 15, d: 10 }, { x: 26, z: 6, w: 9, d: 9 }];             // 옛 발전소 자리(→ 학교 앞 광장), 빈 자리
  const bmat = new Map();
  for (let gx = -6; gx <= 6; gx++) for (let gz = -4; gz <= 6; gz++) {

    const color = palette[Math.floor(cityRandom(0, palette.length))];
    const floors = Math.max(1, Math.round(h / 3.2));

    city.add(w + 0.7, 0.2, d + 0.7, x, 0.1, z, 0xc6c5b7);                         // 기단
    city.add(0.85, 1.5, 0.08, x, 0.75, z + d / 2 + 0.05, 0x39576b);               // 문
    city.add(1.4, 0.15, 0.6, x, 1.6, z + d / 2 + 0.3, decoPick([0xdddddd, 0xe26a5c, 0x4785b8])); // 차양
    city.add(w * 0.95, 0.4, d * 0.95, x, h + 0.2, z, 0x55606A);                   // 옥상 테두리
    if (w > 3 && d > 3) {
      const rh = deco(0.8, 1.5);
      city.add(1.8, rh, 1.8, x + (w / 4) * decoPick([-1, 1]), h + 0.7, z + (d / 4) * decoPick([-1, 1]), 0x88929A);
    }
    buildings.push({ x, z, w, d, h });
    blockArea(x, z, w + 0.3, d + 0.3);
  }

  /* ═══════════ 구름 · 차 · 모노레일 열차 · 새 ═══════════ */
  const clouds = [];
  const cloudGeo = new T.DodecahedronGeometry(1);
  const cloudMat = new T.MeshLambertMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 6; i++) {
    const g = new T.Group();
    for (let j = 0; j < 3; j++) {
      const b = new T.Mesh(cloudGeo, cloudMat);
      b.castShadow = true;
      const s = deco(3, 5.5);
      b.scale.set(s, s * 0.4, s * 0.7);
      b.position.set(deco(-3, 3), deco(-1, 1), deco(-2, 2));
      g.add(b);
    }
    g.position.set(deco(-85, 85), deco(38, 52), deco(-75, 55));
    g.userData.v = deco(0.012, 0.028);
    scene.add(g); clouds.push(g);
  }

  const cars = G.cars = [];
  const cabinGeo = G.boxGeo(1.0, 0.3, 0.8), cabinMat = G.mat(0x252525);
  function addCar(x, z, speed, color) {
    const c = G.box(1.6, 0.6, 0.9, color);
    const cabin = new T.Mesh(cabinGeo, cabinMat);
    cabin.position.y = 0.45; c.add(cabin);
    c.position.set(x, 0.45, z);
    c.userData.speed = speed;
    if (speed < 0) c.rotation.y = Math.PI;
    scene.add(c); cars.push(c);
  }
  const carColors = [0xd4574e, 0x4e7ad4, 0xd4b34e, 0xcccccc];
  for (let i = 0; i < 8; i++) {
    addCar(deco(-70, 70), i % 2 ? 14 + (i % 4 < 2 ? -1.2 : 1.2) : -16 + (i % 4 < 2 ? -1.2 : 1.2),
      deco(0.08, 0.16) * (i % 4 < 2 ? 1 : -1), decoPick(carColors));
  }
  // 학교 앞 도로 — 어린이 보호구역이라 천천히 달린다
  for (let i = 0; i < 4; i++) addCar(-60 + i * 36, 61 + (i % 2 ? 1.2 : -1.2), (i % 2 ? -1 : 1) * deco(0.06, 0.09), decoPick(carColors));

  // 모노레일: 원래 보행교 줄(x=-8)을 땅 높이로 달리며 사람을 뚫고 지나가던 열차를
  // 건물과 도로 사이 빈 줄의 고가 선로로 옮겼다
  const MR = LAYOUT.monorail;
  city.add(0.7, 0.35, 160, MR.x, MR.y, 0, 0x8d97a0);
  for (const z of [-70, -52, -34, -8, 22, 38, 54, 72]) {
    if (z === -16 || z === 14 || z === 61) continue;
    city.add(0.6, MR.y, 0.6, MR.x, MR.y / 2, z, 0x9aa3ab);              // 기둥
    city.add(1.6, 0.4, 0.8, MR.x, MR.y - 0.25, z, 0x9aa3ab);            // 받침
    if (z < 30 || z > 46) blockArea(MR.x, z, 0.6, 0.6);
  }
  const train = new T.Group();
  const carriageGeo = G.boxGeo(1.2, 1.4, 3.5), winGeo = G.boxGeo(1.25, 0.4, 3.2);
  for (let i = 0; i < 3; i++) {
    const carriage = new T.Mesh(carriageGeo, G.mat(0xEEEEEE));
    carriage.castShadow = true;
    const win = new T.Mesh(winGeo, G.mat(0x222222));
    win.position.y = 0.2; carriage.add(win);
    const stripe = new T.Mesh(G.boxGeo(1.26, 0.18, 3.52), G.mat(0x2FA7DA));
    stripe.position.y = -0.35; carriage.add(stripe);
    carriage.position.z = i * 3.8;
    train.add(carriage);
  }
  train.position.set(MR.x, MR.y + 0.9, 70);
  scene.add(train);

  const birds = [];
  const wingGeo = G.boxGeo(0.25, 0.05, 0.5), wingMat = G.mat(0x333333);
  for (let i = 0; i < 8; i++) {
    const b = new T.Group();
    const w1 = new T.Mesh(wingGeo, wingMat); w1.position.set(0, 0, 0.25); w1.rotation.y = -0.4; b.add(w1);
    const w2 = new T.Mesh(wingGeo, wingMat); w2.position.set(0, 0, -0.25); w2.rotation.y = 0.4; b.add(w2);
    b.position.set(deco(-60, 60), deco(35, 48), deco(-60, 60));
    b.userData.speed = deco(0.15, 0.25); b.userData.phase = deco(0, 100);
    scene.add(b); birds.push({ g: b, w1, w2 });
  }


  /* ═══════════ 매 프레임 애니메이션 (물결·나무·구름·차·열차·새) ═══════════ */
  const rpos = riverGeo.attributes.position;
  G.world = {
    river, train, clouds, birds,
    update(dt, now) {
      const time = now * 0.002;
      for (let i = 0; i < rpos.count; i++) {
        const x = rpos.getX(i), z = rpos.getZ(i);
        rpos.setY(i, Math.sin(x * 0.5 + time) * 0.12 + Math.cos(z * 0.5 + time) * 0.12);
      }
      rpos.needsUpdate = true;
      for (const l of treeLeaves) {
        l.rotation.x = Math.sin(time + l.userData.phase) * 0.06;
        l.rotation.z = Math.cos(time + l.userData.phase) * 0.06;
      }
      for (const c of clouds) { c.position.x += c.userData.v * dt * 60; if (c.position.x > 95) c.position.x = -95; }
      const sig = G.schoolSignal;
      for (const c of cars) {
        let v = c.userData.speed * dt * 60;
        if (sig && sig.walk && Math.abs(c.position.z - 61) < 3) {
          const ahead = (36 - c.position.x) * Math.sign(c.userData.speed);   // 학교 앞 횡단보도까지 남은 거리
          if (ahead > 2.4 && ahead < 5.5) v = 0;
        }
        c.position.x += v;
        if (c.position.x > 76) c.position.x = -76;
        if (c.position.x < -76) c.position.x = 76;
      }
      for (const b of birds) {
        b.g.position.x += b.g.userData.speed * dt * 60;
        if (b.g.position.x > 80) b.g.position.x = -80;
        const flap = Math.sin(time * 18 + b.g.userData.phase) * 0.4;
        b.w1.rotation.z = flap; b.w2.rotation.z = -flap;
      }
      train.position.z -= dt * 25;
      if (train.position.z < -86) train.position.z = 80;
    },
  };
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   people.js — 저폴리 사람 캐릭터 (주인공·선생님·친구들)
   · 상자 몇 개로 만든다. 지오메트리·재질은 공유 캐시를 쓴다
   · 앞쪽이 +z. 키 약 2.2 (걷기 시점 눈높이 2.1과 맞춤)
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE;
  const part = (w, h, d, color, x, y, z, parent) => {
    const m = new T.Mesh(G.boxGeo(w, h, d), G.mat(color));
    m.castShadow = true;
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  };
  const pivot = (x, y, z, parent) => { const g = new T.Group(); g.position.set(x, y, z); parent.add(g); return g; };

  /**
   * @param {object} o skin·hair·shirt·pants·shoes 색, hat(색)·bag(색)·glasses(true)·long(긴 머리)·skirt
   */
  G.makePerson = (o = {}) => {
    const c = Object.assign({ skin: 0xf2c9a0, hair: 0x2b2118, shirt: 0x4e7ad4, pants: 0x34405a, shoes: 0x222222 }, o);
    const root = new T.Group();
    const body = pivot(0, 0.9, 0, root);            // 허리 — 몸통을 흔들 때 이 축을 돌린다
    const legL = pivot(-0.15, 0.9, 0, root), legR = pivot(0.15, 0.9, 0, root);
    [legL, legR].forEach(l => {
      part(0.24, 0.8, 0.26, c.skirt ? c.skin : c.pants, 0, -0.4, 0, l);
      part(0.26, 0.14, 0.34, c.shoes, 0, -0.84, 0.04, l);
    });
    if (c.skirt) part(0.66, 0.36, 0.42, c.pants, 0, 0.06, 0, body);
    part(0.62, 0.74, 0.36, c.shirt, 0, 0.4, 0, body);
    const armL = pivot(-0.4, 0.72, 0, body), armR = pivot(0.4, 0.72, 0, body);
    [armL, armR].forEach(a => {
      part(0.18, 0.62, 0.2, c.shirt, 0, -0.28, 0, a);
      part(0.16, 0.14, 0.18, c.skin, 0, -0.64, 0, a);
    });
    const head = pivot(0, 0.8, 0, body);
    part(0.5, 0.5, 0.46, c.skin, 0, 0.25, 0, head);
    part(0.54, 0.16, 0.5, c.hair, 0, 0.52, -0.01, head);
    part(0.54, 0.34, 0.12, c.hair, 0, 0.33, -0.2, head);
    if (c.long) part(0.54, 0.5, 0.14, c.hair, 0, 0.12, -0.22, head);
    part(0.07, 0.08, 0.02, 0x1b1b1b, -0.11, 0.28, 0.235, head);
    part(0.07, 0.08, 0.02, 0x1b1b1b, 0.11, 0.28, 0.235, head);
    if (c.glasses) {
      part(0.16, 0.12, 0.02, 0x3a3a3a, -0.11, 0.28, 0.25, head);
      part(0.16, 0.12, 0.02, 0x3a3a3a, 0.11, 0.28, 0.25, head);
    }
    if (c.hat) { part(0.56, 0.18, 0.52, c.hat, 0, 0.58, 0, head); part(0.56, 0.05, 0.22, c.hat, 0, 0.5, 0.33, head); }
    if (c.bag) part(0.46, 0.5, 0.2, c.bag, 0, 0.42, -0.28, body);
    root.userData.rig = { body, head, armL, armR, legL, legR };
    return root;
  };

  /** 가벼운 앉은 친구 (상자 4개). 교실 배경 인물용 — 앞쪽 +z */
  G.makeKid = (o = {}) => {
    const c = Object.assign({ skin: 0xf2c9a0, hair: 0x2b2118, shirt: 0x4e7ad4 }, o);
    const g = new T.Group();
    const upper = pivot(0, 0.55, 0, g);
    part(0.5, 0.58, 0.3, c.shirt, 0, 0.29, 0, upper);
    const head = pivot(0, 0.6, 0, upper);
    part(0.42, 0.42, 0.4, c.skin, 0, 0.21, 0, head);
    part(0.46, 0.14, 0.44, c.hair, 0, 0.45, -0.01, head);
    if (c.long) part(0.46, 0.4, 0.1, c.hair, 0, 0.2, -0.2, head);
    part(0.46, 0.2, 0.56, 0x34405a, 0, 0.1, 0.12, g);     // 앉은 다리
    g.userData.rig = { upper, head };
    return g;
  };

  /** 작은 보트 (선착장 장식·보트 게임 공용). 앞쪽이 +z */
  G.makeBoat = (color = 0xe8533f) => {
    const g = new T.Group();
    part(1.5, 0.45, 2.6, color, 0, 0.1, 0, g);                  // 선체
    const bow = part(1.06, 0.45, 1.06, color, 0, 0.1, 1.3, g);   // 뱃머리 (45도 돌린 상자)
    bow.rotation.y = Math.PI / 4;
    part(1.3, 0.06, 2.4, 0xf4ecd8, 0, 0.34, -0.05, g);          // 갑판
    part(1.52, 0.12, 2.62, 0xffffff, 0, 0.36, 0, g);            // 테두리
    part(0.9, 0.5, 0.7, 0xdfeff7, 0, 0.62, -0.5, g);            // 조종석 창
    part(0.3, 0.3, 0.4, 0x333333, 0, 0.1, -1.4, g);             // 모터
    return g;
  };

  /** 기본 자세로 되돌린다 */
  G.resetPose = p => {
    const r = p.userData.rig;
    for (const k of ['body', 'head', 'armL', 'armR', 'legL', 'legR']) r[k].rotation.set(0, 0, 0);
    r.body.position.y = 0.9;
  };
  /** 걷기 흔들림 (t: 진행 위상) */
  G.walkPose = (p, t, amp = 0.7) => {
    const r = p.userData.rig, s = Math.sin(t) * amp;
    r.legL.rotation.x = s; r.legR.rotation.x = -s;
    r.armL.rotation.x = -s * 0.8; r.armR.rotation.x = s * 0.8;
  };
  /** 앉은 자세 */
  G.sitPose = p => {
    const r = p.userData.rig;
    G.resetPose(p);
    r.legL.rotation.x = r.legR.rotation.x = -1.45;
    r.body.position.y = 0.55;
    r.legL.position.y = r.legR.position.y = 0.55;
  };
  G.standLegs = p => { const r = p.userData.rig; r.legL.position.y = r.legR.position.y = 0.9; };
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   places.js — 새 장소: 학교·운동장, 학교 앞 횡단보도 광장, 강변 낚시터,
               선착장, 하늘언덕 공원(옛 남산 언덕 재활용), 길 안내판
   · 각 장소는 「보이는 메시 + 충돌 + 미니맵 도형」을 한 함수에서 같이 만든다.
     위치를 옮기려면 SPOTS와 해당 함수의 숫자만 고치면 된다.
   · 원래 비어 있던 남쪽 강변과 옛 남산·발전소 자리만 쓴다 (건물과 겹침 검사는 맨 아래).
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE, scene = G.scene, city = G.cityBatch;

  /** 미니게임 마커 자리 — 게임 파일들이 이 좌표를 쓴다 */
  G.SPOTS = {
    fishing: { x: 35, z: 34.6 },     // 북쪽 강변 낚시터 끝
    crossing: { x: 36, z: 54.2 },    // 학교 앞 횡단보도 광장
    dance: { x: 45.4, z: 74.5 },     // 학교 교실 맨 뒷자리 옆
    obby: { x: 7.5, z: -39.5 },      // 하늘언덕 공원 출발 발판
    boat: { x: -40, z: 41.4 },       // 남쪽 선착장 끝
  };
  /** 조망 카메라 장소 버튼 */
  G.PLACES = {
    park: { x: 0, y: 6, z: -50, dist: 62, label: '하늘언덕 공원 · 점프 챌린지', icon: '⛰️', name: '공원' },
    pier: { x: 35, y: 1, z: 32, dist: 46, label: '강변 낚시터', icon: '🎣', name: '낚시터' },
    school: { x: 42, y: 2, z: 64, dist: 60, label: '놀이초등학교 · 교실과 운동장', icon: '🏫', name: '학교' },
    plaza: { x: 36, y: 1, z: 56, dist: 44, label: '학교 앞 횡단보도', icon: '🚸', name: '횡단보도' },
    dock: { x: -40, y: 1, z: 44, dist: 46, label: '강변 선착장', icon: '🚤', name: '선착장' },
  };
  G.mapShapes = [];     // 미니맵에 그릴 사각형 {x,z,w,d,color}
  G.mapLabels = [];     // 미니맵 글자 {text,x,z}
  const shape = (x, z, w, d, color) => G.mapShapes.push({ x, z, w, d, color });
  const newAreas = [];  // 새 구조물 영역 (건물 겹침 검사용)
  const area = (x, z, w, d, name) => { newAreas.push({ x, z, w, d, name }); G.reserved.push({ x, z, w, d }); };

  /* 텍스처 입힌 판 (간판·칠판 등). 앞면만 그림, 옆·뒤는 단색 */
  function signBox(w, h, d, tex, edge = 0x2d3b48) {
    const e = G.mat(edge);
    const front = new T.MeshLambertMaterial({ map: tex });
    const m = new T.Mesh(G.boxGeo(w, h, d), [e, e, e, e, front, e]);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  G.signBox = signBox;
  function textTex(lines, { w = 512, h = 256, bg = '#173049', fg = '#ffffff', border = '#e7cf7b', title } = {}) {
    return G.canvasTex(w, h, (g) => {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      if (border) { g.strokeStyle = border; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10); }
      g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
      let y = 0;
      const rows = lines.length + (title ? 1 : 0), step = h / (rows + 0.4);
      if (title) { g.font = `${Math.round(step * 0.62)}px ${G.FONT}`; g.fillStyle = border || fg; g.fillText(title, w / 2, step * 0.8); y = 1; g.fillStyle = fg; }
      g.font = `${Math.round(step * 0.5)}px ${G.FONT}`;
      lines.forEach((t, i) => g.fillText(t, w / 2, step * (0.8 + y + i)));
    });
  }
  G.textTex = textTex;

  /* ═══════════ 1. 강변 낚시터 (북쪽 강변, x=35) ═══════════ */
  {
    const x = 35;
    city.add(3.2, 0.3, 8.8, x, 0.2, 31.8, 0xb88a5a);                       // 나무 데크
    for (let z = 28.5; z <= 36; z += 1.1) city.add(3.2, 0.02, 0.08, x, 0.36, z, 0x9c7248);   // 판자 줄
    for (const sx of [-1.45, 1.45]) {
      for (const z of [30.5, 33, 36]) city.add(0.22, 1.4, 0.22, x + sx, 0.1, z, 0x7a5230);  // 말뚝
      city.add(0.1, 0.1, 5.6, x + sx, 1.05, 33.2, 0x8a6a48);                                // 난간
    }
    // 낚시 가게 매점
    city.add(2.4, 2.2, 1.8, 38.6, 1.1, 24.6, 0xe9d8b4).add(2.8, 0.2, 2.2, 38.6, 2.3, 24.8, 0x3f8fbf).add(1.2, 0.08, 0.1, 38.6, 1.3, 25.55, 0x4b3a2a);
    G.blockArea(38.6, 24.6, 2.4, 1.8);
    const sign = G.labelSprite('🎣 강변 낚시터', { scale: 1.05, bg: '#0f4a66', border: '#9fe3ff' });
    sign.position.set(x, 3.6, 29.4); scene.add(sign);
    G.waterWalks.push({ x, halfW: 1.0, minZ: 29, maxZ: 35.7 });
    G.decks.push({ minX: x - 1.6, maxX: x + 1.6, minZ: 27.4, maxZ: 36.2, y: 0.35 });
    shape(x, 32, 3.2, 8.8, '#d7b27e');
    area(x, 32, 3.2, 8.8, '낚시터');
    G.mapLabels.push({ text: '낚시터', x: 35, z: 22 });
  }

  /* ═══════════ 2. 선착장 (남쪽 강변, x=-40) ═══════════ */
  {
    const x = -40;
    city.add(3.2, 0.3, 8.8, x, 0.2, 44.6, 0xb88a5a);
    for (let z = 40.6; z <= 48.4; z += 1.1) city.add(3.2, 0.02, 0.08, x, 0.36, z, 0x9c7248);
    for (const sx of [-1.45, 1.45]) for (const z of [40.5, 43, 45.5]) city.add(0.22, 1.4, 0.22, x + sx, 0.1, z, 0x7a5230);
    // 매표소
