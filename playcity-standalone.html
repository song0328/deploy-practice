  const W = 34;                // 줄 하나의 폭 (화면 밖까지)
  const LOOP = 30;             // 차·통나무가 도는 길이
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(40, 1, 0.5, 120);
  scene.background = G.skyColor.clone();
  scene.fog = new T.Fog(G.skyColor.clone(), 34, 60);
  const hemi = new T.HemisphereLight(0xe6f2ff, 0x4a5a3a, 0.78);
  const sun = new T.DirectionalLight(0xffffff, 0.72);
  sun.castShadow = !G.LOW;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
  scene.add(hemi, sun, sun.target);

  /* ── 공유 모양 ── */
  const geo = (w, h, d) => G.boxGeo(w, h, d);
  const mesh = (g, color, cast = true) => { const m = new T.Mesh(g, G.mat(color)); m.castShadow = cast; m.receiveShadow = true; return m; };
  const CAR_COLORS = [0xd4574e, 0x4e7ad4, 0xd4b34e, 0xcccccc, 0x3ec48a, 0xa66bd6];
  function makeCar(kind, color) {
    const g = new T.Group();
    if (kind === 'bus') {
      g.add(mesh(geo(3.2, 1.05, 0.86), 0xffc83d)).children[0].position.y = 0.72;
      const win = mesh(geo(2.9, 0.34, 0.88), 0x2a3a4a); win.position.y = 0.95; g.add(win);
      const stripe = mesh(geo(3.22, 0.1, 0.88), 0x333333); stripe.position.y = 0.55; g.add(stripe);
      g.userData.len = 3.2;
    } else if (kind === 'truck') {
      const box = mesh(geo(2.2, 1.1, 0.86), 0xe9e4d8); box.position.set(-0.45, 0.78, 0); g.add(box);
      const cab = mesh(geo(0.9, 0.85, 0.84), color); cab.position.set(1.1, 0.65, 0); g.add(cab);
      const win = mesh(geo(0.3, 0.3, 0.86), 0x2a3a4a); win.position.set(1.35, 0.85, 0); g.add(win);
      g.userData.len = 3.1;
    } else {
      const body = mesh(geo(1.6, 0.5, 0.82), color); body.position.y = 0.5; g.add(body);
      const cab = mesh(geo(0.95, 0.36, 0.76), 0x252525); cab.position.set(-0.1, 0.92, 0); g.add(cab);
      g.userData.len = 1.6;
    }
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const wh = mesh(geo(0.34, 0.34, 0.12), 0x1b1b1b, false);
      wh.position.set(sx * (g.userData.len / 2 - 0.4), 0.2, sz * 0.42); g.add(wh);
    }
    return g;
  }
  function makeTrain() {
    const g = new T.Group();
    for (let i = 0; i < 4; i++) {
      const x = (i - 1.5) * 3.9;
      const c = mesh(geo(3.7, 1.35, 0.95), 0xeeeeee); c.position.set(x, 0.95, 0); g.add(c);
      const w = mesh(geo(3.4, 0.38, 0.97), 0x222222); w.position.set(x, 1.15, 0); g.add(w);
      const s = mesh(geo(3.72, 0.16, 0.97), 0x2FA7DA); s.position.set(x, 0.55, 0); g.add(s);
    }
    g.userData.len = 15.4;
    return g;
  }
  const logGeo = {}, lilyGeo = new T.CylinderGeometry(0.42, 0.42, 0.08, 10);
  const coinGeo = new T.CylinderGeometry(0.24, 0.24, 0.07, 14).rotateX(Math.PI / 2);
  const coinMat = new T.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x5a4300 });

  /* ── 주인공 새싹이 ── */
  const hero = G.makePerson({ shirt: 0x5ab0e0, pants: 0x34405a, hat: 0xffd23f, bag: 0xe8533f, hair: 0x3a2a1c });
  const HS = 0.5;
  hero.scale.setScalar(HS);
  const heroWrap = new T.Group(); heroWrap.add(hero); scene.add(heroWrap);
  // 까치
  const crow = new T.Group();
  crow.add(mesh(geo(0.5, 0.35, 0.9), 0x1b1f2a));
  const belly = mesh(geo(0.44, 0.2, 0.5), 0xf2f2f2); belly.position.set(0, -0.12, 0.05); crow.add(belly);
  const cw1 = mesh(geo(1.1, 0.06, 0.5), 0x1b1f2a); cw1.position.x = -0.7; crow.add(cw1);
  const cw2 = cw1.clone(); cw2.position.x = 0.7; crow.add(cw2);
  const beak = mesh(geo(0.12, 0.1, 0.25), 0x333333); beak.position.set(0, 0.02, -0.55); crow.add(beak);
  crow.visible = false; scene.add(crow);
  // 움직일 수 없는 바깥 칸은 살짝 어둡게
  const shadeMat = new T.MeshBasicMaterial({ color: 0x0a1523, transparent: true, opacity: 0.28, depthWrite: false });
  const shadeGeo = new T.PlaneGeometry(12, 46).rotateX(-Math.PI / 2);
  const shadeL = new T.Mesh(shadeGeo, shadeMat), shadeR = new T.Mesh(shadeGeo, shadeMat);
  shadeL.position.set(-CFG.half - 6.5, 0.03, 0); shadeR.position.set(CFG.half + 6.5, 0.03, 0);
  shadeL.renderOrder = shadeR.renderOrder = 5;
  scene.add(shadeL, shadeR);
  // 결승: 학교 정문
  const gate = new T.Group(); scene.add(gate);

  let lanes = [], st = null, ui = {};
  const wrapX = x => { const span = LOOP + 4; x = ((x + span / 2) % span + span) % span - span / 2; return x; };
  const _v = new T.Vector3();

  /* ═══════════ 줄 만들기 ═══════════ */
  function laneBase(row, type) {
    const group = new T.Group(); group.position.z = -row; scene.add(group);
    return { row, type, group, cars: [], logs: [], lilies: new Set(), block: new Set(), coin: null, dir: 1, speed: 0 };
  }
  function addStatic(lane, batch) { lane.static = batch.build(lane.group); if (lane.static) lane.static.castShadow = false; }

  function makeGrass(row, opts = {}) {
    const L = laneBase(row, 'grass'), b = new G.Batch();
    b.add(W, 0.3, 1, 0, -0.15, 0, row % 2 ? 0x93b572 : 0x8aad69);
    if (!opts.clear) {
      for (let c = -CFG.half - 6; c <= CFG.half + 6; c++) {
        const edge = Math.abs(c) > CFG.half;
        if (!edge && (Math.random() > 0.2 || (opts.keep && opts.keep.has(c)))) continue;
        if (edge && Math.random() > 0.55) continue;
        if (!edge) L.block.add(c);
        if (Math.random() < 0.72) {    // 네모 나무
          const s = G.rnd(0.85, 1.15);
          b.add(0.28, 0.5, 0.28, c, 0.25, 0, 0x7a5230);
          b.add(0.78 * s, 0.6 * s, 0.78 * s, c, 0.5 + 0.3 * s, 0, 0x3F9E4D);
          if (Math.random() < 0.6) b.add(0.52 * s, 0.4 * s, 0.52 * s, c, 0.8 + 0.6 * s, 0, 0x4AA858);
        } else b.add(0.7, 0.45, 0.6, c, 0.22, 0, 0x9aa3ab);   // 바위
      }
    }
    addStatic(L, b);
    return L;
  }
  function makeRoad(row, diff, opts = {}) {
    const L = laneBase(row, 'road'), b = new G.Batch();
    b.add(W, 0.3, 1, 0, -0.16, 0, 0x545C68);
    if (opts.edgeTop) for (let x = -16; x <= 16; x += 2) b.add(0.9, 0.02, 0.08, x, 0.0, -0.5, 0xE8EDF2);
    L.dir = opts.dir ?? (Math.random() < 0.5 ? 1 : -1);
    L.speed = opts.speed ?? G.lerp(2.2, 5.4, diff) * G.rnd(0.85, 1.2);
    L.crosswalk = opts.crosswalk || null;
    if (L.crosswalk) for (let x = -2.2; x <= 2.21; x += 0.55) b.add(0.3, 0.02, 0.86, x, 0.005, 0, 0xf4f1e6);
    // 차 배치 — 사이 간격을 넉넉히 둬서 늘 지나갈 틈이 있다
    const n = opts.count ?? (diff < 0.3 ? G.pick([1, 2, 2]) : G.pick([2, 2, 3]));
    const slot = (LOOP + 4) / n, start = G.rnd(-LOOP / 2, LOOP / 2);
    for (let i = 0; i < n; i++) {
      const kind = Math.random() < 0.18 ? 'bus' : Math.random() < 0.2 ? 'truck' : 'car';
      const car = makeCar(kind, G.pick(CAR_COLORS));
      if (L.dir < 0) car.rotation.y = Math.PI;
      car.position.x = wrapX(start + i * slot + G.rnd(0, Math.max(0, slot - car.userData.len - 3.4)));
      car.userData.v = L.speed;
      L.group.add(car); L.cars.push(car);
    }
    addStatic(L, b);
    return L;
  }
  function makeRiver(row, diff, dir) {
    const L = laneBase(row, 'river'), b = new G.Batch();
    b.add(W, 0.2, 1, 0, -0.35, 0, 0x3A9ECA);
    L.dir = dir;
    if (Math.random() < 0.22 && diff > 0.15) {
      // 연잎 줄: 움직이지 않는 발판
      L.type = 'lily';
      const cols = new Set();
      while (cols.size < 4) cols.add(Math.floor(G.rnd(-CFG.half, CFG.half + 1)));
      cols.forEach(c => { L.lilies.add(c); const m = mesh(lilyGeo, 0x4caf50, false); m.position.set(c, -0.18, 0); L.group.add(m); });
    } else {
      L.speed = G.lerp(1.5, 2.9, diff) * G.rnd(0.85, 1.15);
      const n = diff < 0.5 ? 4 : 3;
      const slot = (LOOP + 4) / n, start = G.rnd(-LOOP / 2, LOOP / 2);
      for (let i = 0; i < n; i++) {
        const len = Math.round(G.rnd(diff < 0.5 ? 2.6 : 2, diff < 0.5 ? 4.4 : 3.4));
        logGeo[len] = logGeo[len] || new T.BoxGeometry(len, 0.34, 0.78);
        const log = mesh(logGeo[len], 0x8b5a2b);
        log.position.set(wrapX(start + i * slot + G.rnd(0, Math.max(0, slot - len - 2))), -0.12, 0); log.userData.len = len;
        L.group.add(log); L.logs.push(log);
      }
    }
    addStatic(L, b);
    return L;
  }
  function makeRail(row, diff) {
    const L = laneBase(row, 'rail'), b = new G.Batch();
    b.add(W, 0.3, 1, 0, -0.15, 0, 0x8a7f72);
    for (let x = -16; x <= 16; x += 0.9) b.add(0.22, 0.06, 0.9, x, 0.03, 0, 0x6b4a2e);
    b.add(W, 0.08, 0.08, 0, 0.1, -0.28, 0xb8c0c8).add(W, 0.08, 0.08, 0, 0.1, 0.28, 0xb8c0c8);
    b.add(0.14, 1.6, 0.14, CFG.half + 1.6, 0.8, -0.45, 0x5d6670);
    addStatic(L, b);
    L.dir = Math.random() < 0.5 ? 1 : -1;
    L.train = makeTrain(); L.train.visible = false; L.group.add(L.train);
    L.lamp = new T.Mesh(geo(0.34, 0.34, 0.12), new T.MeshBasicMaterial({ color: 0x552222 }));
    L.lamp.position.set(CFG.half + 1.6, 1.7, -0.4); L.group.add(L.lamp);
    L.next = G.rnd(1.5, 4.5); L.warn = 1.35; L.state = 'idle'; L.tx = 0;
    L.speed = G.lerp(22, 30, diff);
    return L;
  }
  function makeFinish(row) {
    const L = laneBase(row, 'finish'), b = new G.Batch();
    for (let i = 0; i < 6; i++) b.add(W, 0.3, 1, 0, -0.15, -i, 0xd2b48c);
    addStatic(L, b);
    gate.position.z = -row;
    return L;
  }
  function buildGate() {
    const b = new G.Batch();
    b.add(0.8, 2.2, 0.8, -CFG.half - 0.9, 1.1, 0.2, 0xc8553d).add(0.8, 2.2, 0.8, CFG.half + 0.9, 1.1, 0.2, 0xc8553d);
    b.add(0.5, 0.5, 0.5, -CFG.half - 0.9, 2.45, 0.2, 0xffd23f).add(0.5, 0.5, 0.5, CFG.half + 0.9, 2.45, 0.2, 0xffd23f);
    for (let x = -16; x <= 16; x += 1.2) if (Math.abs(x) > CFG.half + 1.4) b.add(0.1, 1, 0.1, x, 0.5, 0.2, 0x5f7f6a);
    b.add(32, 0.08, 0.08, 0, 0.9, 0.2, 0x5f7f6a);
    b.add(9, 4, 5, -3, 2, -4.5, 0xf3e7cf).add(9.4, 0.4, 5.4, -3, 4.2, -4.5, 0x9a6b57).add(9.2, 0.3, 0.1, -3, 2.2, -1.95, 0xc8553d);
    b.build(gate);
    const sign = G.labelSprite('🏫 놀이초등학교 정문', { scale: 0.62, bg: '#7a2f22', border: '#ffd23f' });
    sign.position.set(0, 1.6, -2.2); gate.add(sign);
  }
  buildGate();

  /** 줄 전체 설계: 난이도가 점점 올라간다 */
  function buildLevel() {
    lanes.forEach(L => { scene.remove(L.group); L.static?.geometry.dispose(); });
    lanes = [];
    const N = CFG.rows;
    const add = L => { lanes[L.row] = L; };
    for (let r = -6; r <= 2; r++) add(makeGrass(r, { clear: r >= 0 }));
    let r = 3, lastType = 'grass', crosswalks = 0;
    while (r < N) {
      const diff = r / N;
      const roll = Math.random();
      let kind;
      if (r > 8 && crosswalks < 2 && r > N * (crosswalks ? 0.62 : 0.25) && lastType !== 'cross') kind = 'cross';
      else if (roll < 0.42) kind = 'road';
      else if (roll < 0.62 && r > 6) kind = 'river';
      else if (roll < 0.74 && r > 10 && lastType !== 'rail') kind = 'rail';
      else kind = 'grass';
      if (kind === 'road') {
        const n = Math.min(N - r, Math.floor(G.rnd(1, 2 + diff * 3)));
        for (let i = 0; i < n; i++) add(makeRoad(r++, diff, { edgeTop: i < n - 1 }));
      } else if (kind === 'cross') {
        // 횡단보도: 2차선, 신호등 공유. 빨간불(보행자)이면 차가 달리고, 초록불이면 정지선 앞에 선다
        crosswalks++;
        const sig = { phase: 'car', t: G.rnd(0, 2), rows: [r, r + 1], pole: null };
        st.signals.push(sig);
        const sp = G.lerp(3.8, 5.8, diff);
        add(makeRoad(r++, diff, { crosswalk: sig, dir: 1, speed: sp, count: 3, edgeTop: true }));
        add(makeRoad(r++, diff, { crosswalk: sig, dir: -1, speed: sp, count: 3 }));
        sig.pole = makePole(lanes[r - 1]);
      } else if (kind === 'river') {
        const n = Math.min(N - r, Math.floor(G.rnd(1, 2.4 + diff * 1.6)));
        let dir = Math.random() < 0.5 ? 1 : -1;
        for (let i = 0; i < n; i++) { add(makeRiver(r++, diff, dir)); dir = -dir; }
      } else if (kind === 'rail') add(makeRail(r++, diff));
      else {
        const n = Math.floor(G.rnd(1, 3));
        for (let i = 0; i < n && r < N; i++) add(makeGrass(r++));
      }
      lastType = kind;
      if (r < N && kind !== 'grass' && Math.random() < 0.55) add(makeGrass(r++));
    }
    add(makeFinish(N));
    // 연속된 풀밭 줄끼리 지나갈 길(같은 칸이 비어 있는 곳)이 꼭 있게 한다
    for (let i = 1; i < N; i++) {
      const a = lanes[i - 1], b = lanes[i];
      if (a.type === 'grass' && b.type === 'grass') {
        let open = 0;
        for (let c = -CFG.half; c <= CFG.half; c++) if (!a.block.has(c) && !b.block.has(c)) open++;
        if (open < 2) { b.block.clear(); rebuildGrass(b); }
      }
    }
    // 스티커(동전)
    for (let i = 4; i < N; i++) {
      const L = lanes[i];
      if ((L.type === 'grass' || L.type === 'road') && Math.random() < 0.3) {
        let c; let tries = 0;
        do { c = Math.floor(G.rnd(-CFG.half, CFG.half + 1)); } while (L.block.has(c) && ++tries < 10);
        if (L.block.has(c)) continue;
        const m = new T.Mesh(coinGeo, coinMat); m.position.set(c, 0.45, 0); m.castShadow = true;
        L.group.add(m); L.coin = { c, m };
      }
    }
  }
  function rebuildGrass(L) {
    L.group.remove(L.static); L.static.geometry.dispose();
    const b = new G.Batch();
    b.add(W, 0.3, 1, 0, -0.15, 0, L.row % 2 ? 0x93b572 : 0x8aad69);
    addStatic(L, b);
  }
  function makePole(L) {
    const pole = new T.Group();
    pole.add(mesh(geo(0.14, 2.3, 0.14), 0x5d6670)).children[0].position.y = 1.15;
    const head = mesh(geo(0.5, 0.9, 0.3), 0x2b3138); head.position.y = 2.3; pole.add(head);
    const red = new T.Mesh(geo(0.34, 0.3, 0.05), new T.MeshBasicMaterial({ color: 0xff4a3d }));
    red.position.set(0, 2.5, 0.16); pole.add(red);
    const green = new T.Mesh(geo(0.34, 0.3, 0.05), new T.MeshBasicMaterial({ color: 0x1a4a2a }));
    green.position.set(0, 2.1, 0.16); pole.add(green);
    pole.position.set(-CFG.half - 1.4, 0, -0.5);
    L.group.add(pole);
    return { pole, red: red.material, green: green.material };
  }

  /* ═══════════ 조작 ═══════════ */
  function tryMove(dx, dz) {
    if (!st || st.dead || st.won || G.play.state !== 'play') return;
    if (st.hopT < CFG.hop) { st.queue = [dx, dz]; return; }
    const fromLane = lanes[st.row];
    let tx = st.x + dx, tr = st.row + dz;
    if (tr < -3 || tr > CFG.rows) return;
    const toLane = lanes[tr];
    const onWater = toLane.type === 'river';
    if (!onWater) tx = Math.round(tx);
    if (tx < -CFG.half - 0.001 || tx > CFG.half + 0.001) { if (fromLane.type !== 'river') return; tx = G.clamp(tx, -CFG.half, CFG.half); }
    if (toLane.type === 'grass' && toLane.block.has(Math.round(tx))) { st.bump = 0.12; G.sfx.play('step'); face(dx, dz); return; }
    face(dx, dz);
    st.ride = null;
    st.fx = st.x; st.fz = st.row; st.x = tx; st.row = tr; st.hopT = 0;
    st.lastMove = st.t; st.idle = 0;
    if (dz > 0 && tr > st.best) st.best = tr;
    G.sfx.play('hop');
  }
  function face(dx, dz) { hero.rotation.y = dx > 0 ? Math.PI / 2 : dx < 0 ? -Math.PI / 2 : dz > 0 ? Math.PI : 0; }

  function land() {
    const L = lanes[st.row];
    if (L.type === 'river') {
      const log = L.logs.find(g => Math.abs(g.position.x - st.x) < g.userData.len / 2 + 0.15);
      if (log) { st.ride = log; st.rideOff = G.clamp(st.x - log.position.x, -log.userData.len / 2 + 0.3, log.userData.len / 2 - 0.3); return; }
      return die('water');
    }
    if (L.type === 'lily') {
      const c = Math.round(st.x);
      if (L.lilies.has(c)) { st.x = c; return; }
      return die('water');
    }
    if (L.coin && Math.round(st.x) === L.coin.c && L.coin.m.visible) {
      L.coin.m.visible = false; st.coins++; G.sfx.play('coin');
    }
    // 횡단보도 착한 건너기: 보행자 초록불에 줄무늬 위로 두 차선을 다 건넜으면 보너스
    if (L.crosswalk) {
      const sig = L.crosswalk, inZebra = Math.abs(st.x) <= 2.2, green = sig.phase === 'walk';
      if (st.row === sig.rows[0]) sig.good = inZebra && green;
      else if (st.row === sig.rows[1] && sig.good && inZebra && green && !sig.paid) { sig.paid = true; st.bonus += 5; G.ctx.flash('🚸 신호 지켜 건넜어요 +5', 'good', 1100); G.sfx.play('perfect'); }
    }
    if (L.type === 'finish') win();
  }

  function die(kind) {
    if (st.dead || st.won) return;
    st.dead = kind; st.deadT = 0;
    const msg = { car: '쾅! 차에 부딪혔어요', train: '열차는 정말 빨라요!', water: '풍덩! 강에 빠졌어요', drift: '통나무와 함께 떠내려갔어요', crow: '까치가 가방을 물고 갔어요!' }[kind];
    G.sfx.play(kind === 'water' || kind === 'drift' ? 'splash' : kind === 'crow' ? 'alarm' : 'crash');
    G.ctx.flash(msg, 'bad', 1500);
    if (kind === 'crow') { crow.visible = true; crow.position.set(st.x + 8, 7, -st.row + 4); }
    st.deadMsg = msg;
  }
  function win() {
    st.won = true; st.wonT = 0;
    G.sfx.play('win');
    G.ctx.flash('🏫 등교 성공!', 'gold', 1600);
  }
  function score() { return st.best + st.coins * 2 + st.bonus + (st.won ? 50 : 0); }
  function endRun(ok, why) {
    if (!st || G.play.state !== 'play') return;
    const sc = score();
    G.ctx.finish({
      success: ok, record: sc, big: `${sc}점`,
      progress: ok ? 1 : st.best / CFG.rows,   // 못 가도 간 칸수만큼
      title: ok ? '등교 성공! 🏫' : '다시 도전!',
      lines: [
        ok ? `${CFG.rows}칸을 건너 정문에 도착했어요 (${st.t.toFixed(1)}초).` : `${why} — ${st.best}/${CFG.rows}칸까지 갔어요.`,
        `⭐ 스티커 ${st.coins}개 ×2 · 🚸 신호 보너스 ${st.bonus}${ok ? ' · 도착 +50' : ''}`,
        '팁: 차 사이 틈을 보고 한 박자 쉬었다 가요. 기찻길 빨간불은 곧 열차!',
      ],
    });
  }

  /* ═══════════ 화면 버튼·밀기 ═══════════ */
  function buildUi(ctx) {
    const wrap = document.createElement('div');
    wrap.id = 'crossUi'; wrap.hidden = true;
    wrap.innerHTML = `<div class="czone"></div>
      <div class="cpad"><button class="tbtn" data-m="0,1" aria-label="앞으로">▲</button><button class="tbtn" data-m="-1,0" aria-label="왼쪽">◀</button><button class="tbtn" data-m="0,-1" aria-label="뒤로">▼</button><button class="tbtn" data-m="1,0" aria-label="오른쪽">▶</button></div>
      <div class="cprog"><i></i><b>🏫</b></div>`;
    const css = document.createElement('style');
    css.textContent = `
      #crossUi .czone{position:fixed; inset:0; z-index:30; touch-action:none;}
      #crossUi .cpad{position:fixed; right:22px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:31; display:grid; grid-template-columns:repeat(3,62px); grid-template-rows:repeat(2,62px); gap:7px;}
      #crossUi .cpad .tbtn{position:static; font-size:22px;}
      #crossUi .cpad [data-m="0,1"]{grid-column:2; grid-row:1;} #crossUi .cpad [data-m="-1,0"]{grid-column:1; grid-row:2;}
      #crossUi .cpad [data-m="0,-1"]{grid-column:2; grid-row:2;} #crossUi .cpad [data-m="1,0"]{grid-column:3; grid-row:2;}
      #crossUi .cprog{position:fixed; left:16px; top:50%; transform:translateY(-50%); z-index:31; width:12px; height:46vh; border-radius:8px; background:rgba(10,20,36,.7); border:2px solid #2d4561; pointer-events:none;}
      #crossUi .cprog i{position:absolute; left:0; right:0; bottom:0; height:0; border-radius:6px; background:linear-gradient(#ffd23f,#3ed47e);}
      #crossUi .cprog b{position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:20px; font-weight:400;}
      body:not(.touch) #crossUi .cpad{opacity:.55; transform:scale(.8); transform-origin:bottom right;}`;
    wrap.appendChild(css);
    ctx.layer.appendChild(wrap);
    ui = { wrap, prog: wrap.querySelector('.cprog i') };
    wrap.querySelectorAll('[data-m]').forEach(bt => bt.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const [dx, dz] = bt.dataset.m.split(',').map(Number); tryMove(dx, dz);
    }));
    // 화면 밀기: 톡 = 앞으로, 좌우·아래로 밀면 그쪽으로
    const zone = wrap.querySelector('.czone');
    let sx = 0, sy = 0, down = false;
    zone.addEventListener('pointerdown', e => { e.preventDefault(); down = true; sx = e.clientX; sy = e.clientY; });
    zone.addEventListener('pointerup', e => {
      if (!down) return; down = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.hypot(dx, dy) < 24) tryMove(0, 1);
      else if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0);
      else tryMove(0, dy > 0 ? -1 : 1);
    });
    zone.addEventListener('pointercancel', () => { down = false; });
  }

  /* ═══════════ 게임 등록 ═══════════ */
  G.registerGame({
    id: 'crossing', name: '등굣길 건너기', icon: '🚸', color: '#f2a93b',
    place: '학교 앞 횡단보도 광장 (다리 건너 동쪽)',
    tagline: '차·열차·강물을 피해 한 칸씩! 학교 정문까지 무사히 등교해요.',
    rules: [
      `<b>${CFG.rows}칸</b> 앞의 <b>학교 정문</b>에 닿으면 성공`,
      '차·버스·열차에 닿거나 강물에 빠지면 실패 — 강은 <b>통나무·연잎</b>만 밟아요',
      '기찻길 <b>빨간불</b>이 깜빡이면 곧 열차! 🚸 횡단보도는 <b>초록불</b>에 줄무늬 위로 건너면 +5',
      `너무 오래 머뭇거리거나 화면 뒤로 처지면 <b>까치</b>가 가방을 물어가요`,
      '⭐ 스티커 = 2점, 한 칸 전진 = 1점, 도착 = 50점',
    ],
    controlsKey: '방향키·WASD 한 번 = 한 칸 · Esc 잠깐 멈춤',
    controlsTouch: '화면 톡 = 앞으로 · 좌우·아래로 밀기 · 오른쪽 아래 버튼',
    format: v => `${v}점`,
    world: 'own', scene, camera,
    debug: () => ({ st, lanes }),
    init(ctx) { buildUi(ctx); G.addCamera(camera); },
    enter(ctx) { ui.wrap.hidden = false; st = null; newRun(); ctx.hint(''); },
    start(ctx) {
      newRun();
      ctx.hint(G.touch ? '화면을 톡 치면 앞으로! 밀면 옆·뒤로' : '↑ 앞으로 · ← → 옆으로 · ↓ 뒤로');
      setTimeout(() => { if (G.play.current?.id === 'crossing') ctx.hint(''); }, 3500);
    },
    update(dt, now, ctx) { step(dt, now, ctx); },
    onKey(e, down) {
      if (!down || e.repeat) return;
      const m = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], Space: [0, 1] }[e.code];
      if (m) tryMove(m[0], m[1]);
    },
    exit() { ui.wrap.hidden = true; st = null; },
  });

  function newRun() {
    st = { x: 0, row: 0, fx: 0, fz: 0, hopT: 1, queue: null, best: 0, coins: 0, bonus: 0, t: 0, idle: 0, lastMove: 0,
      dead: null, won: false, deadT: 0, ride: null, rideOff: 0, bump: 0, camRow: -1, camX: 0, signals: [] };
    buildLevel();
    crow.visible = false;
    G.resetPose(hero); hero.rotation.y = Math.PI; hero.scale.setScalar(HS); heroWrap.position.set(0, 0, 0); heroWrap.rotation.set(0, 0, 0);
    placeCamera(1, true);
    stats();
  }

  function stats() {
    G.ctx.setStats([
      { label: '전진', value: `${st.best}/${CFG.rows}` },
      { label: '⭐ 스티커', value: st.coins },
      { label: '점수', value: score() },
    ]);
    ui.prog.style.height = (st.best / CFG.rows * 100).toFixed(1) + '%';
  }

  function placeCamera(dt, snap) {
    const targetX = G.clamp(heroWrap.position.x * 0.45, -2, 2);
    const k = snap ? 1 : 1 - Math.exp(-dt * 5);
    st.camX += (targetX - st.camX) * k;
    const z = -st.camRow;
    const tall = camera.aspect < 1;
    const fov = tall ? 50 : 38;
    if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.position.set(st.camX + 2.6, tall ? 12.5 : 9.6, z + (tall ? 7.4 : 7.2));
    _v.set(st.camX + 0.2, 0, z - (tall ? 4 : 2.6));
    shadeL.position.z = shadeR.position.z = z - 6;
    camera.lookAt(_v);
    sun.position.set(camera.position.x + 6, 16, z + 6);
    sun.target.position.set(camera.position.x, 0, z - 3);
  }

  const heroBox = 0.3;
  function step(dt, now, ctx) {
    if (!st) return;
    st.t += dt;
    const diff = G.clamp(st.best / CFG.rows, 0, 1);
    // ── 신호등 ──
    for (const sig of st.signals) {
      sig.t += dt;
      const len = sig.phase === 'car' ? CFG.signal.car : CFG.signal.walk;
      if (sig.t >= len) { sig.t = 0; sig.phase = sig.phase === 'car' ? 'walk' : 'car'; sig.paid = false; }
      const walk = sig.phase === 'walk', blink = walk && sig.t > len - 0.9 && Math.floor(sig.t * 6) % 2;
      sig.pole.red.color.setHex(walk ? 0x5a1a1a : 0xff4a3d);
      sig.pole.green.color.setHex(walk && !blink ? 0x3dfa86 : 0x1a4a2a);
    }
    // ── 보이는 줄만 움직인다 ──
    const lo = Math.floor(st.camRow) - 7, hi = Math.floor(st.camRow) + 24;
    for (let r = -6; r <= CFG.rows; r++) {
      const L = lanes[r]; if (!L) continue;
      const vis = r >= lo && r <= hi;
      L.group.visible = vis;
      if (!vis) continue;
      if (L.type === 'road') {
        const sig = L.crosswalk;
        for (const car of L.cars) {
          let v = L.speed;
          if (sig) {
            // 보행 신호면 정지선(줄무늬 앞) 앞에서 멈추고, 앞차와도 간격을 둔다
            const front = car.position.x * L.dir + car.userData.len / 2;
            const stopAt = -2.6;
            let limit = Infinity;
            if (sig.phase === 'walk' && front <= stopAt + 0.05) limit = stopAt - front;
            for (const o of L.cars) {
              if (o === car) continue;
              const gap = (o.position.x - car.position.x) * L.dir - (o.userData.len + car.userData.len) / 2;
              if (gap > -0.1 && gap < limit + 0.8) limit = Math.min(limit, gap - 0.7);
            }
            const want = limit === Infinity ? L.speed : G.clamp(limit * 3, 0, L.speed);
            car.userData.v += (want - car.userData.v) * Math.min(1, dt * 6);
            v = car.userData.v;
          }
          car.position.x += v * L.dir * dt;
          if (car.position.x > LOOP / 2 + 2) car.position.x -= LOOP + 4;
          if (car.position.x < -LOOP / 2 - 2) car.position.x += LOOP + 4;
        }
      } else if (L.type === 'river') {
        for (const log of L.logs) {
          log.position.x += L.speed * L.dir * dt;
          if (log.position.x > LOOP / 2 + 2) log.position.x -= LOOP + 4;
          if (log.position.x < -LOOP / 2 - 2) log.position.x += LOOP + 4;
          log.position.y = -0.12 + Math.sin(now * 0.004 + log.position.x) * 0.03;
        }
      } else if (L.type === 'rail') {
        L.next -= dt;
        if (L.state === 'idle' && L.next <= L.warn) { L.state = 'warn'; if (Math.abs(L.row - st.row) < 8) G.sfx.play('alarm'); }
        if (L.state === 'warn') {
          L.lamp.material.color.setHex(Math.floor(now / 160) % 2 ? 0xff3322 : 0x552222);
          if (L.next <= 0) { L.state = 'pass'; L.tx = -L.dir * 26; L.train.visible = true; L.train.rotation.y = L.dir > 0 ? 0 : Math.PI; }
        }
        if (L.state === 'pass') {
          L.tx += L.speed * L.dir * dt;
          L.train.position.x = L.tx;
          L.lamp.material.color.setHex(0xff3322);
          if (L.tx * L.dir > 30) { L.state = 'idle'; L.train.visible = false; L.next = G.rnd(3, 7.5) * (1.1 - diff * 0.4); L.lamp.material.color.setHex(0x552222); }
        }
      }
      if (L.coin && L.coin.m.visible) L.coin.m.rotation.y += dt * 3;
    }
    // ── 주인공 ──
    if (!st.dead) {
      if (st.hopT < CFG.hop) {
        st.hopT += dt;
        const k = Math.min(1, st.hopT / CFG.hop);
        const L = lanes[st.row];
        const baseY = L.type === 'river' || L.type === 'lily' ? 0.05 : 0;
        heroWrap.position.x = G.lerp(st.fx, st.x, k);
        heroWrap.position.z = -G.lerp(st.fz, st.row, k);
        heroWrap.position.y = baseY + Math.sin(k * Math.PI) * 0.45;
        hero.scale.set(HS, HS * (1 + Math.sin(k * Math.PI) * 0.15), HS);
        if (k >= 1) { hero.scale.setScalar(HS); land(); if (st.queue && !st.dead) { const q = st.queue; st.queue = null; tryMove(q[0], q[1]); } }
      } else if (st.ride) {
        st.x = st.ride.position.x + st.rideOff;
        heroWrap.position.x = st.x;
        heroWrap.position.y = st.ride.position.y + 0.17;
        if (Math.abs(st.x) > CFG.half + 1.2) die('drift');
      }
      if (st.bump > 0) { st.bump -= dt; hero.position.z = Math.sin(st.bump * 40) * 0.08; } else hero.position.z = 0;
      // 충돌 — 지금 서 있는(뛰는 중이면 도착할) 줄의 차·열차
      const rowNow = st.hopT < CFG.hop * 0.5 ? st.fz : st.row;
      const L = lanes[rowNow];
      if (L && L.type === 'road') {
        for (const car of L.cars) if (Math.abs(car.position.x - heroWrap.position.x) < car.userData.len / 2 * 0.92 + heroBox) { die('car'); break; }
      } else if (L && L.type === 'rail' && L.state === 'pass') {
        if (Math.abs(heroWrap.position.x - L.tx) < L.train.userData.len / 2 + heroBox) die('train');
      }
      // 까치
      st.idle += dt;
      if (st.hopT >= CFG.hop && (st.idle > CFG.idleCrow || st.row < st.camRow - CFG.behindCrow) && !st.won) die('crow');
    } else {
      st.deadT += dt;
      if (st.deadT > (st.dead === 'crow' ? 1.5 : 1.2)) return endRun(false, st.deadMsg);
      if (st.dead === 'car' || st.dead === 'train') { hero.scale.set(HS * 1.2, HS * Math.max(0.12, 1 - st.deadT * 8), HS * 1.2); }
      else if (st.dead === 'water' || st.dead === 'drift') heroWrap.position.y -= dt * 1.5;
      else if (st.dead === 'crow') {
        _v.set(heroWrap.position.x, 0.9, heroWrap.position.z);
        crow.position.lerp(_v, Math.min(1, dt * 6));
        if (st.deadT > 0.55) { heroWrap.position.y += dt * 6; heroWrap.position.x -= dt * 4; crow.position.set(heroWrap.position.x, heroWrap.position.y + 0.9, heroWrap.position.z); }
        cw1.rotation.z = Math.sin(now * 0.03) * 0.6; cw2.rotation.z = -cw1.rotation.z;
      }
    }
    if (st.won) { st.wonT += dt; hero.rotation.y = Math.PI + st.wonT * 8; if (st.wonT > 1.3) return endRun(true); }
    // ── 화면은 천천히 앞으로 (머물러 있으면 뒤처진다) ──
    const scroll = G.lerp(CFG.scroll[0], CFG.scroll[1], diff);
    if (!st.won && !st.dead && st.best > 0) st.camRow += scroll * dt;
    st.camRow += (Math.max(st.camRow, heroWrap.position.z * -1 - 1.2) - st.camRow) * Math.min(1, dt * 4);
    placeCamera(dt, false);
    if (ctx.hudDue(dt)) stats();
  }
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   💃 선생님 몰래 춤추기 — 놀이초등학교 교실 맨 뒷자리 (도시 씬 안의 진짜 교실)
   · 누르고 있는 동안 춤 → 점수. 오래 출수록 배수(×1~×4)가 오른다
   · 선생님은 칠판에 쓰다가 「🤨 멈칫」 신호 뒤에 뒤돌아본다. 보는 동안 춤추면 발각!
   · 춤추는 중 머리 위에 뜨는 화살표를 원이 닫힐 때 맞춰 누르면 스텝 보너스
   규칙 숫자는 CFG에서 고친다. 교실 배치는 places.js (G.classroom)
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const T = THREE, $ = G.$;
  const CFG = {
    time: 60, goal: 700, lives: 3,
    rate: 14,                         // 춤 점수 (/초, 배수 곱하기 전)
    multAt: [0, 1.5, 3.2, 5.5],        // 연속으로 춘 시간 → ×1, ×2, ×3, ×4
    bpm: 120,
    write: [2.2, 4.6], warn: [0.55, 1.05], watch: [1.3, 2.6],   // 선생님 행동 시간(초) — 시간이 지날수록 짧아진다
    grace: 0.14,                      // 돌아본 뒤 멈출 수 있는 여유
    fakeChance: 0.28,
  };
  const CR = () => G.classroom;
  const TEACH = { x: 25.5, z: 74.5 };
  const ME = { x: 42.55, z: 73.45 };

  /* ── 교실 사람들: 탐험 중에도 교실에 앉아 있다 ── */
  const npcRoot = new T.Group(); G.scene.add(npcRoot);
  const teacher = G.makePerson({ shirt: 0x8e6bbf, pants: 0x3a3450, skirt: true, long: true, glasses: true, hair: 0x3b2618, skin: 0xf0c49a });
  teacher.position.set(TEACH.x, 0, TEACH.z); teacher.rotation.y = -Math.PI / 2;
  teacher.scale.setScalar(1.18);
  npcRoot.add(teacher);
  const tRig = teacher.userData.rig;
  const chalkLine = new T.Mesh(G.boxGeo(0.04, 0.05, 1), G.mat(0xf6f6f6));
  chalkLine.position.set(24.33, 2.1, 72.2); npcRoot.add(chalkLine);
  const kids = [];
  const KID_LOOK = [[0xe8533f, 0x2b2118, 0], [0x3f8fbf, 0x5a3a22, 1], [0x3ec48a, 0x1b1b1b, 0], [0xffc83d, 0x2b2118, 1], [0xa66bd6, 0x3b2618, 1],
    [0x4e7ad4, 0x1b1b1b, 0], [0xf29fb8, 0x2b2118, 1], [0x6bbfae, 0x3b2618, 0], [0xd4b34e, 0x1b1b1b, 1], [0x9aa3ab, 0x2b2118, 0], [0xe0784a, 0x5a3a22, 1]];
  (function seatKids() {
    let i = 0;
    for (const d of CR().desks) {
      if (d.x === CR().playerDesk.x && d.z === CR().playerDesk.z) continue;
      const [shirt, hair, long] = KID_LOOK[i++ % KID_LOOK.length];
      const k = G.makeKid({ shirt, hair, long });
      k.position.set(d.x + 0.85, 0, d.z); k.rotation.y = -Math.PI / 2;
      k.userData.phase = Math.random() * 10;
      npcRoot.add(k); kids.push(k);
    }
  })();
  // 선생님 시선 (보는 동안 바닥에 빨간 부채꼴)
  const coneGeo = new T.BufferGeometry();
  coneGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([26.2, 0.13, 74.5, 46.5, 0.13, 70.9, 46.5, 0.13, 78.1]), 3));
  const coneMat = new T.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0, depthWrite: false, side: T.DoubleSide });
  const cone = new T.Mesh(coneGeo, coneMat); cone.renderOrder = 3; npcRoot.add(cone);

  // 탐험 중 선생님: 칠판에 글씨 쓰는 시늉 (학교 근처에 있을 때만)
  let ambT = 0;
  // 교실은 지붕 아래라 밖에서는 안 보인다 → 카메라가 학교 안에 있을 때만 그린다 (그리기 횟수 절약)
  const S = G.SCHOOL;
  G.ambient.push((dt, now) => {
    if (G.play.current && G.play.current.id === 'dance') { npcRoot.visible = true; return; }
    const c = G.camera.position;
    const inside = c.x > S.minX - 1 && c.x < S.maxX + 1 && c.z > S.minZ - 3 && c.z < S.maxZ + 1 && c.y < S.wallH;
    npcRoot.visible = inside;
    if (!inside) return;
    ambT += dt;
    tRig.armR.rotation.x = -2.2 + Math.sin(ambT * 5) * 0.25;
    tRig.armR.rotation.z = Math.sin(ambT * 3) * 0.2;
    for (const k of kids) k.userData.rig.head.rotation.x = Math.sin(ambT * 0.8 + k.userData.phase) * 0.12 + 0.15;
  });

  /* ── 나 (게임 중에만 보인다) ── */
  const me = G.makePerson({ shirt: 0xff7eb6, pants: 0x34405a, hair: 0x3a2a1c });
  me.position.set(ME.x, 0, ME.z); me.rotation.y = -Math.PI / 2; me.visible = false;
  npcRoot.add(me);
  const mRig = me.userData.rig;
  const meTag = G.labelSprite('나', { scale: 0.24, w: 96, h: 64, bg: '#ff7eb6', border: '#ffffff', fg: '#3a0a22', font: 34 });
  meTag.position.set(0, 2.75, 0); me.add(meTag);

  let st = null, ui = {};
  const camPos = new T.Vector3(46.6, 3.3, 72.0), camLook = new T.Vector3(29, 1.9, 74.9);
  const FOV = 38;
  // 세로 화면(폰)은 가로 시야가 좁아 내 캐릭터가 화면 밖으로 나간다 → 가로 시야를 PC와 비슷하게 맞춘다
  function danceFov() {
    const a = G.camera.aspect, hWant = 2 * Math.atan(Math.tan(FOV * Math.PI / 360) * 1.6);
    if (a >= 1.6) return FOV;
    return Math.min(78, 2 * Math.atan(Math.tan(hWant / 2) / a) * 180 / Math.PI);
  }
  const _v = new T.Vector3();
  const ARROWS = { left: '◀', right: '▶', up: '▲', down: '▼' };
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };

  function buildUi(ctx) {
    const wrap = document.createElement('div');
    wrap.id = 'danceUi'; wrap.hidden = true;
    wrap.innerHTML = `
      <div class="dzone"></div>
      <div class="dstatus" id="dStatus"></div>
      <div class="dmult" id="dMult"><b>×1</b><span>연속 춤</span><i><em></em></i></div>
      <div class="dstep" id="dStep" hidden><span class="ring"></span><span class="arr"></span></div>
      <div class="dhearts" id="dHearts"></div>
      <button class="tbtn dance" id="dBtn" type="button">💃<br>꾹 누르면 춤</button>
      <div class="dpad" id="dPad"><button class="tbtn" data-a="up">▲</button><button class="tbtn" data-a="left">◀</button><button class="tbtn" data-a="down">▼</button><button class="tbtn" data-a="right">▶</button></div>`;
    const css = document.createElement('style');
    css.textContent = `
      #danceUi .dzone{position:fixed; inset:0; z-index:30; touch-action:none;}
      #danceUi .dstatus{position:fixed; top:72px; left:50%; transform:translateX(-50%); z-index:32; padding:9px 20px; border-radius:99px; font:19px 'Jua',sans-serif; white-space:nowrap; pointer-events:none; border:2px solid; box-shadow:0 6px 20px rgba(0,0,0,.3); transition:background .15s, color .15s;}
      #danceUi .dstatus.safe{background:#123a24; color:#aef7c9; border-color:#3ed47e;}
      #danceUi .dstatus.warn{background:#4a3a08; color:#ffe27a; border-color:#ffd23f; animation:dwarn .18s ease infinite alternate;}
      #danceUi .dstatus.watch{background:#5a1410; color:#ffd0cb; border-color:#ff5a4f; transform:translateX(-50%) scale(1.08);}
      @keyframes dwarn{to{transform:translateX(-50%) scale(1.06);}}
      #danceUi .dmult{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:32; display:flex; align-items:center; gap:10px; background:rgba(13,24,41,.86); border:1px solid #263D5F; border-radius:16px; padding:8px 14px; pointer-events:none;}
      #danceUi .dmult b{font:28px 'Jua',sans-serif; color:#ffd23f; min-width:48px; text-align:center;}
      #danceUi .dmult span{font-size:12px; color:#8FA6C8;}
      #danceUi .dmult i{display:block; width:140px; height:10px; border-radius:99px; background:#0a1424; overflow:hidden;}
      #danceUi .dmult em{display:block; height:100%; width:0; background:linear-gradient(90deg,#ff7eb6,#ffd23f);}
      #danceUi .dmult.on{border-color:#ff7eb6; box-shadow:0 0 18px rgba(255,126,182,.45);}
      #danceUi .dstep{position:fixed; z-index:32; width:84px; height:84px; transform:translate(-50%,-50%); pointer-events:none;}
      #danceUi .dstep .ring{position:absolute; inset:0; border:4px solid #fff; border-radius:50%; transform:scale(2); opacity:.9;}
      #danceUi .dstep .arr{position:absolute; inset:14px; border-radius:50%; background:#ff7eb6; color:#fff; font:30px/56px 'Jua',sans-serif; text-align:center; box-shadow:0 4px 0 #a0336a;}
      #danceUi .dhearts{position:fixed; top:72px; right:18px; z-index:32; font-size:24px; letter-spacing:2px; pointer-events:none;}
      #danceUi .tbtn.dance{left:22px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:128px; height:128px; border-radius:50%; font-size:17px; line-height:1.3; border-width:2px; border-color:#ff7eb6;}
      #danceUi .tbtn.dance.on{background:#6b2350;}
      #danceUi .dpad{position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:31; display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px); gap:6px;}
      #danceUi .dpad .tbtn{position:static; font-size:22px;}
      #danceUi .dpad [data-a="up"]{grid-column:2; grid-row:1;} #danceUi .dpad [data-a="left"]{grid-column:1; grid-row:2;}
      #danceUi .dpad [data-a="down"]{grid-column:2; grid-row:2;} #danceUi .dpad [data-a="right"]{grid-column:3; grid-row:2;}
      body:not(.touch) #danceUi .tbtn.dance, body:not(.touch) #danceUi .dpad{display:none;}
      @media (max-width:820px){ #danceUi .dstatus{top:58px; font-size:15px; padding:7px 14px;} #danceUi .dhearts{top:auto; right:auto; left:26px; bottom:calc(160px + env(safe-area-inset-bottom,0px)); font-size:22px;} #danceUi .dstep{width:104px; height:104px;} #danceUi .dstep .arr{inset:16px; font-size:36px; line-height:68px;} #danceUi .dmult{bottom:auto; top:104px;} }`;
    wrap.appendChild(css);
    ctx.layer.appendChild(wrap);
    ui = { wrap, status: wrap.querySelector('#dStatus'), mult: wrap.querySelector('#dMult'), multB: wrap.querySelector('#dMult b'), multBar: wrap.querySelector('#dMult em'),
      step: wrap.querySelector('#dStep'), ring: wrap.querySelector('#dStep .ring'), arr: wrap.querySelector('#dStep .arr'), hearts: wrap.querySelector('#dHearts'), btn: wrap.querySelector('#dBtn') };
    const hold = v => e => { e.preventDefault(); setDance(v); };
    ui.btn.addEventListener('pointerdown', hold(true));
    for (const t of ['pointerup', 'pointercancel', 'pointerleave']) ui.btn.addEventListener(t, hold(false));
    // 마우스: 화면 아무 곳이나 누르고 있기 = 춤
    const zone = wrap.querySelector('.dzone');
    zone.addEventListener('pointerdown', hold(true));
    for (const t of ['pointerup', 'pointercancel', 'pointerleave']) zone.addEventListener(t, hold(false));
    wrap.querySelectorAll('[data-a]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); stepKey(b.dataset.a); }));
  }

  function setDance(v) {
    if (!st || G.play.state !== 'play') { if (st) st.dancing = false; return; }
    if (st.frozen > 0 && v) return;
    st.dancing = v;
    ui.btn.classList.toggle('on', v);
  }

  /* ── 선생님 행동 기계: write → (warn → turn → watch → back) 또는 (warn → 헛기침/곁눈질 → write) ── */
  function teacherNext() {
    const k = G.clamp(st.t / CFG.time, 0, 1), shrink = 1 - k * 0.35;
    const tc = st.teach;
    switch (tc.s) {
      case 'write': {
        tc.s = 'warn'; tc.len = G.rnd(CFG.warn[0], CFG.warn[1]) * (1 - k * 0.3);
        tc.fake = Math.random() < CFG.fakeChance;
        G.sfx.play('hmm');
        break;
      }
      case 'warn':
        if (tc.fake) { tc.s = 'peek'; tc.len = 0.55; }
        else { tc.s = 'turn'; tc.len = 0.2; }
        break;
      case 'peek': tc.s = 'write'; tc.len = G.rnd(CFG.write[0], CFG.write[1]) * shrink; break;
      case 'turn': tc.s = 'watch'; tc.len = G.rnd(CFG.watch[0], CFG.watch[1]); tc.seen = 0; break;
      case 'watch': tc.s = 'back'; tc.len = 0.3; break;
      case 'back': tc.s = 'write'; tc.len = G.rnd(CFG.write[0], CFG.write[1]) * shrink; break;
      default: tc.s = 'write'; tc.len = 2;
    }
    tc.t = 0;
    paintStatus();
  }
  function paintStatus() {
    const s = st.teach.s;
    if (st.frozen > 0) { ui.status.className = 'dstatus watch'; ui.status.textContent = '😠 거기! 뭐 하니?'; return; }
    if (s === 'write') { ui.status.className = 'dstatus safe'; ui.status.textContent = '✍️ 칠판에 쓰는 중 — 지금이야!'; }
    else if (s === 'warn') { ui.status.className = 'dstatus warn'; ui.status.textContent = '🤨 어…? 멈칫!'; }
    else if (s === 'peek') { ui.status.className = 'dstatus warn'; ui.status.textContent = '😶 흠흠… (헛기침)'; }
    else { ui.status.className = 'dstatus watch'; ui.status.textContent = '👀 선생님이 본다! 얼음!'; }
  }
  function paintHearts() { ui.hearts.textContent = '❤️'.repeat(st.lives) + '🤍'.repeat(CFG.lives - st.lives); }

  function caught() {
    st.lives--; st.caughtN++;
    st.danceTime = 0; st.dancing = false; st.frozen = 1.5;
    ui.btn.classList.remove('on');
    G.sfx.play('caught');
    G.ctx.flash('딱 걸렸다! 😱', 'bad', 1200);
    st.shake = 0.4;
    paintHearts(); paintStatus();
    st.teach.s = 'watch'; st.teach.t = 0; st.teach.len = 1.6; st.teach.seen = 1;
    if (st.lives <= 0) st.endAt = st.t + 1.3;
  }

  /* ── 리듬 스텝: 춤추는 동안 박자마다 화살표 ── */
  function spawnStep() {
    const dirs = Object.keys(ARROWS);
    st.stepNote = { dir: G.pick(dirs), at: st.beatClock + 2 * st.beat, born: st.beatClock, hit: false };
    ui.arr.textContent = ARROWS[st.stepNote.dir];
    ui.step.hidden = false;
  }
  function stepKey(dir) {
    if (!st || G.play.state !== 'play' || !st.stepNote || !st.dancing) return;
    const n = st.stepNote, d = Math.abs(st.beatClock - n.at);
    if (dir !== n.dir || d > 0.3) { G.ctx.flash('삐끗!', 'bad', 450); st.stepNote = null; ui.step.hidden = true; st.stepStreak = 0; return; }
    const perfect = d < 0.12;
    const m = st.mult;
    const pts = (perfect ? 15 : 8) * m;
    st.score += pts; st.stepStreak++; if (perfect) st.perfects++;
    st.move = { dir, t: 0 };
    G.sfx.play(perfect ? 'perfect' : 'coin');
    G.ctx.flash(`${perfect ? 'PERFECT' : 'GOOD'} +${pts}`, perfect ? 'gold' : 'good', 500);
    st.stepNote = null; ui.step.hidden = true;
  }

  function stats() {
    const left = Math.max(0, Math.ceil(CFG.time - st.t));
    G.ctx.setStats([
      { label: '점수', value: Math.floor(st.score) },
      { label: '목표', value: CFG.goal },
      { label: '남은 시간', value: left, warn: left <= 10 },
    ]);
  }

  function end() {
    const ok = st.score >= CFG.goal;
    G.ctx.finish({
      success: ok, record: Math.floor(st.score), big: `${Math.floor(st.score)}점`,
      progress: st.score / CFG.goal,   // 못 채워도 모은 만큼
      title: ok ? (st.caughtN === 0 ? '완벽한 비밀 댄서! 🕺' : '선생님 몰래 성공! 💃') : st.lives <= 0 ? '교무실로 가자… 😵' : '시간 종료!',
      lines: [
        ok ? `목표 ${CFG.goal}점 달성!` : `목표 ${CFG.goal}점까지 ${Math.ceil(CFG.goal - st.score)}점 모자랐어요.`,
        `발각 ${st.caughtN}번 · 최고 배수 ×${st.bestMult} · PERFECT 스텝 ${st.perfects}번`,
        '팁: 🤨 신호가 뜨면 바로 손을 떼요. 헛기침일 때도 있지만 조심해서 나쁠 건 없어요!',
      ],
    });
  }

  G.registerGame({
    id: 'dance', name: '선생님 몰래 춤추기', icon: '💃', color: '#ff7eb6',
    place: '놀이초등학교 교실 맨 뒷자리 (정문 → 복도 → 뒷문)',
    tagline: '선생님이 칠판에 쓸 때 춤! 돌아보면 얼음! 들키지 말고 점수를 모아요.',
    rules: [
      `<b>${CFG.time}초</b> 안에 <b>${CFG.goal}점</b> — 목숨 ❤️ ${CFG.lives}개`,
      '누르고 있는 동안 춤을 춰요. 오래 이어 출수록 <b>×2 → ×3 → ×4</b>',
      '<b>🤨 멈칫</b> 신호 = 곧 돌아봐요. 👀 보는 동안(바닥 빨간 부채꼴) 춤추면 <b>발각</b>!',
      '가끔은 헛기침만 하고 다시 칠판을 봐요 — 속지 마세요',
      '춤추는 중 머리 위 화살표: 원이 닫힐 때 같은 방향키 → <b>PERFECT</b> 보너스',
    ],
    controlsKey: 'Space(또는 마우스) 누르고 있기 = 춤 · 방향키/WASD = 스텝 · Esc 잠깐 멈춤',
    controlsTouch: '왼쪽 💃 버튼 꾹 = 춤 · 오른쪽 화살표 = 스텝',
    format: v => `${v}점`,
    world: 'city',
    spotRadius: 2.2,
    debug: () => st,
    init(ctx) { buildUi(ctx); },
    enter(ctx) {
      ui.wrap.hidden = false;
      me.visible = true;
      G.camera.fov = danceFov(); G.camera.updateProjectionMatrix();
      G.explore.setMarkersVisible(false);
      st = null;
      G.resetPose(teacher); teacher.rotation.y = -Math.PI / 2;
      coneMat.opacity = 0;
      ui.status.className = 'dstatus safe'; ui.status.textContent = '✍️ 선생님이 칠판에 쓰는 중';
      ui.step.hidden = true;
    },
    start(ctx) {
      st = {
        t: 0, score: 0, lives: CFG.lives, caughtN: 0, perfects: 0, bestMult: 1, stepStreak: 0,
        dancing: false, danceTime: 0, mult: 1, frozen: 0, shake: 0, endAt: null, goalShown: false,
        beat: 60 / CFG.bpm, beatClock: 0, beatN: 0, stepNote: null, move: null, pose: 0,
        teach: { s: 'write', t: 0, len: 2.4, fake: false, seen: 0 },
      };
      G.resetPose(me); G.resetPose(teacher); teacher.rotation.y = -Math.PI / 2;
      paintHearts(); paintStatus(); stats();
      ctx.hint(G.touch ? '💃 버튼을 꾹 = 춤, 떼면 얼음' : 'Space를 누르고 있으면 춤, 떼면 얼음!');
      setTimeout(() => { if (G.play.current?.id === 'dance') ctx.hint(''); }, 4000);
    },
    update(dt, now, ctx) {
      if (!st) return;
      st.t += dt;
      const tc = st.teach;
      // ── 카메라 (발각되면 살짝 흔들림) ──
      _v.copy(camPos);
      if (st.shake > 0) { st.shake -= dt; _v.x += G.rnd(-0.08, 0.08); _v.y += G.rnd(-0.06, 0.06); }
      ctx.easeCamera(_v, camLook, dt, 4);
      const fv = danceFov();
      if (Math.abs(G.camera.fov - fv) > 0.1) { G.camera.fov = fv; G.camera.updateProjectionMatrix(); }
      // ── 선생님 ──
      if (st.frozen > 0) { st.frozen -= dt; if (st.frozen <= 0) paintStatus(); }
      tc.t += dt;
      if (tc.t >= tc.len) teacherNext();
      let yaw = -Math.PI / 2, head = 0;
      const k = G.clamp(tc.t / tc.len, 0, 1);
      if (tc.s === 'write') { tRig.armR.rotation.x = -2.2 + Math.sin(st.t * 6) * 0.3; tRig.armR.rotation.z = Math.sin(st.t * 3.3) * 0.25; if (Math.random() < dt * 3) G.sfx.play('chalk'); chalkLine.scale.z = Math.min(4.6, chalkLine.scale.z + dt * 0.5); chalkLine.position.z = 72.2 + chalkLine.scale.z / 2; if (chalkLine.scale.z >= 4.6) chalkLine.scale.z = 0.01; }
      else if (tc.s === 'warn') { tRig.armR.rotation.x = -1.9; head = Math.sin(k * Math.PI) * 0.35; tRig.body.rotation.z = 0.06; }
      else if (tc.s === 'peek') { head = Math.sin(k * Math.PI) * 1.1; tRig.armR.rotation.x = -1.2; }
      else if (tc.s === 'turn') { yaw = G.lerp(-Math.PI / 2, Math.PI / 2, G.smooth(k)); tRig.armR.rotation.x = -0.4; }
      else if (tc.s === 'watch') { yaw = Math.PI / 2; tRig.armR.rotation.x = st.frozen > 0 ? -1.6 : -0.2; tRig.armR.rotation.z = st.frozen > 0 ? 0.5 : 0; tRig.armL.rotation.x = -0.2; }
      else if (tc.s === 'back') { yaw = G.lerp(Math.PI / 2, -Math.PI / 2 + Math.PI * 2, G.smooth(k)); }
      if (tc.s !== 'warn') tRig.body.rotation.z = 0;
      teacher.rotation.y = yaw; tRig.head.rotation.y = -head;
      const watching = tc.s === 'watch' || (tc.s === 'turn' && k > 0.85);
      coneMat.opacity += ((watching ? 0.26 : tc.s === 'turn' ? 0.12 : 0) - coneMat.opacity) * Math.min(1, dt * 12);
      // ── 발각 판정 ──
      if (tc.s === 'watch' && st.frozen <= 0 && st.lives > 0) {
        tc.seen += dt;
        if (st.dancing && tc.seen > CFG.grace) caught();
      }
      // ── 춤 · 점수 ──
      if (st.dancing && st.frozen <= 0 && st.lives > 0) {
        st.danceTime += dt;
        let m = 1; CFG.multAt.forEach((at, i) => { if (st.danceTime >= at) m = i + 1; });
        st.mult = m; st.bestMult = Math.max(st.bestMult, m);
        st.score += CFG.rate * m * dt;
        // 박자
        st.beatClock += dt;
        if (st.beatClock >= (st.beatN + 1) * st.beat) {
          st.beatN++;
          G.sfx.play(st.beatN % 2 ? 'beat' : 'hat');

  const wpos = waterGeo.attributes.position;
  const baseZ = new Float32Array(wpos.count);
  for (let i = 0; i < wpos.count; i++) baseZ[i] = wpos.getZ(i);
  // 양쪽 강둑 + 산책로 (배를 따라 움직이는 긴 띠)
  const banks = new G.Batch();
  for (const s of [-1, 1]) {
    banks.add(1.6, 0.5, 190, s * 8.4, 0.1, 0, 0xA8B394).add(2.4, 0.3, 190, s * 10.3, 0.2, 0, 0xd5c9ae).add(24, 0.4, 190, s * 23.5, 0.05, 0, 0x849577);
  }
  const bankMesh = banks.build(scene); bankMesh.castShadow = false;

  /* ── 둑 위 풍경(나무·건물): 조각을 돌려 쓴다 ── */
  const deco = new T.Group(); scene.add(deco);
  const SCENERY = [];
  const PAL = [0xe1d5bd, 0xb9cddd, 0xd7bca4, 0xc6d4c6, 0xd9ccc8, 0xacc3cf];
  for (let i = 0; i < 26; i++) {
    const g = new T.Group();
    const side = i % 2 ? 1 : -1;
    if (i % 3) {
      const h = G.rnd(4, 11), w = G.rnd(4, 6.5);
      const b = new T.Mesh(G.boxGeo(w, h, w), G.mat(G.pick(PAL))); b.position.y = h / 2; b.castShadow = true; g.add(b);
      const cap = new T.Mesh(G.boxGeo(w * 0.95, 0.35, w * 0.95), G.mat(0x55606A)); cap.position.y = h + 0.17; g.add(cap);
      g.position.x = side * G.rnd(17, 24);
    } else {
      const t = G.makeTree(G.rnd(1, 1.4)); g.add(t);
      g.position.x = side * G.rnd(11.5, 13.5);
    }
    g.userData.gap = G.rnd(12, 20);
    deco.add(g); SCENERY.push(g);
  }

  /* ── 배 ── */
  const boat = G.makeBoat(0xe8533f);
  const driver = G.makePerson({ shirt: 0x3f8fbf, hat: 0xffd23f }); driver.scale.setScalar(0.42); driver.position.set(0, 0.35, -0.3);
  G.sitPose(driver); boat.add(driver);
  const boatWrap = new T.Group(); boatWrap.add(boat); scene.add(boatWrap);
  boat.rotation.y = Math.PI;              // 배의 앞(+z)이 진행 방향(-z)을 보게
  // 물보라 (공유 조각 몇 개)
  const foamMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
  const foamGeo = new T.BoxGeometry(0.25, 0.25, 0.25);
  const foam = [];
  for (let i = 0; i < 18; i++) { const f = new T.Mesh(foamGeo, foamMat); f.visible = false; scene.add(f); foam.push({ m: f, life: 0, vx: 0, vy: 0, vz: 0 }); }
  let foamI = 0;

  /* ── 물 위 물건 (미리 만들어 두고 돌려 쓴다) ── */
  const buoyGeo = new T.CylinderGeometry(0.45, 0.55, 0.9, 10);
  const buoyMat = G.mat(0xff7a1f), buoyGold = new T.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x6a5000 });
  const stripeGeo = new T.CylinderGeometry(0.47, 0.47, 0.18, 10);
  const rockGeo = new T.DodecahedronGeometry(1.1);
  const ringGeo = new T.TorusGeometry(1.7, 0.22, 8, 22);
  const ringMat = new T.MeshLambertMaterial({ color: 0x3ed4c8, emissive: 0x0d4a45 });
  const logGeo2 = new T.BoxGeometry(4.2, 0.55, 0.7);
  const pool = { buoy: [], gold: [], rock: [], log: [], ring: [], duck: [], pillar: [] };
  function make(type) {
    let m;
    if (type === 'buoy' || type === 'gold') {
      m = new T.Group();
      const b = new T.Mesh(buoyGeo, type === 'gold' ? buoyGold : buoyMat); b.castShadow = true; m.add(b);
      const s = new T.Mesh(stripeGeo, G.mat(0xffffff)); s.position.y = 0.15; m.add(s);
      const f = new T.Mesh(G.boxGeo(0.05, 0.9, 0.05), G.mat(0x333333)); f.position.y = 0.85; m.add(f);
      const fl = new T.Mesh(G.boxGeo(0.4, 0.25, 0.03), G.mat(type === 'gold' ? 0xffd23f : 0xe8433f)); fl.position.set(0.2, 1.15, 0); m.add(fl);
    } else if (type === 'rock') {
      m = new T.Mesh(rockGeo, G.mat(0x8a939b)); m.castShadow = true; m.scale.set(1.2, 0.7, 1);
    } else if (type === 'log') {
      m = new T.Mesh(logGeo2, G.mat(0x8b5a2b)); m.castShadow = true;
    } else if (type === 'ring') {
      m = new T.Mesh(ringGeo, ringMat);
    } else if (type === 'duck') {
      m = new T.Group();
      for (let i = 0; i < 3; i++) {
        const d = new T.Group();
        const body = new T.Mesh(G.boxGeo(0.5, 0.35, 0.7), G.mat(0xf6f6f6)); body.position.y = 0.2; d.add(body);
        const head = new T.Mesh(G.boxGeo(0.3, 0.3, 0.3), G.mat(0x2e8b57)); head.position.set(0, 0.5, 0.3); d.add(head);
        const bk = new T.Mesh(G.boxGeo(0.14, 0.08, 0.2), G.mat(0xffa21f)); bk.position.set(0, 0.48, 0.52); d.add(bk);
        d.position.x = (i - 1) * 0.9; d.position.z = -Math.abs(i - 1) * 0.5;
        m.add(d);
      }
    } else if (type === 'pillar') {
      m = new T.Group();
      const p1 = new T.Mesh(G.boxGeo(1.4, 7, 1.4), G.mat(0xb9baa9)); p1.position.y = 3.5; p1.castShadow = true; m.add(p1);
    }
    m.visible = false; scene.add(m);
    return m;
  }
  function take(type) {
    const list = pool[type];
    let o = list.find(v => !v.active);
    if (!o) { o = { m: make(type), active: false, type }; list.push(o); }
    o.active = true; o.m.visible = true; o.hit = false;
    return o;
  }
  // 다리 (기둥 사이로 지나가야 한다)
  const bridgeDeck = new T.Group();
  const deck = new T.Mesh(G.boxGeo(24, 0.8, 3.4), G.mat(0xd5c9ae)); deck.position.y = 7.2; deck.castShadow = true; bridgeDeck.add(deck);
  const rail1 = new T.Mesh(G.boxGeo(24, 0.5, 0.2), G.mat(0x718a91)); rail1.position.set(0, 7.85, 1.6); bridgeDeck.add(rail1);
  const rail2 = rail1.clone(); rail2.position.z = -1.6; bridgeDeck.add(rail2);
  bridgeDeck.visible = false; scene.add(bridgeDeck);
  // 결승선
  const finish = new T.Group();
  const fTex = G.canvasTex(256, 64, g => { for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 16, y * 16, 16, 16); } });
  const banner = new T.Mesh(G.boxGeo(17, 1.4, 0.2), [G.mat(0x333333), G.mat(0x333333), G.mat(0x333333), G.mat(0x333333), new T.MeshBasicMaterial({ map: fTex }), new T.MeshBasicMaterial({ map: fTex })]);
  banner.position.y = 6; finish.add(banner);
  for (const s of [-1, 1]) { const p = new T.Mesh(G.boxGeo(0.6, 6.5, 0.6), G.mat(0xe8533f)); p.position.set(s * 8.2, 3.25, 0); finish.add(p); }
  const fl = G.labelSprite('🏁 결승선', { scale: 1.3, bg: '#1b2b44', border: '#ffd23f' }); fl.position.y = 8; finish.add(fl);
  scene.add(finish);

  let st = null, ui = {};
  const _v = new T.Vector3();

  /* ── 코스 설계: 앞으로 가며 한 줄씩 만든다 ── */
  function spawnRow(z) {
    const k = G.clamp(-z / CFG.length, 0, 1);
    const r = Math.random();
    const lanes = [-5.2, -2.6, 0, 2.6, 5.2];
    if (st.nextBridge && -z >= st.nextBridge) {
      // 다리: 기둥 2개 → 가운데·양옆 세 틈 중 하나로
      st.nextBridge = -z + G.rnd(200, 280);
      st.bridges.push(z);
      for (const x of [-2.6, 2.6]) { const o = take('pillar'); o.m.position.set(x, 0, z); o.r = 0.9; o.d = 0.9; }
      const o = take('buoy'); o.m.position.set(G.pick([-4.8, 0, 4.8]), 0, z - 0.5);
      return;
    }
    if (r < 0.26) {
      // 부표 줄 (S자로 이어짐)
      const x0 = st.trail;
      for (let i = 0; i < 5; i++) {
        st.trail = G.clamp(st.trail + G.rnd(-1.2, 1.2), -CFG.half + 0.5, CFG.half - 0.5);
        const gold = Math.random() < 0.06;
        const o = take(gold ? 'gold' : 'buoy'); o.m.position.set(i ? st.trail : x0, 0, z - i * 3.2);
      }
      st.gapZ = 16;
      return;
    }
    if (r < 0.34 && k > 0.1) { const o = take('ring'); o.m.position.set(G.pick([-3.5, 0, 3.5]), 1.3, z); o.r = 1.6; st.gapZ = 9; return; }
    if (r < 0.46 && k > 0.2) {
      const o = take('duck'); o.m.position.set(G.rnd(-4, 4), 0, z); o.vx = G.pick([-1, 1]) * G.rnd(1.2, 2.0); o.r = 1.25; o.d = 0.7;
      o.m.rotation.y = o.vx > 0 ? Math.PI / 2 : -Math.PI / 2; st.gapZ = 12; return;
    }
    // 장애물 줄: 한두 칸은 꼭 비워 둔다
    const n = k < 0.3 ? 1 : G.pick([1, 2, 2]);
    const free = new Set([Math.floor(G.rnd(0, 5))]);
    const used = [];
    for (let i = 0; i < n; i++) {
      let li; let tries = 0;
      do { li = Math.floor(G.rnd(0, 5)); } while ((free.has(li) || used.includes(li)) && ++tries < 12);
      if (free.has(li) || used.includes(li)) continue;
      used.push(li);
      // 통나무는 가장자리 칸에만 (가운데 길을 막지 않게)
      if ((li === 0 || li === 4) && Math.random() < 0.6) { const o = take('log'); o.m.position.set(lanes[li] + (li ? 0.6 : -0.6), 0.05, z); o.m.rotation.y = G.rnd(-0.2, 0.2); o.r = 1.9; o.d = 0.5; }
      else { const o = take('rock'); o.m.position.set(lanes[li] + G.rnd(-0.3, 0.3), 0.05, z); o.m.rotation.y = G.rnd(0, 3); o.r = 0.95; o.d = 0.8; }
    }
    // 빈 칸에 부표 하나
    const fi = [...free][0];
    if (Math.random() < 0.7) { const o = take('buoy'); o.m.position.set(lanes[fi], 0, z); }
    st.gapZ = G.lerp(16, 13.5, k);
  }

  function buildUi(ctx) {
    const wrap = document.createElement('div');
    wrap.id = 'boatUi'; wrap.hidden = true;
    wrap.innerHTML = `<button class="tbtn bL" data-s="-1">◀</button><button class="tbtn bR" data-s="1">▶</button>
      <div class="bprog"><i></i><b>🏁</b></div><div class="bspeed"><b>0</b><span>km/h</span></div>`;
    const css = document.createElement('style');
    css.textContent = `
      #boatUi .tbtn.bL,#boatUi .tbtn.bR{bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:34vw; max-width:190px; height:120px; font-size:32px;}
      #boatUi .bL{left:18px;} #boatUi .bR{right:18px;}
      body:not(.touch) #boatUi .bL, body:not(.touch) #boatUi .bR{display:none;}
      #boatUi .bprog{position:fixed; left:50%; top:74px; transform:translateX(-50%); width:min(440px,70vw); height:10px; border-radius:99px; background:rgba(10,20,36,.75); border:2px solid #2d4561; pointer-events:none;}
      #boatUi .bprog i{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:99px; background:linear-gradient(90deg,#5ac8fa,#3ed47e);}
      #boatUi .bprog b{position:absolute; right:-28px; top:-9px; font-size:20px; font-weight:400;}
      #boatUi .bspeed{position:fixed; right:22px; top:74px; background:rgba(13,24,41,.85); border:1px solid #263D5F; border-radius:14px; padding:4px 12px; text-align:center; pointer-events:none;}
      #boatUi .bspeed b{display:block; font:26px 'Jua',sans-serif; color:#5ac8fa;} #boatUi .bspeed span{font-size:10px; color:#8FA6C8;}
      #boatUi .bspeed.boost b{color:#3ed4c8; text-shadow:0 0 12px #3ed4c8;}
      @media (max-width:820px){ #boatUi .bprog{top:60px;} #boatUi .bspeed{top:78px; right:10px;} }`;
    wrap.appendChild(css);
    ctx.layer.appendChild(wrap);
    ui = { wrap, prog: wrap.querySelector('.bprog i'), speed: wrap.querySelector('.bspeed'), speedB: wrap.querySelector('.bspeed b') };
    wrap.querySelectorAll('[data-s]').forEach(b => {
      const s = +b.dataset.s;
      b.addEventListener('pointerdown', e => { e.preventDefault(); if (st) st.touch = s; b.classList.add('on'); });
      for (const t of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(t, () => { if (st && st.touch === s) st.touch = 0; b.classList.remove('on'); });
    });
  }

  function resetWorld() {
    for (const k in pool) for (const o of pool[k]) { o.active = false; o.m.visible = false; }
    bridgeDeck.visible = false;
    SCENERY.forEach((g, i) => { g.position.z = -i * 9 + 30; });
    finish.position.set(0, 0, -CFG.length);
  }
  function stats() {
    G.ctx.setStats([
      { label: '부표', value: st.buoys },
      { label: '점수', value: score() },
      { label: '목숨', value: '❤️'.repeat(Math.max(0, st.hearts)) || '—' },
      { label: '시간', value: st.t.toFixed(1) },
    ]);
  }
  function score() { return st.buoys * 10 + st.golds * 40 + (st.done ? Math.max(0, st.hearts) * 50 + Math.max(0, Math.round((75 - st.t) * 3)) : 0); }
  function hit(o) {
    if (st.inv > 0 || o.hit) return;
    o.hit = true;
    st.hearts--; st.inv = 1.3; st.speed *= 0.45; st.boost = 0; st.combo = 0;
    G.sfx.play('crash'); G.ctx.flash(st.hearts > 0 ? '쿵! ❤️ -1' : '배가 멈췄어요…', 'bad', 800);
    st.shake = 0.35;
    if (st.hearts <= 0) { st.done = 'crash'; st.doneT = 0; }
  }
  function burst(x, z, n = 6) {
    for (let i = 0; i < n; i++) {
      const f = foam[foamI++ % foam.length];
      f.m.visible = true; f.life = 0.6; f.m.position.set(x + G.rnd(-0.4, 0.4), 0.3, z + G.rnd(-0.3, 0.3));
      f.vx = G.rnd(-2, 2); f.vy = G.rnd(2, 4); f.vz = G.rnd(-1, 2);
    }
  }

  G.registerGame({
    id: 'boat', name: '강물 부표 레이스', icon: '🚤', color: '#e8533f',
    place: '남쪽 강변 선착장 (다리 건너 서쪽)',
    tagline: '작은 배로 강을 달려요! 부표를 모으고 바위·통나무·다리 기둥을 피해 결승선까지.',
    rules: [
      `<b>결승선</b>까지 가면 성공 — ❤️ ${CFG.hearts}개가 다 떨어지면 실패`,
      '🟠 부표 +10 · 🟡 황금 부표 +50 · 🌀 초록 고리 = 부스터',
      '바위·통나무·다리 기둥·오리 떼에 부딪히면 ❤️ -1 (잠깐 느려져요)',
      '도착하면 남은 ❤️ ×50과 빨리 온 만큼 시간 보너스',
      '↑ 가속 · ↓ 감속 — 길이 좁을 땐 속도를 줄여도 좋아요',
    ],
    controlsKey: '← → 또는 A D로 몰기 · ↑ 가속 · ↓ 감속 · Esc 잠깐 멈춤',
    controlsTouch: '화면 아래 ◀ ▶ 버튼을 누르고 있기',
    format: v => `${v}점`,
    world: 'own', scene, camera,
    debug: () => ({ st, pool }),
    init(ctx) { buildUi(ctx); G.addCamera(camera); },
    enter(ctx) { ui.wrap.hidden = false; newRun(); },
    start(ctx) {
      newRun();
      ctx.hint(G.touch ? '◀ ▶ 버튼으로 배를 몰아요' : '← → 로 몰고 ↑ 가속 · ↓ 감속');
      setTimeout(() => { if (G.play.current?.id === 'boat') ctx.hint(''); }, 3500);
    },
    update(dt, now, ctx) { step(dt, now, ctx); },
    onKey(e, down) {
      if (!st) return;
      const k = e.code;
      if (k === 'ArrowLeft' || k === 'KeyA') st.keys.l = down;
      else if (k === 'ArrowRight' || k === 'KeyD') st.keys.r = down;
      else if (k === 'ArrowUp' || k === 'KeyW') st.keys.u = down;
      else if (k === 'ArrowDown' || k === 'KeyS') st.keys.d = down;
    },
    onBlur() { if (st) { st.keys = {}; st.touch = 0; } },
    exit() { ui.wrap.hidden = true; st = null; },
  });

  function newRun() {
    st = { t: 0, z: 0, x: 0, vx: 0, speed: 0, boost: 0, inv: 0, hearts: CFG.hearts, buoys: 0, golds: 0, combo: 0,
      keys: {}, touch: 0, nextRow: -30, trail: 0, gapZ: 14, nextBridge: 150, bridges: [], done: null, doneT: 0, shake: 0 };
    resetWorld();
    boatWrap.position.set(0, 0, 0); boatWrap.rotation.set(0, 0, 0);
    placeCam(1, 0, true);
    if (G.play.state !== 'idle') stats();
  }

  function placeCam(dt, now, snap) {
    const k = snap ? 1 : 1 - Math.exp(-dt * 6);
    const fov = (camera.aspect < 1 ? 80 : 60) + G.clamp((st.speed - 12) / 22, 0, 1) * 12;   // 세로 화면은 강폭이 다 보이게 넓게
    if (Math.abs(camera.fov - fov) > 0.1) { camera.fov += (fov - camera.fov) * (snap ? 1 : k); camera.updateProjectionMatrix(); }
    _v.set(st.x * 0.55, 4.3, st.z + 8.6);
    if (st.shake > 0) { _v.x += G.rnd(-0.12, 0.12); _v.y += G.rnd(-0.1, 0.1); }
    camera.position.lerp(_v, snap ? 1 : Math.min(1, dt * 10));
    camera.lookAt(st.x * 0.75, 0.6, st.z - 11);
    sun.position.set(camera.position.x + 10, 25, st.z + 5);
    sun.target.position.set(camera.position.x, 0, st.z - 10);
  }

  function step(dt, now, ctx) {
    if (!st) return;
    const k = G.clamp(-st.z / CFG.length, 0, 1);
    if (!st.done) st.t += dt;
    // ── 속도 ──
    let target = G.lerp(CFG.speed[0], CFG.speed[1], k);
    if (st.keys.u) target *= 1.2;
    if (st.keys.d) target *= 0.55;
    if (st.boost > 0) { st.boost -= dt; target = CFG.boost; }
    if (st.done) target = st.done === 'crash' ? 0 : 6;
    st.speed += (target - st.speed) * Math.min(1, dt * (st.boost > 0 ? 4 : 1.6));
    st.z -= st.speed * dt;
    // ── 조향 ──
    const steer = (st.keys.r ? 1 : 0) - (st.keys.l ? 1 : 0) + st.touch;
    st.vx += (G.clamp(steer, -1, 1) * CFG.steer - st.vx) * Math.min(1, dt * 7);
    if (st.done) st.vx *= 0.9;
    st.x = G.clamp(st.x + st.vx * dt, -CFG.half, CFG.half);
    if (Math.abs(st.x) >= CFG.half) st.vx *= 0.5;
    boatWrap.position.set(st.x, Math.sin(now * 0.006) * 0.06, st.z);
    boatWrap.rotation.z = -st.vx * 0.03;
    boatWrap.rotation.y = -st.vx * 0.035;
    boat.rotation.x = -0.04 - G.clamp(st.speed / 40, 0, 0.1);
    if (st.inv > 0) { st.inv -= dt; boat.visible = Math.floor(st.inv * 12) % 2 === 0; } else boat.visible = true;
    if (st.shake > 0) st.shake -= dt;
    // ── 물·둑·풍경을 배 따라 옮긴다 ──
    water.position.z = st.z - 60;
    bankMesh.position.z = st.z - 60;
    const t = now * 0.002;
    for (let i = 0; i < wpos.count; i++) {
      const x = wpos.getX(i), wz = baseZ[i] + water.position.z;
      wpos.setY(i, Math.sin(x * 0.5 + t) * 0.12 + Math.cos(wz * 0.5 + t) * 0.12);
    }
    wpos.needsUpdate = true;
    for (const g of SCENERY) if (g.position.z > st.z + 25) g.position.z -= 26 * 9 + G.rnd(-3, 3);
    // ── 앞쪽 줄 만들기 ──
    while (st.nextRow > st.z - CFG.view && -st.nextRow < CFG.length - 20) { spawnRow(st.nextRow); st.nextRow -= st.gapZ; }
    // 다리 상판
    const nb = st.bridges.find(bz => bz < st.z + 12 && bz > st.z - CFG.view);
    bridgeDeck.visible = nb !== undefined; if (nb !== undefined) bridgeDeck.position.z = nb;
    // ── 물건: 움직임·충돌·수집 ──
    for (const type in pool) for (const o of pool[type]) {
      if (!o.active) continue;
      const m = o.m;
      if (m.position.z > st.z + 12) { o.active = false; m.visible = false; continue; }
      if (type === 'duck') { m.position.x += o.vx * dt; if (Math.abs(m.position.x) > CFG.half) o.vx = -o.vx, m.rotation.y = -m.rotation.y; }
      if (type === 'buoy' || type === 'gold') { m.position.y = Math.sin(now * 0.004 + m.position.z) * 0.12; m.rotation.y += dt; }
      if (type === 'ring') m.rotation.y = Math.sin(now * 0.002) * 0.3;
      const dz = Math.abs(m.position.z - st.z), dx = Math.abs(m.position.x - st.x);
      if (dz > 2.5 || st.done) continue;
      if (type === 'buoy' || type === 'gold') {
        if (dx < 1.2 && dz < 1.3) {
          o.active = false; m.visible = false;
          st.combo++;
          if (type === 'gold') { st.golds++; st.buoys++; G.sfx.play('perfect'); ctx.flash('🟡 황금 부표 +50', 'gold', 600); }
          else { st.buoys++; G.sfx.play('coin'); if (st.combo % 5 === 0) ctx.flash(`🟠 ${st.combo}연속!`, 'good', 500); }
          burst(m.position.x, m.position.z, 4);
        }
      } else if (type === 'ring') {
        if (dx < o.r && dz < 0.8 && !o.hit) { o.hit = true; st.boost = 1.6; G.sfx.play('whoosh'); ctx.flash('🌀 부스터!', 'good', 600); }
      } else if (dx < o.r + 0.6 && dz < (o.d || 0.8) + 0.9) hit(o);
    }
    // 물보라
    if (Math.random() < dt * (st.speed * 0.6)) { const f = foam[foamI++ % foam.length]; f.m.visible = true; f.life = 0.5; f.m.position.set(st.x + G.rnd(-0.6, 0.6), 0.2, st.z + 1.6); f.vx = G.rnd(-1.5, 1.5); f.vy = G.rnd(1, 2.4); f.vz = G.rnd(1, 3); }
    for (const f of foam) {
      if (!f.m.visible) continue;
      f.life -= dt; f.vy -= 9 * dt;
      f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      if (f.life <= 0 || f.m.position.y < 0) f.m.visible = false;
    }
    // ── 결승 ──
    if (!st.done && -st.z >= CFG.length) {
      st.done = 'finish'; st.doneT = 0;
      G.sfx.play('win'); ctx.flash('🏁 결승선 통과!', 'gold', 1400);
    }
    if (st.done) {
      st.doneT += dt;
      if (st.doneT > 1.4) {
        const ok = st.done === 'finish';
        const sc = score();
        return ctx.finish({
          success: ok, record: sc, big: `${sc}점`,
          progress: ok ? 1 : (-st.z) / CFG.length,   // 못 가도 간 거리만큼
          title: ok ? '결승선 통과! 🏁' : '배가 멈췄어요 💦',
          lines: [
            `부표 ${st.buoys}개 (황금 ${st.golds}개) · ${ok ? `${st.t.toFixed(1)}초 · 남은 ❤️ ${st.hearts}` : `${Math.round(-st.z)}/${CFG.length}m 지점`}`,
            ok ? `점수 = 부표 ×10 + 황금 ×40 + ❤️ ×50 + 시간 보너스` : '팁: 부딪히기 전에 ↓로 속도를 줄이면 피하기 쉬워요',
          ],
        });
      }
    }
    ui.prog.style.width = (k * 100).toFixed(1) + '%';
    const kmh = Math.round(st.speed * 3.2);
    if (ui._kmh !== kmh) { ui._kmh = kmh; ui.speedB.textContent = kmh; }
    ui.speed.classList.toggle('boost', st.boost > 0);
    placeCam(dt, now, false);
    if (ctx.hudDue(dt)) stats();
  }
})(window.G);

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   main.js — 시작 화면과 단일 렌더 루프
   · requestAnimationFrame 하나만 돈다. dt 상한 0.05초 (원본과 같음)
   · 자기 씬을 쓰는 게임 중에는 도시 애니메이션을 멈추고 그 게임 씬만 그린다
   ═══════════════════════════════════════════════════════════════ */
(function (G) {
  const $ = G.$, E = G.explore, P = G.play, renderer = G.renderer;

  // 정적 장식 상자를 한 번에 합쳐 그리기 횟수를 줄인다 (places.js까지 다 모은 뒤)
  G.cityBatch.build(G.scene);
  E.buildMarkers();
  G.hub.refresh();

  const cams = [G.camera];
  G.addCamera = c => { cams.push(c); resize(); };
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    for (const c of cams) { c.aspect = w / h; c.updateProjectionMatrix(); }
  }
  addEventListener('resize', resize);
  resize();

  /* ── 시작 화면 ── */
  G.main = {
    begin() {
      if (E.mode !== 'title') return;
      G.sfx.unlock(); G.sfx.play('click');
      $('title').hidden = true;
      ['topbar', 'mapDock'].forEach(id => { $(id).hidden = false; });
      G.paintTotal();   // 지난번까지 모은 마을 점수를 바로 보여 준다
      E.begin();
    },
  };
  $('startBtn').addEventListener('click', () => G.main.begin());
  if (G.touch) document.body.classList.add('touch');
  document.body.classList.add('dev-' + G.DEVICE);

  // 기기 모드 버튼 초기화 및 이벤트 연결
  document.querySelectorAll('.devPickBtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dev === G.DEVICE);
    btn.addEventListener('click', () => {
      G.sfx.unlock(); G.sfx.play('click');
      G.setDevice(btn.dataset.dev);
    });
  });

  const devSwitchBtn = $('devSwitchBtn');
  if (devSwitchBtn) {
    devSwitchBtn.textContent = G.DEVICE === 'phone' ? '📱' : (G.DEVICE === 'tablet' ? '📟' : '💻');
    devSwitchBtn.addEventListener('click', () => {
      G.sfx.unlock(); G.sfx.play('click');
      const order = ['pc', 'tablet', 'phone'];
      const next = order[(order.indexOf(G.DEVICE) + 1) % order.length];
      G.setDevice(next);
      G.toast(`화면 모드: ${next === 'phone' ? '📱 핸드폰' : (next === 'tablet' ? '📟 태블릿' : '💻 노트북')}`, 1500);
    });
  }

  /* ── 렌더 루프 ── */
  let last = performance.now(), swingT = 0, offset = 0;   // offset: 점검용 step()이 앞당긴 시간
  function tick(real) {
    requestAnimationFrame(tick);
    const now = real + offset;
    const dt = G.clamp((now - last) / 1000, 0, 0.05);
    last = now;
    const def = P.current;
    const ownScene = def && def.world === 'own' && P.state !== 'idle';
    if (!ownScene) {
      G.world.update(dt, now);
      swingT += dt;
      if (G.swings) G.swings.forEach((s, i) => { s.rotation.x = Math.sin(swingT * 1.6 + i * 1.3) * 0.35; });
      G.updateSignal?.(dt);
      for (const f of G.ambient) f(dt, now);
    }
    if (def) P.update(dt, now);
    E.update(dt, now);
    if (ownScene) renderer.render(def.scene, def.camera);
    else renderer.render(G.scene, G.camera);
  }
  E.applyOrbit();
  requestAnimationFrame(tick);

  /** 자동 점검용: 그리지 않고 게임 시간만 frames번 진행한다 (콘솔: PlayCity.step(60)) */
  G.step = (frames = 1, dt = 1 / 60) => {
    for (let i = 0; i < frames; i++) {
      offset += dt * 1000; last += dt * 1000;
      const now = last, def = P.current;
      if (!(def && def.world === 'own' && P.state !== 'idle')) { G.world.update(dt, now); G.updateSignal?.(dt); for (const f of G.ambient) f(dt, now); }
      if (def) P.update(dt, now);
      E.update(dt, now);
    }
  };
  // 디버그·자동 점검용 (콘솔에서 G로 모든 상태를 볼 수 있다)
  window.PlayCity = G;
})(window.G);

</script>
<!-- 한 파일 버전이라 오프라인 캐시가 필요 없습니다 -->
</body>
